        if (silent.reason) row(dl, "Почему", silent.reason, silent.src);
      }
    }
    if (dl.children.length) { s.appendChild(dl); filled = true; }
    if (hand && !hand.delivered) {
      const warn = document.createElement("div");
      warn.className = "src warn";
      warn.textContent = "Работа закончена, документ лежит в каталоге задачи, а того, "
        + "что его кто-то получил, на диске нет. Так пролежал час отчёт задачи 783.";
      s.appendChild(warn);
      filled = true;
    }
    const gates = d.gates || [];
    if (gates.length) {
      const head = document.createElement("div");
      head.className = "src"; head.textContent = "наблюдено: гейты verification.md";
      for (const g of gates) {
        const line = document.createElement("div");
        line.className = "gate";
        const mark = document.createElement("span");
        mark.className = "r " + (g.result === "OK" ? "ok" : "bad");
        mark.textContent = g.result;
        const n = document.createElement("span"); n.textContent = g.gate;
        line.appendChild(mark); line.appendChild(n);
        s.appendChild(line);
      }
      s.appendChild(head);
      filled = true;
    }
    return filled;
  }));

  /* The machinery of the run. It is reference — which runner, which sandbox,
     which files moved — so it is last and folded, and `<details>` is used
     because the browser already gives it a focus, a name and a state. */
  const tech = document.createElement("details");
  tech.className = "tech";
  const sum = document.createElement("summary");
  sum.textContent = "Технические детали прогона";
  tech.appendChild(sum);
  const dl = document.createElement("dl"); dl.className = "kv";
  row(dl, "Раннер", d.runner, "поле runner в .runner/runner.json");
  row(dl, "Рабочий процесс", ru(WORKFLOW_RU, d.workflow), "поле workflow в .runner/runner.json");
  row(dl, "Песочница", ru(SANDBOX_RU, d.sandbox), "поле sandbox в .runner/runner.json");
  row(dl, "Репозиторий предмета", d.repo, "поле --repo в .runner/runner.json");
  row(dl, "Ярлык прогона", ru(RUN_STATE_RU, d.state), "поле state в status.json");
  row(dl, "Код возврата", d.exit_code === null || d.exit_code === undefined
      ? null : String(d.exit_code), ".runner/runner.json");
  if (d.moved) {
    row(dl, "Последнее движение артефактов", stamp(d.moved), d.moved_src);
  }
  if (dl.children.length) tech.appendChild(dl);
  const files = d.files || [];
  if (files.length) {
    const box = document.createElement("div");
    box.className = "files";
    for (const f of files) {
      const line = document.createElement("div");
      const n = document.createElement("span"); n.className = "n"; n.textContent = f.name;
      const m = document.createElement("span"); m.className = "m";
      m.textContent = [bytes(f.bytes), stamp(f.at)].filter(Boolean).join(" · ");
      line.appendChild(n); line.appendChild(m);
      box.appendChild(line);
    }
    tech.appendChild(box);
    const src = document.createElement("div");
    src.className = "src";
    /* Names, sizes and times. Opening any of them would be reading the work
       rather than observing it, and a transcript is never listed at all. */
    src.textContent = "имена, размеры и время изменения: " + d.dir
      + " — содержимое не читается, транскрипты не показываются";
    tech.appendChild(src);
  }
  if (dl.children.length || files.length) body.appendChild(tech);

  return body;
}

/* Where the board was when the card was opened, so closing puts the eye back on
   the plate it came from. The card takes the page rather than floating over it —
   that is what removed the last scrollbar inside a box — so the offset has to be
   remembered here instead of being kept by a layer that never moved. */
let boardScroll = 0;
let cardReturn = "board";

/* `keepScroll` is for a live refresh redrawing the card that is already open on
   the same task. Opening a card is a navigation and starts at its top; a
   ten-second poll is not, and sending the reader back to the top of a card they
   were halfway down is the same interruption `location.reload()` used to be. */
function openCard(p, keepScroll, from) {
  if (!openTask) boardScroll = window.scrollY;
  const wasAt = window.scrollY;
  cardReturn = from || currentScreen;
  openTask = p.task;
  el("cardnum").textContent = p.id === null ? "—" : "#" + p.id;
  el("cardname").textContent = p.title;
  const body = el("cardbody");
  body.textContent = "";
  body.appendChild(cardBody(p));
  el("card").classList.add("open");
  el("board").style.display = "none";
  el("tasklist").style.display = "none";
  window.scrollTo(0, keepScroll ? wasAt : 0);
}

function closeCard() {
  openTask = null;
  el("card").classList.remove("open");
  el("board").style.display = cardReturn === "board" ? "flex" : "none";
  el("tasklist").style.display = cardReturn === "tasks" ? "flex" : "none";
  window.scrollTo(0, boardScroll);
}

el("cardclose").addEventListener("click", closeCard);
window.addEventListener("keydown", e => { if (e.key === "Escape" && openTask) closeCard(); });
el("card").addEventListener("click", e => { if (e.target === el("card")) closeCard(); });

/* Which areas the viewer folded open survives a live refresh, so an update
   never yanks the screen out from under someone reading it. */
const shutKey = (col, area) => "shut:" + col + ":" + area;
function isShut(col, area, byDefault) {
  const stored = sessionStorage.getItem(shutKey(col, area));
  return stored === null ? byDefault : stored === "1";
}

/* Одна область одной колонки. Пустая область сюда не попадает вовсе: их считает
   и называет одной строкой `voidsNode` ниже — на живом состоянии пустыми были
   около тридцати пяти блоков из сорока восьми, и каждый занимал высоту
   заголовком и словом «пусто». */
function areaNode(panel, area) {
  const node = document.createElement("section");
  const shut = isShut(panel.key, area.key, area.collapsed);
  node.className = "area a-" + area.key + (shut ? " shut" : "");

  const title = document.createElement("h3");
  /* The heading is still a heading; what folds it is a button inside it, so the
     fold has a focus, a name and a stated state. */
  const head = document.createElement("button");
  head.className = "areahead";
  head.appendChild(document.createTextNode(area.title + " "));
  const n = document.createElement("span");
  n.className = "n"; n.textContent = area.count;
  head.appendChild(n);
  /* «(показано 25, скрыто 188)» рядом с числом 213 говорит то же самое дважды и
     разгоняет заголовок колонки до четырёх строк. Отсечка при этом остаётся
     названной: молчаливая читалась бы как «показано всё». */
  if (area.hidden) head.appendChild(document.createTextNode(
      " · видно " + area.plates.length));
  /* «Старшая» is a comparison, and one plate has nothing to be older than. The
     user said so directly: «Если в группе одна задача, слово „старшая“ не
     показывать». Its age is on the plate itself either way. */
  const oldest = ago(area.oldest);
  if (oldest && area.count > 1) {
    const old = document.createElement("span");
    old.className = "old"; old.textContent = "старшая: " + oldest;
    head.appendChild(old);
  }
  asFolder(head, shut, () => {
    const now = !node.classList.contains("shut");
    node.classList.toggle("shut", now);
    sessionStorage.setItem(shutKey(panel.key, area.key), now ? "1" : "0");
    return now;
  });
  title.appendChild(head);
  node.appendChild(title);

  if (AREA_RULE[area.key]) {
    /* Правило отбора — это тот же аппарат проверяющего, что и «источник»: оно
       позволяет судить список, а не читать его, и уходит за тот же
       переключатель. */
    const rule = document.createElement("div");
    rule.className = "rule prov"; rule.textContent = AREA_RULE[area.key];
    node.appendChild(rule);
  }

  const plates = document.createElement("div");
  plates.className = "plates";
  for (const p of area.plates) plates.appendChild(plateNode(p, area.key));
  /* The product's own open questions, in the same area and the same count as the
     tasks. They are questions to the same person; splitting them into a second
     place with a second number is how seventeen of them stayed off the board. */
  for (const q of (area.questions || [])) plates.appendChild(questionNode(q, area.key));
  for (const q of (area.promises || [])) plates.appendChild(promiseNode(q));
  node.appendChild(plates);
  return node;
}

/* The rule that picked what an area holds, printed with the area. «Надо
   запланировать» is the one area whose entire content is text chosen by a test,
   and the test says less than the heading: what is observed is that no task
   could be linked to the line, which is not the same claim as «эта работа не
   начата». The rule used to be «в строке нет номера задачи», and under it three
   of the four shown lines already had tasks (finding HIGH-1 of review 814). A
   reader who can see the rule can judge the list. */
const AREA_RULE = {
  plan: "строки раздела «В работе», для которых не удалось наблюсти задачу: сверка идёт по номеру-ссылке, по названию задачи в строке и по слагу — под каждой строкой написано, с чем её сверили",
  pickup: "живого прогона нет, гейты не отказали, ничто на диске эту задачу не держит, и в очередь план её не ставил",
  queued: "порядок здесь установлен действующей редакцией портфельного плана — он назван на каждой плашке; ниже плана идут задачи, которые план очередью не называл, но которые стоят за наблюдаемым держателем",
  /* Область, которой на доске не было вовсе, хотя работа в ней стояла: у
     пользователя это «что просто в бэклоге и автоматом не запустится». Держит
     работу здесь только прочитанная редакция плана, и её строка стоит на
     плашке. Молчание редакции о задаче сюда не относится: оно не значит, что по
     задаче нет разбора, и не мешает ей запуститься. */
  backlog: "план не двинет это сам: его действующая редакция держит работу своим словом — эта строка стоит на плашке, и в ней же сказано, чьим словом и когда",
  /* The rule of the area whose contents the user counted by hand and found
     thirteen of sixteen wrong. Printing it is what lets the next reader do the
     same check in a minute instead of an evening. */
  waiting_human: "только то, что спрошено у пользователя письмом или сообщением — с датой и идентификатором — и на что ответа не наблюдалось: ни письма от него в том же треде, ни решения, записанного в строке",
  product_owner: "наши собственные вопросы: открытые, но пользователю их не задавали, либо он ответил, а решение осталось незаписанным. Решает продакт, а не человек",
  ready_to_start: "у задачи записано машиночитаемое условие запуска — после каких задач и какое рабочее дерево она занимает, — и по наблюдению ничто из названного её больше не держит",
  decision_unmet: "на задаче записано решение продакта, а наблюдения, что оно исполнено, нет: для доставки таким наблюдением служит delivery.md или квитанция с идентификатором сообщения",
  undelivered: "задача завершена, документ для человека лежит в каталоге задачи, а свидетельства доставки нет: ни delivery.md, ни квитанции о документе — только события жизненного цикла прогона",
};

function questionNode(q, areaKey) {
  const node = document.createElement("div");
  node.className = "plate p-" + areaKey + " q";
  const head = document.createElement("div");
  head.className = "head";
  const num = document.createElement("span");
  num.className = "num"; num.textContent = q.owner === "user" ? "?" : "·";
  const name = document.createElement("span");
  /* Вопрос, который решаем мы сами, написан нами же и как придётся — «получить
     из офисного контура commit engine, commit API, собранный image и один живой
     trace». На первом экране он стоял английской прозой (приёмка продакта
     2026-08-14, замечание 2), и это та же чужая для читателя строка, что вердикт
     или причина затора: та же граница, тот же переключатель источников.

     Сам вопрос при этом остаётся на экране: он написан по-русски, и за источник
     уезжает только его английский хвост — на сегодняшнем состоянии так выходит
     у всех восьми. Заглушка ниже — последнее средство для вопроса, в котором
     читателю не написано ни одного предложения; фактов, которые доска знала бы
     о вопросе сверх его текста, у неё нет: чей это вопрос, уже сказано надписью
     рядом.

     Вопрос к человеку через эту границу не идёт: «что требуется лично от вас» —
     первый вопрос доски, и ответ «вопрос записан не для этого экрана» отвечал бы
     на него отказом. */
  const asked = q.owner === "user"
    ? { shown: human(q.text), full: null }
    : said(q.text, "вопрос записан не для этого экрана — целиком в источнике");
  name.className = "name fold"; name.textContent = asked.shown;
  head.appendChild(num); head.appendChild(name);
  node.appendChild(head);
  const row = document.createElement("div");
  row.className = "row";
  const sources = [["Вопрос", "раздел «Открытые вопросы» в content/products/" + q.product + "/snapshot.md"]];
  if (asked.full) sources.push(["Вопрос, как записан", asked.full]);
  row.appendChild(tag("вопрос продукта " + q.product));
  /* When it went out, through what, and with which message. This is the whole
     of the rule: an area that tells a person they are blocking work has to show
     what put the question in front of them, and the date and the message are
     what a reader checks it by. */
  if (q.asked_at) {
    const when = tag("спрошено " + q.asked_at + " · " +
      (q.channel === "email" ? "письмо " : "Telegram ") + q.ref);
    if (q.asked_src) sources.push(["Спрошено", q.asked_src]);
    row.appendChild(when);
  }
  node.appendChild(row);
  const bits = [];
  if (q.answer_src) bits.push("ответ: " + q.answer_src);
  if (q.note) bits.push(q.note);
  if (bits.length) {
    const note = document.createElement("div");
    note.className = "asked prov"; note.textContent = bits.join(" · ");
    node.appendChild(note);
  }
  sourceNote(node, sources);
  return node;
}

function promiseNode(q) {
  const node = document.createElement("div");
  node.className = "plate p-plan q";
  const head = document.createElement("div");
  head.className = "head";
  const num = document.createElement("span");
  num.className = "num"; num.textContent = "•";
  const name = document.createElement("span");
  name.className = "name fold"; name.textContent = human(q.text);
  head.appendChild(num); head.appendChild(name);
  node.appendChild(head);
  const row = document.createElement("div");
  row.className = "row";
  row.appendChild(tag("«В работе» продукта " + q.product));
  /* What the line is claimed to be, in the words the observation supports. «Связь
     с задачей не установлена» is a statement about a comparison that failed;
     «задачи нет» would be a statement about the world, and the previous version
     made it on evidence that could not carry it. The comparison itself hangs on
     the same line, so the reader can check the verdict instead of trusting it. */
  row.appendChild(tag("связь с задачей не установлена"));
  node.appendChild(row);
  sourceNote(node, [["Строка", "раздел «В работе» в content/products/" + q.product + "/snapshot.md"],
                    ["Сверка", q.checked]]);
  return node;
}

function channelsNode(panel) {
  const node = document.createElement("div");
  const shut = isShut(panel.key, "chan", true);
  node.className = "chan" + (shut ? " shut" : "");

  /* The summary carries what a folded block must not hide: a repository with
     uncommitted or unpushed work is work that exists and is invisible in prose,
     which is one of the things the board is for. */
  const dirty = panel.repos.filter(r => r.tracked_dirty || r.unpushed);
  const sum = document.createElement("button");
  sum.className = "sum";
  sum.textContent = "Репозитории и связь: " + panel.repos.length;
  if (dirty.length) {
    const warn = document.createElement("span");
    warn.className = "warn";
    warn.textContent = " — не опубликовано в " + dirty.length +
      (dirty.length === 1 ? " репозитории" : " репозиториях");
    sum.appendChild(warn);
  }
  asFolder(sum, shut, () => {
    const now = !node.classList.contains("shut");
    node.classList.toggle("shut", now);
    sessionStorage.setItem(shutKey(panel.key, "chan"), now ? "1" : "0");
    return now;
  });
  node.appendChild(sum);

  const body = document.createElement("div");
  body.className = "body";
  const names = { telegram: "Telegram", email: "Почта продакта", git: "Git" };
  const out = [];
  for (const c of panel.channels) {
    out.push(names[c.channel] + (c.direction === "in" ? " входящих " : " исходящих ") + c.count);
  }
  if (out.length) {
    const line = document.createElement("div");
    line.textContent = "Связь: " + out.join(" · ");
    body.appendChild(line);
  }
  /* Commits and pushes at the level of the product, not the task: nothing on
     disk ties a commit to a task number, so no such tie is drawn. */
  for (const repo of panel.repos) {
    const line = document.createElement("div");
    const head = document.createElement("b");
    head.textContent = repo.name;
    line.appendChild(head);
    line.appendChild(document.createTextNode(" " + (repo.branch || "?") + " · " +
      (repo.head || "?") + " · " + (repo.head_subject || "")));
    if (repo.tracked_dirty || repo.unpushed) {
      const warn = document.createElement("span");
      warn.className = "warn";
      const bits = [];
      if (repo.tracked_dirty) bits.push("незакоммичено " + repo.tracked_dirty);
      if (repo.unpushed) bits.push("не отправлено " + repo.unpushed);
      warn.textContent = " — " + bits.join(", ");
      line.appendChild(warn);
    }
    body.appendChild(line);
  }
  node.appendChild(body);
  return node;
}

function stripItem(p, cls) {
  const s = document.createElement("span");
  s.className = "item " + cls;
  /* Направление — первым словом самой строки, а не подсказкой: «что идёт прямо
     сейчас» спрошено вместе с направлением, задачей, автором и возрастом. */
  const bits = [];
  if (p.thread) bits.push(p.thread + " ·");
  bits.push("#" + p.id, human(p.title));
  if (p.actor) bits.push("— " + p.actor);
  if (p.role) bits.push("(" + (ROLE_RU[p.role] || p.role) + ")");
  const age = ago(ageOf(p));
  if (age) bits.push("· " + age);
  s.textContent = bits.join(" ");
  /* The jam is named on the first screen, so its reason has to be there too:
     «где затор» without «почему» is two thirds of an acceptance question. The
     text is shown as its own span and in full, so it is read rather than
     hovered over or cut. The observed reason and a live child's activity line
     are two different facts — as they are on the plate — so they keep two
     classes: `.why` carries a paired source and `.doing` does not. */
  const why = p.why || p.happening;
  const reason = said(why, p.why
    ? insteadOfWords(p, "в источнике")
    : "исполнитель пишет о ходе работы себе — строка целиком в источнике");
  if (why) foldable(s, p.why ? "why" : "doing", " — " + reason.shown, "span");
  /* The direction this item belongs to and what observed its reason. Both used
     to be `title`, which is to say neither existed on a phone. */
  sourceNote(s, [["Направление", p.thread],
                 [p.why ? "Почему" : "Что делает",
                  p.why ? p.why_src : "строка progress.json ребёнка"],
                 [p.why ? "Почему, как записано" : "Строка исполнителя", reason.full]]);
  return s;
}

/* The headline of the whole board: what the user still owes, what it is made of,
   and what we owe ourselves. The two numbers stand together because the split
   between them is the point — a number that merely got smaller would read as
   questions having been thrown away. */
function waitingGroup(board) {
  const grp = document.createElement("div");
  grp.className = "grp";
  const lbl = document.createElement("span");
  /* Единственная строка доски, обращённая к человеку. Она была набрана серым,
     тем же весом, что и всё остальное, и склеена с нашим внутренним «решает
     продакт: 19» — то есть читалась как ещё одна служебная надпись. */
  lbl.className = "lbl you"; lbl.textContent = "Требуется от вас";
  const n = document.createElement("span");
  n.className = board.waiting ? "ask you" : "none";
  /* The number, and what it is made of. A single figure nobody could take apart
     is what let thirteen wrong entries stand as an answer; split by source, a
     reader can check it against the first area of the columns below. */
  const parts = [];
  if (board.waiting_tasks) parts.push(board.waiting_tasks + " в задачах");
  if (board.waiting_questions) parts.push(board.waiting_questions + " вопросов продуктов");
  n.textContent = board.waiting
    ? board.waiting + " — " + parts.join(" и ") + ", первой областью в колонках ниже"
    : "ничего: всё, что спрашивали у вас, отвечено";
  grp.appendChild(lbl); grp.appendChild(n);
  /* Нерешённое продактом — работа продакта, а не долг человека: приклеенное к
     его строке, оно читалось как его. Уходит за переключатель источников; сами
     вопросы стоят областью «Решает продакт» в колонках. */
  const ours = document.createElement("span");
  ours.className = (board.ours ? "ours" : "none") + " prov";
  ours.textContent = board.ours
    ? "· решает продакт: " + board.ours + ", своей областью в колонках"
    : "· у продакта нерешённого нет";
  grp.appendChild(ours);
  return grp;
}

function drawStrip(board) {
  const strip = el("strip");
  strip.textContent = "";
  /* Полоса отвечает на три вопроса из четырёх: что идёт прямо сейчас, что стоит
     и почему, что требуется лично от вас. Четвёртый — по направлениям — в
     колонках, которые теперь стоят сразу под ней.

     «Что подхватить» убрано: это наш список дел, запустить оттуда пользователь
     ничего не может. Сам список остался областью «Можно подхватить» в колонке.
     Пустая группа «Сделано, но не доставлено» не рисуется: строка, сообщающая,
     что сообщать нечего, занимает место ответа. */
  const groups = [
    ["Кто работает сейчас", board.now, "who",
     "никто: живого прогона нет ни в одном направлении — почему, сказано в каждой "
     + "колонке ниже", board.now_hidden, true],
    ["Где затор", board.jams, "jam", "заторов нет", board.jams_hidden, true],
    /* Finished work whose result nobody was shown. It is on the strip because
       that is the only place it would have been noticed: 783 finished at 16:14
       and its 441 KB report lay on the server for an hour, behind two receipts
       that both spoke about the life of the run. */
    ["Сделано, но не доставлено", board.undelivered, "undelivered",
     "", board.undelivered_hidden, false],
  ];
  /* The headline stands first, before the names. It is the question that made
     this board wrong — sixteen entries of which the user owned three — so it is
     the one line that must be читаемо without scrolling anything, including on a
     390-wide screen where the strip is several lines tall. */
  strip.appendChild(waitingGroup(board));
  for (const [label, items, cls, empty, hidden, whenEmpty] of groups) {
    if (!items.length && !whenEmpty) continue;
    const grp = document.createElement("div");
    grp.className = "grp";
    const lbl = document.createElement("span");
    lbl.className = "lbl"; lbl.textContent = label;
    grp.appendChild(lbl);
    if (!items.length) {
      const none = document.createElement("span");
      none.className = "none"; none.textContent = empty;
      grp.appendChild(none);
    }
    for (const p of items) grp.appendChild(stripItem(p, cls));
    /* The strip shows as many names as fit with their reason whole, so what it
       did not take has to be counted here: a cap nobody can see reads as
       «показано всё», and the rest stands in the columns below. */
    if (hidden > 0) {
      const more = document.createElement("span");
      more.className = "more";
      more.textContent = "ещё " + hidden + " — в колонках ниже";
      grp.appendChild(more);
    }
    strip.appendChild(grp);
  }
  /* Второй разбуженный продакт. Две пары задач-двойников за час — 790/792 и
     791/793 — были заведены потому, что продакт в консоли и продакт, разбуженный
     таймером, не видели очередей друг друга, поэтому запись остаётся. Но
     адресована она агенту, а не человеку («сверьтесь с его очередью, прежде чем
     заводить задачу»), и на первом экране стоит за переключателем источников. */
  const awake = board.owners_awake || [];
  const mine = document.createElement("div");
  mine.className = "grp prov";
  const ml = document.createElement("span");
  ml.className = "lbl"; ml.textContent = "Другой я";
  mine.appendChild(ml);
  if (!awake.length) {
    const none = document.createElement("span");
    none.className = "none";
    none.textContent = "никто больше не разбужен";
    mine.appendChild(none);
  }
  for (const owner of awake) {
    const s = document.createElement("span");
    s.className = "item jam";
    const age = ago(ageOf({ since: owner.since, age_seconds: owner.age_seconds }));
    const who = owner.kind === "tick"
      ? "фоновое пробуждение треда «" + (owner.thread || "?") + "»"
      : owner.kind === "mail" ? "почтовое пробуждение продакта"
      : owner.kind === "woken" ? "продакт, разбуженный тиком" : "продакт в консоли";
    const trees = (owner.worktrees || []).map(path => path.split("/").pop()).join(", ");
    /* Awake and deciding are two different states, and only the second one is a
       reason to hold back. A window left open used to read here as «сверьтесь с
       его очередью», which is advice to wait for somebody who is not there. */
    const idle = owner.activity && owner.activity.active === false;
    s.textContent = who + (age ? " · " + age : "")
      + (trees ? " · может занять " + trees : " · рабочее дерево не названо")
      + (idle ? " — решение в нём не принимается: работа ему уже передана"
              : " — сверьтесь с его очередью, прежде чем заводить задачу");
    s.title = "наблюдено: " + owner.src
      + (owner.activity ? "; " + owner.activity.src : "");
    mine.appendChild(s);
  }
  strip.appendChild(mine);
}

/* ---------- состояние направления одной строкой ----------
   Вопрос письма дословно: «как быстро я могу понять статус по направлениям,
   глядя на панель? Или для этого мне нужно вчитываться в прозу?». Здесь стояли
   шесть равновесных чисел — «задач 228 · в работе 0 · ждёт пользователя 0 ·
   решает продакт 8 · заторов 1 · не доставлено 0», — большинство нули.

   Собирается из полей, которые сборщик уже отдаёт: области колонки, `startable`
   (тот же предикат, которым считает пробуждение), причины простоя последней
   проверки и слово плана на плашке. Ничего нового не наблюдается. Ею же отвечено
   «что происходит, когда ни одна задача не в работе»: пусто здесь не бывает,
   вместо нуля стоит причина и ближайший следующий шаг. */
function areaOf(panel, key) {
  return panel.areas.find(a => a.key === key) || { count: 0, plates: [], hidden: 0 };
}

/* Ближайшая работа направления, в порядке, в котором её берут: очередь плана,
   готовое к запуску, свободное, задержанное словом плана. */
const NEXT_RU = { queued: "дальше по плану", ready_to_start: "готово к запуску",
                  pickup: "можно подхватить", backlog: "в бэклоге" };

function stateNode(panel) {
  const node = document.createElement("div");
  node.className = "state";
  const running = areaOf(panel, "running");
  const waiting = areaOf(panel, "waiting_human");
  const stuck = areaOf(panel, "stuck");
  const backlog = areaOf(panel, "backlog");
  const queued = areaOf(panel, "queued");

  /* Порядок ветвей — порядок важности для человека, а не порядок областей.
     «Простаивает» стоит выше «стоит»: простой при доступной работе — дефект
     контура, а затор при этом называется строкой ниже. */
  let mark = "свободно", cls = "free", what = "незакрытых работ у направления нет";
  let why = "";
  if (running.count) {
    mark = "идёт"; cls = "live";
    what = running.plates.map(p => "#" + p.id + " " + human(p.title)
      + (p.actor ? " — " + p.actor : "")
      + (ago(ageOf(p)) ? " · " + ago(ageOf(p)) : "")).join("; ")
      + (running.hidden ? " и ещё " + running.hidden : "");
  } else if (waiting.count) {
    mark = "ждёт вашего решения"; cls = "ask";
    what = "вопросов: " + waiting.count + " — первой областью ниже";
  } else if (panel.startable) {
    mark = "простаивает"; cls = "idle";
    /* «К запуску 9» рядом с областью «Готово к запуску 0» читалось
       противоречием, а считают они разное: область — задачи с выполненным
       условием запуска, это число — всё, что вообще ничем не держится. Стоит
       оно теперь в одном месте колонки: под кнопкой печаталось то же самое. */
    what = "живых прогонов нет, а ничто не держит задач: " + panel.startable;
  } else if (backlog.count) {
    mark = "на паузе"; cls = "hold";
    what = "работу держит слово в плане, запускать нечего";
    const place = backlog.plates[0] && backlog.plates[0].plan_place;
    if (place && place.line) why = human(place.line);
  } else if (queued.count) {
    mark = "стоит в очереди"; cls = "hold";
    what = "всё, что стоит, чем-то занято, и начать нечего";
    const first = queued.plates[0];
    if (first && first.why) {
      why = "#" + first.id + " — "
        + said(first.why, insteadOfWords(first, "на плашке ниже")).shown;
    }
  } else if (stuck.count) {
    mark = "стоит"; cls = "stuck"; what = "заторов: " + stuck.count;
  }
  /* Затор называется при любом слове состояния, кроме идущей работы: это и есть
     «что стоит и почему», второй вопрос пользователя. */
  const jam = stuck.plates[0];
  if (!running.count && jam) {
    /* Причина затора — чаще всего вердикт проверяющего или список непройденных
       гейтов, и написаны они не читателю. Решается это до склейки: в собранной
       строке латиница уже утонула бы в русском начале и осталась бы на экране. */
    const reason = said(jam.why, insteadOfWords(jam, "на плашке ниже"));
    why = (why ? why + ". " : "") + "заторов: " + stuck.count + ", старший — #"
      + jam.id + " " + human(jam.title) + (jam.why ? ": " + reason.shown : "");
  }
  const line = document.createElement("div");
  const word = document.createElement("span");
  word.className = "mark " + cls; word.textContent = mark;
  const rest = document.createElement("span");
  rest.className = "what"; rest.textContent = ": " + what;
  line.appendChild(word); line.appendChild(rest);
  node.appendChild(line);

  /* Причины: наблюдаемая по областям, потом названные последней проверкой —
     «занят другой продакт», «занято рабочее дерево», «исчерпан бюджет», «ждём
     ответа пользователя». Это те слова, которых пользователь просил вместо нуля.
     Направление, стоящее без наблюдаемой причины, — его жалоба, сделанная
     видимой, и оно не становится ещё одной серой строкой (`alarm`). */
  const whys = why ? [{ text: why, code: null, src: null }] : [];
  if (!running.count) for (const reason of idleReasons(panel.check)) whys.push(reason);
  for (const reason of whys) {
    foldable(node, "why" + (reason.code === "none_observed" ? " alarm" : ""),
             human(reason.text));
    if (reason.src) {
      const src = document.createElement("div");
      src.className = "why prov"; src.textContent = "наблюдено: " + reason.src;
      node.appendChild(src);
    }
  }

  /* И ближайшая работа: «что дальше по каждому направлению». */
  const next = document.createElement("span");
  next.className = "next";
  next.textContent = "дальше по этому направлению ничего не стоит";
  for (const key of Object.keys(NEXT_RU)) {
    const plate = areaOf(panel, key).plates[0];
    if (!plate) continue;
    next.textContent = NEXT_RU[key] + ": ";
    const name = document.createElement("b");
    name.textContent = "#" + plate.id + " " + human(plate.title);
    next.appendChild(name);
    break;
  }
  node.appendChild(next);
  return node;
}

/* Сколько областей колонки пусты и какие. Один ответ вместо тридцати пяти
   заголовков со словом «пусто». */
function voidsNode(panel) {
  const empty = panel.areas.filter(a => !a.count);
  if (!empty.length) return null;
  const node = document.createElement("div");
  foldable(node, "voids", "пусто в " + empty.length + " областях: "
    + empty.map(a => a.title.toLocaleLowerCase("ru-RU")).join(", "));
  return node;
}

/* When the owner of this direction looks next, when it looked last and what came
   of that look. The user's question in their own words: «панель показывает, что
   в работе ничего нет… тогда почему ничего не делаешь?» — a board that shows a
   column of zeros and never says when anybody last checked leaves that question
   with nowhere to go.

   Every value about the last check is what the tick wrote into
   `state/threads/<тред>.json` at the moment of that check; the next check is
   what systemd reported while this document was being collected. Nothing here
   is the prose of a woken agent, and nothing is recomputed by the page: the
   outcome is the difference between the live runs the tick saw before waking
   the owner and the ones it saw after. */
function checkNode(check, nextCheck) {
  const node = document.createElement("div");
  node.className = "check";

  /* The next check is drawn even when no tick has ever run for this direction:
     the two answers come from two different observations, and «проверок ещё не
     было» says nothing about when the timer fires. */
  if (nextCheck) {
    const next = document.createElement("span");
    next.className = "next";
    next.textContent = nextCheck.at
      ? "следующая проверка " + stamp(nextCheck.at)
      : "когда следующая проверка — неизвестно";
    next.title = "наблюдено: " + nextCheck.src;
    node.appendChild(next);
    /* With no time, the observation that came instead of one is the whole
       answer, so it is printed as text rather than hidden in the tooltip
       above — on a touch screen that tooltip does not exist. Внутренности
       планировщика при этом остаются внутренностями: за переключателем. */
    if (!nextCheck.at) {
      const why = document.createElement("span");
      why.className = "nextwhy prov";
      why.textContent = "наблюдено: " + nextCheck.src;
      node.appendChild(why);
    }
  }

  if (!check) {
    const none = document.createElement("span");
    none.className = "last";
    none.textContent = "проверок этого направления ещё не было";
    node.appendChild(none);
    if (!nextCheck) node.classList.add("none");
    return node;
  }

  const last = foldable(node, "last",
    "прошлая " + stamp(check.at) + " — " + human(check.outcome), "span");
  last.title = "наблюдено: " + check.outcome_src + "; " + check.src;

  /* Причины простоя этой проверки стоят не здесь, а в строке состояния над ней:
     «почему стоит» — один вопрос, и отвечать на него в двух местах колонки
     значит писать один ответ дважды. Правило отбора переехало вместе с ними. */
  return node;
}

/* Причины простоя последней проверки и правило, по которому они что-то
   объясняют: направление, запустившее три задачи, оправдываться не обязано, а
   проверка, которая ещё идёт (`started === null`), ничего не решила. */
function idleReasons(check) {
  if (!check) return [];
  const idle = !check.queue.live && (check.queue.pickup + check.queue.ready + check.queue.decided);
  if (!idle || !Array.isArray(check.started) || check.started.length) return [];
  return check.reasons || [];
}

/* ---------- «продолжить сейчас» ----------
   The twenty-minute timer stays the safety net; this is the way to say «работа
   кончилась, посмотри сейчас» without waiting for it. The request goes to the
   board's own server, which starts `product-thread@<тред>.service` — the same
   unit the timer starts. So a second click, and a firing of the timer in the
   same minute, are one check: systemd runs one instance of a unit, and no
   queue, lock or supervisor of ours stands in for that.

   What the button does *not* do is start a task. It wakes the owner, which
   reads the plan and decides, exactly as it does at any other wake-up.

   Which check a person asked for is remembered here only long enough to say
   «запрос принят»; whether one is running is read from the snapshot, so a
   reload answers it too. */
const asked = new Map();

function continueNode(panel) {
  const node = document.createElement("div");
  node.className = "continue";
  /* A recording has no server to ask, so it says so instead of showing a control
     that cannot do anything: every call to the server on this page lives in one
     place — the live-mode section at the very bottom. */
  if (!LIVE) {
    const said = document.createElement("span");
    said.className = "said";
    said.textContent = "«Продолжить сейчас» работает на живой доске; это снимок,"
      + " и сервера у него нет";
    node.appendChild(said);
    return node;
  }
  const wake = panel.wake || {};
  const running = wake.running === true;
  /* «Запрос принят» is said until the check it asked for has been recorded, and
     then it goes: from that moment the line above answers the same question
     better, with what the check actually came to. */
  const answered = asked.get(panel.key);
  if (answered && !answered.pending && panel.check
      && Date.parse(panel.check.at) > answered.at) asked.delete(panel.key);
  const request = asked.get(panel.key);
  /* Кнопка стоит в каждой колонке и в любом состоянии. Она рисовалась при
     `!panel.live && panel.startable > 0`, то есть ровно в одной колонке из
     четырёх: кнопки «Продолжить» там нет — слово пользователя. Условие снято
     целиком. Нажатие ничего не запускает — оно будит владельца направления,
     который читает план и решает, — а значит осмысленно и при живом прогоне, и
     когда к запуску ноль. Что наблюдается сейчас, говорит строка рядом. */
  const button = document.createElement("button");
  button.type = "button";
  button.className = "primary";
  button.textContent = "Продолжить сейчас";
  /* Выключена, только пока эту проверку и правда просят: идущая проверка и свой
     неотвеченный запрос. Отказ кнопку не выключает — иначе единственный орган
     управления доски неотличим от сломанного. */
  button.disabled = running || (request && (request.pending || request.accepted));
  button.addEventListener("click", () => askToContinue(panel.key));
  node.appendChild(button);

  const said = document.createElement("span");
  said.className = "said";
  if (running) {
    said.textContent = "проверка идёт: продакт смотрит состояние";
    said.title = "наблюдено: " + wake.src;
  } else if (request) {
    said.textContent = request.text;
    /* Что ответил сервер на самом деле — рядом, за общим переключателем. */
    if (request.detail) {
      const detail = document.createElement("span");
      detail.className = "prov";
      detail.textContent = " · ответ сервера: " + request.detail;
      said.appendChild(detail);
    }
  } else if (wake.running === null) {
    /* Not «проверка не идёт»: nobody was there to ask. The button stays, and
       the answer to a press will say what happened. */
    said.textContent = "идёт ли проверка — неизвестно";
    said.title = "наблюдено: " + wake.src;
  } else if (panel.live) {
    said.textContent = "прогон идёт; нажатие попросит продакта посмотреть состояние сейчас";
  } else if (!panel.startable) {
    /* Прежде кнопки здесь просто не было, а молчащий орган управления неотличим
       от сломанного. Чего не хватает — сказано, и нажатие всё равно будит. */
    said.textContent = "начинать нечего: свободных задач у направления нет — "
      + "нажатие всё равно разбудит продакта";
  } else {
    /* Что стоит и почему, колонка уже сказала строкой состояния наверху: там же
       стояло «простаивает: живых прогонов нет, а ничто не держит задач: 10», и
       здесь оно печаталось во второй раз. У кнопки свой вопрос — что сделает
       нажатие, — и отвечает она теперь только на него. */
    said.textContent = "нажатие попросит продакта посмотреть состояние сейчас";
  }
  node.appendChild(said);
  return node;
}

/* The durable goals of one direction: what was promised to the user, where it
   is not converging, which task is the main one and which repair it is waiting
   on. Every line is printed as the store holds it — the board paraphrases a
   promise no more than it paraphrases an observation.

   Пересказывать их доска не будет: текст стоит как записан, но свёрнут до трёх
   строк. Колонка Продукт выводила полторы тысячи знаков прозы цели с путями файлов
   и `journalctl` — это ровно то «вчитываться в прозу», о котором письмо. */
function goalsNode(goals) {
  if (!goals || !goals.length) return null;
  const wrap = document.createElement("div");
  wrap.className = "goals";
  for (const goal of goals) {
    const node = document.createElement("div");
    node.className = "goal";
    node.title = "наблюдено: " + goal.src;

    const head = foldable(node, "head", "цель " + goal.id + " — " + human(goal.outcome));
    if (goal.control === "reinforced") {
      const mode = document.createElement("span");
      mode.className = "mode";
      /* Named in the head rather than hidden in a tooltip: the whole point of
         the mode is that turning it on is visible without asking anybody. */
      mode.textContent = " · усиленный контроль";
      mode.title = goal.signals.map(s => s.text + " (" + s.src + ")").join("; ");
      head.appendChild(mode);
    }

    /* Что обещано — в шапке колонки, а как оно идёт — под складкой: разрыв,
       основная задача, корректирующие и следующий переход отвечают на вопрос
       «как мы к этому идём», и это не тот вопрос, за которым открывают доску. */
    const shut = isShut("goal", goal.id, true);
    const rest = document.createElement("div");
    rest.className = "rest" + (shut ? " shut" : "");
    const open = document.createElement("button");
    open.className = "foldbtn";
    open.textContent = shut ? "как идёт цель" : "свернуть цель";
    asFolder(open, shut, () => {
      const now = !rest.classList.contains("shut");
      rest.classList.toggle("shut", now);
      open.textContent = now ? "как идёт цель" : "свернуть цель";
      sessionStorage.setItem(shutKey("goal", goal.id), now ? "1" : "0");
      return now;
    });
    node.appendChild(open);
    node.appendChild(rest);

    foldable(rest, "gap", "ближайший разрыв: " + human(goal.gap || "не назван"));

    const main = document.createElement("div");
    main.className = "line";
    main.textContent = "основная задача " + goal.main_task +
      (goal.state === "paused" ? " — на паузе" : "");
    rest.appendChild(main);

    if (goal.pause) {
      foldable(rest, "line", "пауза: " + human(goal.pause.reason))
        .title = "наблюдено: " + goal.pause.src;
    }
    for (const item of goal.correctives) {
      /* Closed is shown, not dropped: a closed repair is exactly the point at
         which the chain used to stop, and the next line says what comes after
         it. Приёмка и снятие — разные надписи: написать «принята» над снятым
         ремонтом значило бы вернуть ту самую неправду, ради ухода от которой
         снятие и появилось. */
      const settled = item.settled;
      const said = !settled ? " в работе"
        : (settled.kind === "accepted" ? " принята" : " снята");
      foldable(rest, settled ? "done" : "line",
        "корректирующая " + item.task + said + ": " + human(item.effect))
        .title = (settled && settled.kind === "retired"
          ? "снята: " + settled.reason + "\nнаблюдено: " + settled.src + "\n" : "")
          + "возврат к основной задаче: " + item.return_criterion;
    }
    if (goal.next_transition) {
      foldable(rest, "line", "следующий переход: " + human(goal.next_transition));
    }
    wrap.appendChild(node);
  }
  return wrap;
}

/* Кто ведёт цели этого направления прямо сейчас. Пока строка говорит «сессия
   ведёт», двадцатиминутный тик сознательно не поднимает второго продакта, —
   поэтому она стоит рядом с целями, а не в подсказке, и всегда называет, чем
   живость наблюдена. */
function goalSessionNode(session) {
  if (!session) return null;
  const node = document.createElement("div");
  node.className = "goal";
  node.title = "наблюдено: " + session.src;
  const head = document.createElement("div");
  head.className = "head";
  head.textContent = session.live
    ? "цели ведёт непрерывная сессия · ходов " + session.turns
    : "непрерывной сессии нет — ведёт двадцатиминутный тик";
  node.appendChild(head);
  const why = document.createElement("div");
  /* Чем наблюдена живость сессии — то же «наблюдено», что и всюду: за общим
     переключателем. Сам факт, ведёт цели сессия или тик, остаётся на экране. */
  why.className = (session.live ? "line" : "gap") + " prov";
  why.textContent = session.reason;
  node.appendChild(why);
  if (session.last_turn_at) {
    const last = document.createElement("div");
    last.className = "line prov";
    last.textContent = "последний ход " + session.last_turn_at.slice(11, 16) +
      " UTC · реакция " + session.last_turn_reaction_seconds + " с" +
      (session.recovered ? " · сессия восстановлена watchdog'ом" : "");
    node.appendChild(last);
  }
  if (session.post_check && !session.post_check.resolved) {
    const failure = document.createElement("div");
    failure.className = "gap";
    failure.textContent = session.post_check.told;
    failure.title = "наблюдено: " + session.post_check.src;
    node.appendChild(failure);
  }
  return node;
}

/* ---------- очередь и бэклог: то, что установил план ----------
   Наблюдение очереди не знает: `planned` — это статус, а не место в очереди, и
   план говорит это сам. Пока доска выводила порядок из наблюдения, она называла
   очередью не то, что установлено, а «Надо запланировать» стояло пустым по
   построению. Здесь показывается прочитанная редакция: строки в её порядке, за
   каждой — задачи, которые в ней названы, и рядом то, что наблюдение видит на
   самом деле. */
const AREA_SEEN = {
  running: ["идёт сейчас", "live"], done: ["сделано", "done"],
  undelivered: ["сделано, но не доставлено", "done"],
  stuck: ["затор", "stuck"], waiting_human: ["ждёт решения пользователя", "stuck"],
  queued: ["в очереди", ""], pickup: ["можно подхватить", ""],
  ready_to_start: ["готово к запуску", ""], backlog: ["в бэклоге", ""],
  decision_unmet: ["решено, но не исполнено", "stuck"],
  product_owner: ["решает продакт", ""],
};

/* Работы, которые строка называет, не будучи про них. Одной строкой и номерами:
   предметом решается порядок очереди, а это — только оговорка «план о них тут
   говорит», и раздел стоит над колонками, где каждая лишняя строка отнимает
   экран у ответа. Название каждой стоит на её собственной плашке. */
function planAlsoNode(tasks) {
  const s = document.createElement("span");
  /* «Также названы» — оговорка о том, что строка упоминает ещё какие-то номера.
     Порядка очереди она не меняет и читателю очереди не нужна: это аппарат
     сверки, и он уходит за общий переключатель источников вместе с ним. */
  s.className = "item prov";
  const mark = document.createElement("span");
  mark.className = "num"; mark.textContent = "также названы: ";
  s.appendChild(mark);
  tasks.forEach((task, index) => {
    const one = document.createElement("span");
    one.className = "name";
    one.textContent = (index ? ", " : "") + "#" + task.id;
    s.appendChild(one);
    const known = AREA_SEEN[task.area];
    const seen = document.createElement("span");
    seen.className = "seen" + (known && known[1] ? " " + known[1] : "");
    seen.textContent = " (" + (known ? known[0]
      : task.area ? task.area : "в направлениях доски не наблюдалась") + ")";
    s.appendChild(seen);
  });
  return s;
}

function planTaskNode(task) {
  const s = document.createElement("span");
  s.className = "item";
  const num = document.createElement("span");
  num.className = "num"; num.textContent = "#" + task.id + " ";
  const name = document.createElement("span");
  name.className = "name"; name.textContent = human(task.title || "");
  s.appendChild(num); s.appendChild(name);
  /* Направление — на самой строке: очередь без него на «статус по
     направлениям» не отвечает. */
  if (task.thread) {
    const where = document.createElement("span");
    where.className = "seen"; where.textContent = " · " + task.thread;
    s.appendChild(where);
  }
  /* Что видит наблюдение там, где план назвал место. Задача, которой доска не
     наблюдала ни в одном направлении, так и говорит: «в направлениях доски не
     наблюдалась» — это утверждение о том, что смотрели, а не о том, что её нет. */
  const seen = document.createElement("span");
  const known = AREA_SEEN[task.area];
  seen.className = "seen" + (known && known[1] ? " " + known[1] : "");
  seen.textContent = " — наблюдение: " + (known ? known[0]
    : task.area ? task.area : "в направлениях доски не наблюдалась");
  s.appendChild(seen);
  return s;
}

function planRow(entry, position) {
  const row = document.createElement("div");
  const closed = entry.tasks.length
    && entry.tasks.every(t => t.area === "done" || t.area === "undelivered");
  row.className = "row" + (closed ? " closed" : "");
  if (position) {
    const pos = document.createElement("span");
    pos.className = "pos"; pos.textContent = position + ".";
    row.appendChild(pos);
  }
  const items = document.createElement("div");
  items.className = "items";
  for (const task of entry.tasks) items.appendChild(planTaskNode(task));
  /* Строка, за которой задачи наблюсти не удалось, показывается целиком: её
     содержание и есть вся запись. «Связь с задачей не установлена» — это
     сверка, которая не сошлась, а не утверждение, что задачи нет. */
  if (!entry.tasks.length) foldable(items, "free", human(entry.text), "span");
  if ((entry.also || []).length) items.appendChild(planAlsoNode(entry.also));
  if (!entry.tasks.length) {
    const mark = document.createElement("span");
    /* Разница честная и важная: строка без предмета, которая всё же называет
       задачи, связана с ними упоминанием, и они перечислены выше. Сказать про
       неё «связь с задачей не установлена» значило бы соврать в обе стороны.
       Читателю очереди это ничего не решает: сверка уходит за переключатель. */
    mark.className = "prov";
    mark.appendChild(tag((entry.also || []).length
      ? "предметом строки задача не названа; названные ею — выше"
      : "связь с задачей не установлена"));
    items.appendChild(mark);
  }
  /* Откуда запись бэклога взята — словами редакции, а не нашим выводом: «На
     паузе» это поле плана, а «очередью не является» — слова самой строки. Тогда
     строка, которая лежит в поле пауз и говорит, что пауза снята, читается как
     устаревшая строка плана, а не как утверждение доски. */
  if (entry.kind) {
    const where = document.createElement("span");
    where.appendChild(tag(entry.field === "paused"
      ? "стоит в «На паузе» плана"
      : "строка плана говорит: очередью не является"));
    items.appendChild(where);
  }
  sourceNote(items, [["Строка плана", entry.text],
                     ["Поле редакции", entry.field], ["Сверка", entry.checked]]);
  row.appendChild(items);
  return row;
}

/* Сколько строк редакции группа показывает сразу. Сразу видна голова списка, то
   есть ближайшее, а хвост складывается и называет своё число: молчаливая отсечка
   читалась бы как «это весь план». Ни строки при этом не теряется. */
const PLAN_ROWS_SHOWN = 4;

/* Строка, каждая задача которой по наблюдению закрыта: в очереди ей не место,
   две из четырёх видимых занимали её верх. Строка не исчезает — уходит в тот же
   раскрываемый хвост, и место в редакции за ней сохраняется. */
function planDone(entry) {
  return entry.tasks.length
    && entry.tasks.every(t => t.area === "done" || t.area === "undelivered");
}

function planGroup(label, owner, entries, empty, numbered) {
  const grp = document.createElement("div");
  grp.className = "grp";
  const lbl = document.createElement("span");
  lbl.className = "lbl"; lbl.textContent = label;
  grp.appendChild(lbl);
  if (owner) {
    const who = document.createElement("div");
    who.className = "owner"; who.textContent = owner;
    grp.appendChild(who);
  }
  /* Место в очереди принадлежит редакции: строка, стоящая в плане пятой,
     остаётся пятой и когда четвёртая уже сделана. */
  const numbered_entries = entries.map((entry, index) => [entry, numbered ? index + 1 : 0]);
  const open = numbered_entries.filter(([entry]) => !planDone(entry));
  const rows = document.createElement("div");
  rows.className = "rows";
  if (!entries.length) {
    const none = document.createElement("div");
    none.className = "none"; none.textContent = empty;
    rows.appendChild(none);
  }
  const shown = open.slice(0, PLAN_ROWS_SHOWN);
  shown.forEach(([entry, position]) => rows.appendChild(planRow(entry, position)));
  grp.appendChild(rows);

  const rest = numbered_entries.filter(pair => !shown.includes(pair));
  if (rest.length) {
    /* Складка та же, что у областей: своё состояние она держит в том же
       `sessionStorage`, поэтому раскрытый хвост переживает живое обновление и
       страница не захлопывается под читающим. */
    const shut = isShut("plan", label, true);
    const tail = document.createElement("div");
    tail.className = "rows" + (shut ? " shut" : "");
    rest.forEach(([entry, position]) => tail.appendChild(planRow(entry, position)));
    const more = document.createElement("button");
    more.className = "more";
    /* Кнопкой и словами: «ещё строк редакции: 19» серым мелким шрифтом читалось
       сноской, и никто не понимал, что на неё жмут. */
    more.textContent = shut ? "показать все " + entries.length : "свернуть";
    asFolder(more, shut, () => {
      const now = !tail.classList.contains("shut");
      tail.classList.toggle("shut", now);
      more.textContent = now ? "показать все " + entries.length : "свернуть";
      sessionStorage.setItem(shutKey("plan", label), now ? "1" : "0");
      return now;
    });
    grp.appendChild(more);
    grp.appendChild(tail);
  }
  return grp;
}

function drawPlan(plan) {
  const node = el("plan");
  node.textContent = "";
  if (!plan || plan.revision === null) {
    /* «Плана нет» — честный ответ и единственный доступный: очередь не выводится
       из статусов, и молчание владельца порядка догадкой не заменяется. */
    const none = document.createElement("div");
    none.className = "none";
    none.textContent = "Портфельного плана нет: порядок работ не установлен, "
      + "и доска его не выдумывает. Наблюдено: " + ((plan && plan.src) || "—");
    node.appendChild(none);
    return;
  }
  const owner = "владелец порядка — портфельный план, редакция " + plan.revision
    + " от " + stamp(plan.accepted_at) + "; доска только читает его";
  node.appendChild(planGroup("В очереди", owner, plan.queue,
                             "очередь пуста: редакция не называет следующих работ", true));
  /* Группа названа тем, что наблюдается, а не выводом: это строки редакции,
     которыми план держит работу. Строка, которая лежит в поле пауз и при этом
     говорит, что пауза снята, читается тогда как устаревшая строка плана — а
     заголовок «разобрано, но на паузе» утверждал бы про неё паузу. Что задача от
     такой строки действительно не запустится, видно в области «В бэклоге» в
     колонках: туда попадает предмет держащей строки — и только он, — но не та
     работа, которую та же редакция поставила в очередь. */
  node.appendChild(planGroup("В бэклоге: план держит это своим словом",
                             "поле «На паузе» редакции и строки, которые сами "
                             + "говорят, что очередью не являются",
                             plan.backlog, "нет: план ничего не держит", false));
}

function drawDayPlan(plan) {
  const rows = el("dayrows");
  rows.textContent = "";
  el("daymeta").textContent = plan.revision
    ? "редакция " + plan.revision + " · состояние — из наблюдаемых задач"
    : "порядок работ не установлен";
  for (const item of plan.outcomes || []) {
    const row = document.createElement("div");
    row.className = "dayrow";
    const name = document.createElement("div");
    name.className = "name";
    const taskNumbers = (item.tasks || []).map(task => "#" + task.id).join(", ");
    name.textContent = human(item.title) + (taskNumbers ? " · " + taskNumbers : "");
    const state = document.createElement("div");
    state.className = "state " + item.state;
    state.textContent = item.state === "done" ? "сделано"
      : item.state === "running" ? "идёт"
      : item.state === "stuck" ? "стоит" : "нет наблюдения";
    const changed = document.createElement("div");
    changed.className = "changed";
    changed.textContent = item.updated_at ? stamp(item.updated_at) : "время не наблюдается";
    const why = document.createElement("div");
    why.className = "why";
    const reason = String(item.reason || "").replace(/^\s*\*\*.+?\*\*\s*/, "");
    why.textContent = reason ? "Почему стоит: " + human(reason)
      : item.state === "done" ? "Завершение подтверждено наблюдаемым статусом"
      : item.state === "running" ? "Работа подтверждена наблюдаемым статусом"
      : "Причина в наблюдаемом состоянии не названа";
    const next = document.createElement("div");
    next.className = "next";
    const nextLabel = document.createElement("b");
    nextLabel.textContent = "Дальше: ";
    next.appendChild(nextLabel);
    next.appendChild(document.createTextNode((item.next || []).length
      ? item.next.map(human).join(" · ")
      : "явная связь с переходом в этой редакции не задана"));
    row.appendChild(name); row.appendChild(state); row.appendChild(changed);
    row.appendChild(why); row.appendChild(next);
    sourceNote(row, [["Результат и переход", item.checked],
                     ["Состояние и время", item.updated_src],
                     ["Причина", item.reason_src]]);
    rows.appendChild(row);
  }
  if (!(plan.outcomes || []).length) {
    const none = document.createElement("div");
    none.className = "none"; none.textContent = "В текущем плане результаты дня не названы";
    rows.appendChild(none);
  }
}

/* Бэклог — строки плана, которые держат работу его собственными словами: в самой
   строке сказано, чьим словом и когда. Раньше эта работа лежала под «можно
   подхватить», то есть доска предлагала подхватить остановленное пользователем.

   Второго вида — «неразобранного» — здесь нет. Им стояли задачи, которых просто
   не называет текущая редакция, и круг 1 независимого ревью показал на 1091,
   1093, 1130 и 1135, что все четыре разобраны в собственных task.md. Раздел
   «сам не запустится» лгал бы о них дважды: они запускаются автоматом. Признака
   разбора контур не наблюдает, выдумывать его нельзя, и постановщик снял
   требование 2026-08-14: задача без строки плана наблюдается не как
   неразобранная, а как неназванная. Что наблюдается на самом деле, стоит на
   самой плашке словами «план о ней не говорит». */

function drawBoard(board, snapshot) {
  drawStrip(board);
  drawDayPlan(board.plan);
  drawPlan(board.plan);
  const columns = el("columns");
  columns.textContent = "";
  for (const panel of board.panels) {
    const col = document.createElement("div");
    col.className = "col";

    const head = document.createElement("div");
    head.className = "colhead";
    const h2 = document.createElement("h2");
    h2.textContent = panel.title;
    head.appendChild(h2);
    /* Строка состояния вместо шести равновесных чисел, и «Продолжить сейчас»
       сразу под ней: ради этого колонку читают, и оба на первом экране. Счёт
       задач направления назван тем, что считает, и уехал за переключатель. */
    head.appendChild(stateNode(panel));
    const now = continueNode(panel);
    if (now) head.appendChild(now);
    const meta = document.createElement("div");
    meta.className = "meta prov";
    meta.textContent = "задач этого направления в каталоге за всё время: "
      + panel.task_count + " — считает не то же, что счётчик вкладки «Задачи» "
      + "(весь каталог) и не то же, что области ниже (незакрытая работа)";
    head.appendChild(meta);
    head.appendChild(checkNode(panel.check, panel.next_check));
    const goals = goalsNode(panel.goals);
    if (goals) head.appendChild(goals);
    const session = goalSessionNode(panel.goal_session);
    if (session) head.appendChild(session);
    col.appendChild(head);

    const body = document.createElement("div");
    body.className = "colbody";
    for (const area of panel.areas) {
      if (area.count) body.appendChild(areaNode(panel, area));
    }
    const voids = voidsNode(panel);
    if (voids) body.appendChild(voids);
    col.appendChild(body);
    col.appendChild(channelsNode(panel));
    columns.appendChild(col);
  }

  drawHead(board);
  drawFeed(DATA.timeline, DATA.timeline_total);
  drawFoot(snapshot);
  if (snapshot.mode === "demo") el("boardmode").textContent = "обезличено";
  /* После отрисовки: нужна ли складка, видно только по измеренной высоте. */
  settleFolds();
}

/* The topmost line of the board: when it was collected, how much is running,
   and — only when there is any — what the user still owes an answer to.

   It used to repeat every area count of every column: «в работе N · ждёт
   решения пользователя N · решает продакт N · заторов N · …», seven numbers
   standing above the same seven numbers. The user asked for the top of the
   board to be the recent changes instead, and for this line to hold three
   things only. The full breakdown did not go anywhere — it is in the columns
   below, where each number stands next to the tasks it counts.

   «В работе N» тоже ушло. Это был счёт без подлежащего, а тот же факт с именем
   задачи, автором и возрастом стоит на двести пикселей ниже, в полосе-сводке:
   два ответа на один вопрос, и худший из них первым. «Ждёт решения пользователя
   N» осталось: оно единственное обращено к человеку, и полоса раскрывает его
   тут же. Значок «живой режим» снят — режим наш, а не его. */
function drawHead(board) {
  const line = el("boardstate");
  line.textContent = "";
  const at = document.createElement("span");
  at.className = "at";
  at.textContent = "обновлено " + new Date(DATA.built_at).toLocaleTimeString("ru-RU");
  line.appendChild(at);

  /* Shown in red when there is anything, and absent altogether when there is
     not. A zero next to «ждёт решения пользователя» is a debt that does not
     exist, and the line is shorter without it. */
  if (board.waiting) {
    const waiting = document.createElement("span");
    waiting.className = "count waiting";
    waiting.textContent = "Ждёт решения пользователя " + board.waiting;
    line.appendChild(waiting);
  }
}

/* The feed above the columns: the last observed changes, freshest first.

   Same records the scribe writes into `state/timeline.jsonl`, shown with the
   instant each change was observed at — a file's mtime, a commit's date, the
   timestamp of a pipeline event — and never with the moment the page drew it.
   The renderer sends only the last few and says how many stayed on disk. */
const KIND_RU = {
  task_appeared: "новая задача", task_status: "смена статуса",
  pipeline_event: "событие пайплайна", artifact: "артефакт",
  activity: "работа идёт", commit: "коммит",
  notification: "уведомление", mail: "письмо"
};

function drawFeed(records, total) {
  const feed = el("feed");
  feed.textContent = "";
  const head = document.createElement("span");
  head.className = "lbl";
  /* «Показано 6 из 5878» обещало корпус, до которого с доски не добраться: то,
     сколько записано в журнале, — факт о нашем журнале, и он за переключателем. */
  head.textContent = "Последние изменения";
  if (records.length) {
    const all = document.createElement("span");
    all.className = "prov";
    all.textContent = " — показано " + records.length + " из " + total
      + " записей журнала state/timeline.jsonl";
    head.appendChild(all);
  }
  feed.appendChild(head);
  if (!records.length) {
    const none = document.createElement("span");
    none.className = "none";
    none.textContent = "лента пуста: наблюдений ещё не записано";
    feed.appendChild(none);
    return;
  }
  for (const record of records) {
    const row = document.createElement("div");
    row.className = "row";
    const when = document.createElement("span");
    when.className = "when";
    /* The exact instant, to the second: «сколько времени назад» is what the
       plates below already say, and a feed of five «минуту назад» in a row says
       nothing about the order of what happened. */
    when.textContent = stamp(record.at) || record.at;
    const kind = document.createElement("span");
    kind.className = "kind";
    kind.textContent = ru(KIND_RU, record.kind);
    const what = document.createElement("span");
    what.className = "what";
    /* Подпись записи — то, что написал о себе ребёнок; она бывает английской, и
       лента — такой же текст для читателя, как всё остальное. */
    const label = said(record.label, "запись сделана не для этого экрана — целиком в источнике");
    what.textContent = label.shown;
    row.appendChild(when); row.appendChild(kind); row.appendChild(what);
    if (record.task_title) {
      const number = String(record.task || "").match(/^(\d+)-/);
      const task = document.createElement("span");
      task.className = "task";
      task.textContent = (number ? "#" + number[1] + " " : "") + human(record.task_title);
      row.appendChild(task);
    }
    sourceNote(row, [["Наблюдено", record.observed_by],
                     ["Направление", record.thread],
                     ["Запись, как написана", label.full]]);
    feed.appendChild(row);
  }
}

/* Ревизия, на которой работает то, что человек читает. Служба держит свой Python
   в памяти с момента запуска, а шаблон страницы читает с диска на каждый запрос:
   14 августа из-за этого полчаса показывалась страница нового шаблона на старом
   сборщике, и узнать это можно было только расследованием в systemd. Здесь стоят
   обе ревизии, и расхождение видно глазами. */
function drawFoot(snapshot) {
  const rev = snapshot.revision || {};
  const foot = el("foot");
  if (!LIVE) {
    const at = DATA.built_at
      ? new Date(DATA.built_at).toLocaleString("ru-RU") : "неизвестного времени";
    foot.textContent = "Сохранённый снимок от " + at + ". Он не обновляется.";
    if (DATA.live_page_url) {
      const link = document.createElement("a");
      link.href = DATA.live_page_url;
      link.textContent = "Открыть живую доску";
      foot.append(" ", link, ".");
    } else {
      foot.append(" Откройте живую доску по обычному адресу вашего SSH-туннеля.");
    }
    return;
  }
  foot.textContent = "Живая доска · установлена ревизия "
    + (rev.running || "неизвестна");
  if (rev.running && rev.disk && rev.running !== rev.disk) {
    const warn = document.createElement("span");
    warn.className = "warn";
    warn.textContent = " · доступно обновление до " + rev.disk
      + ": перезапустите product-owner-board.service";
    foot.appendChild(warn);
  }
  const src = document.createElement("span");
  src.className = "prov";
  src.textContent = " · наблюдено: " + (rev.src || "");
  foot.appendChild(src);
}

/* The index owns only number, title and status. Cards come from task directories
   in the initial document and survive light live polls; they never become index
   data or a second browser-to-disk route. */
function indexedFallback(item) {
  return {
    id: item.id, task: item.task, title: item.title, status: item.status,
    status_detail: null, actor: null, actor_src: null, role: null, role_src: null,
    happening: null, why: null, why_src: null, age_seconds: null, since: null,
    since_src: null, alive: false, stale_label: false, attempt: 0, questions: [],
    asked_user: [], our_questions: [], flags: [], blocked_by: null,
    blocked_by_src: null, plan_place: null,
    detail: { summary: "Задача появилась после загрузки списка; обновите страницу для подробностей.", review: null,
              delivery: null, files: [], moved: null, moved_age_seconds: null,
              moved_src: null, handoff: null, gates: [], dir: item.task,
              runner: null, workflow: null, sandbox: null, state: null,
              current_step: null, refusal: null, refusal_summary: null, repo: null,
              progress: null, stop_reason: null, exit_code: null }
  };
}

function boardPlate(task) {
  return DATA.board.panels.flatMap(p => p.areas).flatMap(a => a.plates)
    .find(p => p.task === task);
}

function openIndexedTask(item) {
  openCard(boardPlate(item.task) || item.card || indexedFallback(item), false, "tasks");
}

/* An empty set means all statuses. It survives a live redraw because the
   controls are rebuilt from the fresh catalogue while the person's selection
   stays here. */
const taskStatuses = new Set();

function drawTaskIndex() {
  const query = el("tasksearch").value.trim().toLocaleLowerCase("ru-RU");
  const order = el("tasksort").value;
  const number = query.replace(/^#/, "");
  const searchesNumber = number.length > 0 && /^\d+$/.test(number);
  const all = DATA.snapshot.task_index || [];
  const filter = el("taskfilter");
  const statuses = [...new Set(all.map(item => item.status || "").filter(Boolean))].sort();
  for (const selected of [...taskStatuses]) {
    if (!statuses.includes(selected)) taskStatuses.delete(selected);
  }
  filter.textContent = "";
  for (const value of statuses) {
    const option = document.createElement("button");
    option.type = "button";
    option.textContent = ru(STATUS_RU, value) || value;
    option.classList.toggle("on", taskStatuses.has(value));
    option.setAttribute("aria-pressed", taskStatuses.has(value) ? "true" : "false");
    option.addEventListener("click", () => {
      if (taskStatuses.has(value)) taskStatuses.delete(value); else taskStatuses.add(value);
      drawTaskIndex();
    });
    filter.appendChild(option);
  }
  el("taskfilterall").classList.toggle("on", taskStatuses.size === 0);
  el("taskfilterall").setAttribute("aria-pressed", taskStatuses.size === 0 ? "true" : "false");
  const ready = taskStatuses.size === 2
    && taskStatuses.has("planned") && taskStatuses.has("in_progress");
  el("taskfilterready").classList.toggle("on", ready);
  el("taskfilterready").setAttribute("aria-pressed", ready ? "true" : "false");
  let shown = all.filter(item => (!taskStatuses.size || taskStatuses.has(item.status))
    && (!query || (searchesNumber && String(item.id).includes(number))
      || String(item.title).toLocaleLowerCase("ru-RU").includes(query)));
  const moment = item => item.updated_at ? Date.parse(item.updated_at) : -Infinity;
  shown = [...shown].sort((a, b) => order === "id_asc" ? a.id - b.id
    : order === "id_desc" ? b.id - a.id
    : order === "updated_asc" ? moment(a) - moment(b)
    : moment(b) - moment(a));
  const rows = el("taskrows");
  rows.textContent = "";
  for (const item of shown) {
    const row = document.createElement("div");
    row.className = "taskrow";
    asButton(row, "Открыть детали задачи #" + item.id + ": " + item.title,
             () => openIndexedTask(item));
    const num = document.createElement("span");
    num.className = "num"; num.textContent = "#" + item.id;
    const name = document.createElement("span");
    name.className = "name"; name.textContent = item.title;
    const status = document.createElement("span");
    status.className = "status"; status.textContent = ru(STATUS_RU, item.status) || "без статуса";
    const updated = document.createElement("span");
    updated.className = "updated";
    updated.textContent = item.updated_at ? stamp(item.updated_at) : "изменение не наблюдается";
    row.appendChild(num); row.appendChild(name); row.appendChild(status); row.appendChild(updated);
    rows.appendChild(row);
  }
  if (!shown.length) {
    const empty = document.createElement("div");
    empty.id = "taskempty"; empty.textContent = "Ничего не найдено";
    rows.appendChild(empty);
  }
  /* Число подписано тем, что считает: три разных числа задач без подписи
     читаются как расхождение. */
  el("taskcount").textContent = shown.length === all.length
    ? "всего задач в каталоге: " + all.length
    : "найдено " + shown.length + " из " + all.length;
}

el("tasksearch").addEventListener("input", drawTaskIndex);
el("taskfilterall").addEventListener("click", () => {
  taskStatuses.clear();
  drawTaskIndex();
});
el("taskfilterready").addEventListener("click", () => {
  taskStatuses.clear();
  for (const status of ["planned", "in_progress"]) taskStatuses.add(status);
  drawTaskIndex();
});
el("tasksort").addEventListener("change", drawTaskIndex);

/* Redraw in place with a fresher document. Live mode used to call
   `location.reload()`, which is fine for a picture and wrong for a tool: it
   throws away the open card, the scroll position and the selection every ten
   seconds, so a person reading a task would be interrupted mid-sentence by a
   repository going dirty somewhere else. The board is rebuilt from the new
   payload, the folded areas already survive through `sessionStorage`, and the
   open card is reopened on the same task if that task is still there. */
function applyFresh(fresh) {
  const cards = new Map((DATA.snapshot.task_index || [])
    .filter(item => item.card).map(item => [item.task, item.card]));
  for (const item of fresh.snapshot.task_index || []) {
    if (!item.card && cards.has(item.task)) item.card = cards.get(item.task);
  }
  DATA.snapshot = fresh.snapshot;
  DATA.board = fresh.board;
  DATA.timeline = fresh.timeline;
  DATA.timeline_total = fresh.timeline_total;
  DATA.built_at = fresh.built_at;
  DATA.digest = fresh.digest;
  const wanted = openTask;
  /* The page is what scrolls now, so the place to keep is the page offset. It
     used to be `#columns.scrollTop`, which is zero on a board that no longer
     has a scrollbar of its own — a live refresh would have quietly sent every
     reader back to the top. */
  const scroll = wanted ? boardScroll : window.scrollY;
  drawBoard(DATA.board, DATA.snapshot);
  drawTaskIndex();
  boardScroll = scroll;
  if (!wanted) window.scrollTo(0, scroll);
  if (wanted) {
    const boardAgain = DATA.board.panels
      .flatMap(p => p.areas).flatMap(a => a.plates)
      .find(p => p.task === wanted);
    const indexAgain = (DATA.snapshot.task_index || []).find(item => item.task === wanted);
    const again = cardReturn === "board" ? boardAgain
      : boardAgain || (indexAgain && (indexAgain.card || indexedFallback(indexAgain)));
    /* A board card that left the board closes; an index card stays while its row
       stays and reuses a fresher board card when one exists. Either way the card
       that stays keeps the reader's page offset through the ten-second poll. */
    if (again) openCard(again, true, cardReturn); else closeCard();
  }
}

/* ---------- two screens ----------
   The board and the searchable task index of 1054. The third one — the
   isometric map with its own dark palette, its playhead and its own switch —
   is gone with the switch itself (task 1067): «переключатели „Доска / Карта“
   убраны и не занимают место». What it played back stays: the timeline is now
   read by the feed above the columns. */
let currentScreen = "board";
function showBoard(on) {
  if (on && openTask) closeCard();     // the card belongs to the board screen
  currentScreen = on ? "board" : "tasks";
  el("board").style.display = on ? "flex" : "none";
  el("tasklist").style.display = on ? "none" : "flex";
  el("card").style.display = "";
  el("toboard").classList.toggle("on", on);
  el("totasks").classList.toggle("on", !on);
  el("toboard2").classList.toggle("on", on);
  el("totasks2").classList.toggle("on", !on);
  sessionStorage.setItem("screen", on ? "board" : "tasks");
}
function showTasks() {
  if (openTask) closeCard();
  showBoard(false);
}
el("toboard").addEventListener("click", () => showBoard(true));
el("totasks").addEventListener("click", showTasks);
el("toboard2").addEventListener("click", () => showBoard(true));
el("totasks2").addEventListener("click", showTasks);

/* Один переключатель на весь аппарат происхождения (`.prov` и правило выше).
   Выключен по умолчанию, ничего не удалено; состояние живёт там же, где складки
   областей, и переживает живое обновление, не сбрасываясь под читающим. */
function showSources(on) {
  document.body.classList.toggle("prov", on);
  el("tosources").classList.toggle("on", on);
  el("tosources").setAttribute("aria-pressed", on ? "true" : "false");
  el("tosources").textContent = on ? "Скрыть источники" : "Показать источники";
  sessionStorage.setItem("sources", on ? "1" : "0");
}
el("tosources").addEventListener("click",
  () => showSources(!document.body.classList.contains("prov")));
showSources(sessionStorage.getItem("sources") === "1");

drawBoard(BOARD, SNAP);
drawTaskIndex();
setInterval(() => {
  for (const node of document.querySelectorAll(".tag.age[data-since]")) {
    const age = ago(ageOf({ since: node.dataset.since }));
    if (age) node.textContent = ageCaption(age);
  }
}, 30000);
showBoard(sessionStorage.getItem("screen") !== "tasks");

/* Live mode: the same renderer, served with a fresh snapshot. A recording never
   takes this branch — `file://` cannot fetch, and its data is already inside. */
if (LIVE) {
  setInterval(async () => {
    try {
      const fresh = await (await fetch(DATA.live_url, { cache: "no-store" })).json();
      /* The digest covers the whole shown document, not the length of the
         timeline. A status change, a run that died, a repository gone dirty —
         none of them append a record, and all of them have to reach the screen
         (finding MEDIUM-1 of review 780). */
      if (fresh.digest !== DATA.digest) applyFresh(fresh);
    } catch (err) { /* server gone: keep showing what we have */ }
  }, 10000);
}
/* The other call to the server, and it stands here for the same reason: every
   `fetch` of this page is inside the live-mode region, so a recording handed to
   somebody cannot reach anything. The button that calls this is not drawn at all
   without `live_url`. */
async function askToContinue(thread) {
  const at = Date.now();
  /* Что сказано о запросе, держит `asked`, а рисует его `continueNode` — как и
     при любой другой перерисовке. Ссылок на кнопку и её строку здесь нет: живое
     обновление раз в десять секунд перерисовывает доску целиком и во время
     запроса тоже, и записывать ответ в узлы, которых уже нет на странице,
     значило бы оставить новую кнопку выключенной до следующего изменения. */
  asked.set(thread, { pending: true, at, text: "запрос отправлен…" });
  drawBoard(DATA.board, DATA.snapshot);
  let request;
  try {
    const answer = await fetch("/wake", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ thread }),
    });
    const said = await answer.json();
    request = (answer.ok && said.accepted)
      ? { accepted: true,
          text: "запрос принят " + new Date().toLocaleTimeString("ru-RU") +
                " — итог проверки появится строкой «прошлая …» выше" }
      /* Отказ говорит по-человечески, а не пересказывает systemd: ответ
         «Failed to connect to bus: Operation not permitted» — это ровно та
         английская строка, которую пользователь читать не должен. Сам ответ не
         теряется: он стоит рядом и включается общим переключателем источников. */
      : { text: "продолжить не удалось: проверку запускает systemd, и он отказал",
          detail: String(said.detail || answer.status) };
  } catch (error) {
    /* A recording opened from a file has no server to ask, and a server that
       went away answers nothing. Either way the person is told, rather than
       left looking at a button that did nothing. */
    request = { text: "продолжить не удалось: доска сейчас без сервера" };
  }
  asked.set(thread, { pending: false, at, ...request });
  drawBoard(DATA.board, DATA.snapshot);
}
</script>
</body>
</html>
