<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта процессной работы</title>
<style>
  :root {
    --ink: #e8ecf5; --dim: #97a3bb; --edge: #1d2536;
    --bg0: #070b14; --bg1: #0e1524; --panel: rgba(14,21,36,.86);
    --live: #4ade80; --blocked: #f87171; --killed: #a78bfa;
    --stale: #fbbf24; --gap: #fb923c; --done: #38bdf8; --idle: #64748b;
    /* «Можно подхватить» and «надо запланировать» are invitations, not alarms,
       so they get their own two hues instead of borrowing a warning colour. */
    --pick: #22d3ee; --plan: #c084fc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, var(--bg1), var(--bg0));
    color: var(--ink); font: 14px/1.45 "Inter", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  .hud { position: fixed; pointer-events: none; }
  .hud > * { pointer-events: auto; }

  #top { top: 0; left: 0; right: 0; padding: 14px 18px; display: flex;
         gap: 16px; align-items: baseline; flex-wrap: wrap;
         background: linear-gradient(180deg, rgba(7,11,20,.92), transparent); }
  #top h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .2px; }
  #top .sub { color: var(--dim); font-size: 12.5px; }
  #mode { font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
          border: 1px solid var(--edge); border-radius: 999px; padding: 2px 9px; color: var(--dim); }

  #panels { top: 62px; right: 14px; width: 310px; display: flex; flex-direction: column; gap: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px;
           padding: 12px 13px; backdrop-filter: blur(9px); max-height: 34vh; overflow: auto; }
  .panel h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }
  .panel h2 b { color: var(--ink); font-size: 13px; margin-left: 4px; }
  .panel li { list-style: none; margin: 0 0 7px; padding-left: 15px; position: relative; font-size: 12.5px; }
  .panel ul { margin: 0; padding: 0; }
  #waiting li::before { content: "?"; position: absolute; left: 0; color: var(--stale); font-weight: 700; }
  #done li::before { content: "✓"; position: absolute; left: 0; color: var(--done); }
  .panel .src { color: var(--dim); font-size: 11px; }

  #legend { left: 14px; top: 62px; width: 232px; background: var(--panel);
            border: 1px solid var(--edge); border-radius: 12px; padding: 11px 12px; backdrop-filter: blur(9px); }
  #legend h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }
  .lg { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; font-size: 12.5px; }
  .lg canvas { width: 34px; height: 26px; flex: none; }

  #bottom { left: 0; right: 0; bottom: 0; padding: 12px 16px 14px;
            background: linear-gradient(0deg, rgba(7,11,20,.96), transparent); }
  #nowline { display: flex; gap: 10px; align-items: baseline; min-height: 34px; margin-bottom: 6px; }
  #nowkind { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
             border: 1px solid var(--edge); border-radius: 6px; padding: 1px 7px; flex: none; }
  #nowtext { font-size: 14px; font-weight: 550; }
  #nowsrc { color: var(--dim); font-size: 12px; }
  #controls { display: flex; gap: 12px; align-items: center; }
  button { background: #162034; color: var(--ink); border: 1px solid var(--edge);
           border-radius: 9px; padding: 7px 13px; font: inherit; cursor: pointer; }
  button:hover { background: #1d2a45; }
  button.primary { background: #1e4f38; border-color: #2f7a55; }
  #scrub { flex: 1; accent-color: var(--live); height: 22px; }
  #clock { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12.5px; min-width: 128px; text-align: right; }
  select { background: #162034; color: var(--ink); border: 1px solid var(--edge);
           border-radius: 9px; padding: 6px 8px; font: inherit; }

  /* ---------- board: the default screen ----------
     Plain plates on purpose. The task is explicit that styling waits until the
     structure reads, so this is typography and spacing and nothing else. */
  #board { position: fixed; inset: 0; overflow: hidden; display: flex; flex-direction: column; }
  #boardhead { padding: 12px 18px 8px; display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap;
               border-bottom: 1px solid var(--edge); }
  #boardhead h1 { margin: 0; font-size: 17px; font-weight: 650; }
  #boardhead .sub { color: var(--dim); font-size: 12.5px; }
  /* The strip above the columns: who is working and where the jam is, by name.
     Both answers have to be readable without scrolling anything. */
  #strip { display: flex; gap: 4px 22px; padding: 7px 18px; border-bottom: 1px solid var(--edge);
           flex-wrap: wrap; font-size: 12.5px; align-items: baseline; }
  #strip .grp { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; max-width: 100%; }
  #strip .lbl { color: var(--dim); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; }
  #strip .who { color: var(--live); }
  #strip .jam { color: var(--blocked); }
  #strip .ask { color: var(--stale); }
  #strip .pick { color: var(--pick); }
  #strip .none { color: var(--idle); }
  /* Every item shows its whole text. Cutting the line into an ellipsis was how
     the strip named four jams and let a person read the reason of one (finding
     HIGH-1 of review 789): three reasons ran to `x=2536.9` inside a 1440 window
     and were elided. The strip is kept short by showing fewer jams — the count
     the renderer fits into `STRIP_GROUP_CHARS`, with the rest counted out loud —
     not by hiding the end of a reason it has already promised to answer.
     `overflow-wrap: anywhere` is required, not cosmetic: an observed reason is
     often one unbroken token (`queued_behind_active_worktree_writers_669_689`)
     and would otherwise push the box past the window on a phone. */
  #strip .item { border: 1px solid var(--edge); border-radius: 6px; padding: 2px 8px;
                 max-width: 100%; white-space: normal; overflow-wrap: anywhere;
                 line-height: 1.35; }
  /* The reason, right next to the jam it belongs to. Dimmer than the name so the
     eye reads «what» first and «why» second, but on the same line and never
     hidden behind a hover. */
  #strip .why { color: var(--dim); }
  /* A live child's activity line: the same fact as `.doing` on the plate, and
     not the observed reason of a jam. */
  #strip .doing { color: var(--dim); }
  /* What the strip did not take. A silent cap reads as «показано всё». */
  #strip .more { color: var(--dim); }
  #strip .grp { flex: 1 1 100%; }

  #columns { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr);
             gap: 12px; padding: 12px 14px 14px; overflow: hidden; min-height: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; min-width: 0;
         border: 1px solid var(--edge); border-radius: 12px; background: rgba(14,21,36,.5); }
  .colhead { padding: 10px 12px 8px; border-bottom: 1px solid var(--edge); }
  .colhead h2 { margin: 0; font-size: 13.5px; font-weight: 620; }
  .colhead .meta { color: var(--dim); font-size: 11.5px; margin-top: 3px; }
  /* The column does not scroll as one piece; each area scrolls inside itself.
     Review 786 found «Затор» sitting below a filled «Ждёт решения человека» at
     1440×900, so a whole acceptance question was answered only by scrolling a
     column. Five headings with their counts and their oldest age now always
     stand on the first screen, and the plates of an area move within it. */
  .colbody { overflow: hidden; display: flex; flex-direction: column; gap: 10px;
             padding: 8px 9px 12px; flex: 1; min-height: 0; }

  .area { display: flex; flex-direction: column; min-height: 0; flex: 1 1 0; }
  /* The area that answers an acceptance question outright gets the room. A
     folded area costs its heading and nothing else. */
  .area.a-waiting_human { flex: 2 1 0; }
  .area.shut, .area.void { flex: none; }
  .area .plates { overflow: auto; min-height: 0; flex: 1; }
  .area > h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
               color: var(--dim); cursor: pointer; display: flex; gap: 7px; align-items: baseline;
               flex: none; }
  .area > h3 .n { color: var(--ink); font-size: 12px; font-weight: 650; }
  .area > h3 .old { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; }
  .area.a-waiting_human > h3 { color: var(--stale); }
  .area.a-running > h3 { color: var(--live); }
  .area.a-stuck > h3 { color: var(--blocked); }
  /* «Можно подхватить» is the first question of a wake-up, so it reads as an
     invitation rather than as another warning. */
  .area.a-pickup > h3 { color: var(--pick); }
  .area.a-plan > h3 { color: var(--plan); }
  .area.shut .plates { display: none; }
  .area .empty { color: var(--idle); font-size: 12px; padding: 2px 0 4px; }
  /* The rule that selected the contents of an area, printed with the area. It
     matters for «надо запланировать», whose whole content is text picked by a
     narrow test — a reader who cannot see the test would read the heading as a
     verdict about the work rather than as a statement about the line. */
  .area .rule { color: var(--idle); font-size: 11px; line-height: 1.35;
                margin: -2px 0 6px; flex: none; }
  .area.shut .rule { display: none; }

  .plate { border: 1px solid var(--edge); border-left: 3px solid var(--idle); border-radius: 9px;
           background: #101828; padding: 8px 10px; margin-bottom: 7px; }
  .plate.p-waiting_human { border-left-color: var(--stale); }
  .plate.p-running { border-left-color: var(--live); }
  .plate.p-stuck { border-left-color: var(--blocked); }
  .plate.p-done { border-left-color: var(--done); }
  .plate.p-pickup { border-left-color: var(--pick); }
  .plate.p-plan { border-left-color: var(--plan); }
  /* A plate opens its card. It is a control, so it says so before it is clicked
     rather than after — a board nobody knows is clickable has no drill-down. */
  .plate { cursor: pointer; }
  .plate:hover { border-color: #2c3852; background: #131c30; }
  .plate .head { display: flex; gap: 7px; align-items: baseline; }
  .plate .num { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; flex: none; }
  .plate .name { font-size: 13px; font-weight: 550; line-height: 1.3; }
  .plate .row { margin-top: 5px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tag { font-size: 11px; border: 1px solid var(--edge); border-radius: 5px; padding: 1px 6px;
         color: var(--dim); white-space: nowrap; }
  .tag.who { color: var(--ink); }
  .tag.alive { color: var(--live); border-color: #245c3c; }
  .tag.lie { color: var(--blocked); border-color: #6b2626; }
  .tag.age { font-variant-numeric: tabular-nums; }
  .tag.retry { color: var(--killed); border-color: #453a6e; }
  .plate .doing { margin-top: 5px; color: var(--dim); font-size: 12px; line-height: 1.35; }
  .plate .ask { margin-top: 5px; color: var(--stale); font-size: 12px; line-height: 1.35;
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                overflow: hidden; }
  .plate .doing { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
                  overflow: hidden; }
  /* The observed reason a task stands where it stands. Answering «почему» is an
     acceptance question, so it is not dimmed away into a footnote. */
  .plate .why { margin-top: 5px; font-size: 12px; line-height: 1.35; color: var(--stale);
                display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
                overflow: hidden; word-break: break-word; }
  .plate.p-stuck .why { color: var(--blocked); }
  /* A product's open question: the same area, so it reads as one list. A long
     one is clamped rather than allowed to push the areas below off the screen. */
  .plate.q .name { font-weight: 450; display: -webkit-box; -webkit-line-clamp: 3;
                   -webkit-box-orient: vertical; overflow: hidden; }
  .plate.q .num { color: var(--stale); font-weight: 700; }
  .plate .more { margin-top: 4px; color: var(--idle); font-size: 11.5px; }
  .plate .dash { color: var(--idle); }

  .chan { border-top: 1px solid var(--edge); padding: 8px 12px 10px; font-size: 11.5px; color: var(--dim); }
  .chan div { margin-top: 3px; }
  .chan b { color: var(--ink); font-weight: 600; }
  .chan .warn { color: var(--stale); }

  #switch { margin-left: auto; display: flex; gap: 6px; }
  #switch button { padding: 5px 11px; font-size: 12.5px; }
  #switch button.on { background: #1e3a5f; border-color: #2f5f8a; }

  @media (max-width: 900px) {
    #columns { grid-template-columns: 1fr; overflow: auto; }
    .col { min-height: 60vh; }
    /* A phone gives the header a third of the screen if left alone, and every
       line it takes comes off the answers below it. */
    #boardhead { padding: 8px 12px 6px; }
    #boardhead h1 { font-size: 15px; }
    /* One column cannot fit four directions, so on a phone the strip *is* the
       first-screen answer — which means a reason may not be cut here. The item
       wraps and the reason takes as many lines as it needs. */
    #strip { padding: 7px 12px; }
    /* The three-line clamp that used to stand here was the phone half of finding
       HIGH-1: reasons #723, #727 and #747 ended in an ellipsis and two of them
       ran past the right edge of a 390 window. What keeps «Ждёт решения
       человека» on the first screen is the character budget in the renderer,
       which shows fewer jams, not a clamp that cuts the ones it shows. */
    #strip .why { color: var(--dim); }
  }

  /* ---------- the card: detail without leaving the page ----------
     The user asked to open a plate and see the review verdict and its findings,
     the gates, the last progress line and when it was written, the live process
     and its age, the repository the run was pointed at, what was delivered and
     the files of the task directory — «не уходя со страницы». So it is a layer
     over the board, the board stays where it was, and closing it puts the eye
     back on the plate it was opened from. Nothing here is fetched: every field
     travelled with the plate, because the page has no way to reach a disk. */
  #card { position: fixed; inset: 0; z-index: 20; display: none;
          background: rgba(4,7,13,.72); backdrop-filter: blur(3px); }
  #card.open { display: flex; align-items: stretch; justify-content: flex-end; }
  #cardbox { width: min(620px, 100%); background: var(--bg1); border-left: 1px solid var(--edge);
             display: flex; flex-direction: column; box-shadow: -18px 0 44px rgba(0,0,0,.5); }
  #cardhead { padding: 14px 16px 11px; border-bottom: 1px solid var(--edge); flex: none; }
  #cardhead .head { display: flex; gap: 9px; align-items: baseline; }
  #cardhead .num { color: var(--dim); font-variant-numeric: tabular-nums; }
  #cardhead .name { font-size: 15.5px; font-weight: 620; line-height: 1.3; }
  #cardclose { margin-left: auto; flex: none; }
  #cardbody { overflow: auto; padding: 12px 16px 20px; min-height: 0; }
  #cardbody section { margin-bottom: 14px; }
  #cardbody h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .07em;
                 text-transform: uppercase; color: var(--dim); font-weight: 600; }
  #cardbody .kv { display: grid; grid-template-columns: minmax(96px, auto) 1fr;
                  gap: 3px 12px; font-size: 12.5px; }
  #cardbody .kv dt { color: var(--dim); }
  #cardbody .kv dd { margin: 0; word-break: break-word; }
  #cardbody .none { color: var(--idle); font-size: 12.5px; }
  #cardbody .gate { display: flex; gap: 8px; font-size: 12.5px; padding: 2px 0; }
  #cardbody .gate .r { flex: none; font-weight: 650; font-variant-numeric: tabular-nums; }
  #cardbody .gate .r.ok { color: var(--live); }
  #cardbody .gate .r.bad { color: var(--blocked); }
  #cardbody .files { font-size: 12px; }
  #cardbody .files div { display: flex; gap: 10px; padding: 1.5px 0; }
  #cardbody .files .n { flex: 1; word-break: break-all; }
  #cardbody .files .m { color: var(--dim); flex: none; font-variant-numeric: tabular-nums; }
  #cardbody .src { color: var(--idle); font-size: 11px; margin-top: 4px; }
  #cardbody .warn { color: var(--stale); }
  @media (max-width: 760px) { #cardbox { width: 100%; border-left: none; } }

  #tip { position: fixed; z-index: 9; background: rgba(9,14,24,.96); border: 1px solid var(--edge);
         border-radius: 10px; padding: 9px 11px; max-width: 300px; font-size: 12.5px;
         display: none; pointer-events: none; }
  #tip b { display: block; margin-bottom: 4px; }
  #tip .st { color: var(--dim); font-size: 11.5px; }

  /* On a phone the two panels would bury the map, so they collapse to two taps:
     the counts stay visible, the lines open on demand. */
  @media (max-width: 760px) {
    #legend { display: none; }
    #panels { top: 46px; left: 8px; right: 8px; width: auto; flex-direction: row; gap: 8px; }
    .panel { flex: 1; padding: 8px 10px; max-height: none; overflow: visible; }
    .panel h2 { margin: 0; cursor: pointer; font-size: 11px; }
    .panel ul { display: none; }
    .panel.open { position: absolute; top: 0; left: 0; right: 0; z-index: 5;
                  max-height: 62vh; overflow: auto; }
    .panel.open ul { display: block; margin-top: 8px; }
    #top { padding: 10px 12px; }
    #top h1 { font-size: 15px; }
    #top .sub { display: none; }
    #nowsrc { display: none; }
    #nowtext { font-size: 13px; }
    #nowline { min-height: 46px; }
    #bottom { padding: 8px 10px 10px; }
    #controls { gap: 7px; }
    button { padding: 6px 9px; font-size: 12.5px; }
    select { padding: 5px 4px; font-size: 12.5px; }
    #clock { display: none; }
    #mode { display: none; }
  }
</style>
</head>
<body>
<div id="board">
  <div id="boardhead">
    <h1>Доска процессной работы</h1>
    <span class="sub" id="boardsub"></span>
    <span id="boardmode"></span>
    <span id="switch">
      <button id="toboard" class="on">Доска</button>
      <button id="tomap">Карта во времени</button>
    </span>
  </div>
  <div id="strip"></div>
  <div id="columns"></div>
</div>

<div id="stage"><canvas id="map"></canvas></div>

<div class="hud" id="top">
  <h1>Карта процессной работы</h1>
  <span class="sub" id="subtitle"></span>
  <span id="mode"></span>
  <span id="switch2"><button id="tomapback">← К доске</button></span>
</div>

<div class="hud" id="legend">
  <h2>Что значит форма</h2>
  <div id="legenditems"></div>
</div>

<div class="hud" id="panels">
  <div class="panel" id="waiting"><h2>Ждёт человека <b id="waitcount"></b></h2><ul></ul></div>
  <div class="panel" id="done"><h2>Готово <b id="donecount"></b></h2><ul></ul></div>
</div>

<div class="hud" id="bottom">
  <div id="nowline">
    <span id="nowkind">—</span>
    <span><span id="nowtext">нажмите «Пуск»</span> <span id="nowsrc"></span></span>
  </div>
  <div id="controls">
    <button class="primary" id="play">▶ Пуск</button>
    <button id="rewind">⟲ В начало</button>
    <input type="range" id="scrub" min="0" max="1000" value="0">
    <select id="speed">
      <option value="0.5">×0,5</option>
      <option value="1" selected>×1</option>
      <option value="3">×3</option>
      <option value="10">×10</option>
    </select>
    <span id="clock"></span>
  </div>
</div>

<div id="card">
  <div id="cardbox">
    <div id="cardhead">
      <div class="head">
        <span class="num" id="cardnum"></span>
        <span class="name" id="cardname"></span>
        <button id="cardclose">Закрыть</button>
      </div>
    </div>
    <div id="cardbody"></div>
  </div>
</div>

<div id="tip"></div>

<script id="payload" type="application/json">__DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("payload").textContent);
const SNAP = DATA.snapshot, RECORDS = DATA.timeline, WORLD = DATA.world;

/* ---------- isometric projection ---------- */
const TW = 68, TH = 34;               // tile width and height in world units
const iso = (x, y) => ({ x: (x - y) * TW / 2, y: (x + y) * TH / 2 });

const COLORS = {
  live: "#4ade80", blocked: "#f87171", killed: "#a78bfa", stale_label: "#fbbf24",
  gap: "#fb923c", delivered: "#38bdf8", idle: "#64748b"
};
const AREA_HUE = [205, 152, 32, 275];

/* ---------- time ----------
   Real observation times are kept and shown, but the playhead runs on its own
   clock: a quiet hour between two records is squeezed to a few seconds, so the
   recording is watchable and no observation is dropped or moved. */
const MAX_GAP = 12000;                         // real dead air, squeezed to this
RECORDS.forEach(r => { r._t = Date.parse(r.at); });
const REAL = RECORDS.filter(r => !isNaN(r._t));
let acc = 0;
REAL.forEach((r, i) => {
  if (i > 0) acc += Math.min(Math.max(r._t - REAL[i - 1]._t, 0), MAX_GAP);
  r._pt = acc;
});
const T0 = REAL.length ? REAL[0]._t : 0;
const SPAN = Math.max(acc + 2500, 1000);       // a tail, so the last record is seen
const PLAY_SECONDS = 70;                       // whole recording compressed to this
const RATE = SPAN / (PLAY_SECONDS * 1000);
const FLASH = Math.max(SPAN / 26, 1400);       // how long a record stays "just happened"

let clock = 0, playing = false, speed = 1, lastFrame = 0, ANIM = 0;

/* ---------- layout ---------- */
const areas = WORLD.areas.map((area, i) => {
  const cols = Math.ceil(Math.sqrt(area.tasks.length)) || 1;
  const rows = Math.ceil(area.tasks.length / cols) || 1;
  const size = Math.max(cols, rows) + 1;
  const tasks = area.tasks.map((t, k) => ({
    ...t,
    gx: area.ox + 1 + (k % cols),
    gy: area.oy + 1 + Math.floor(k / cols),
    bob: (i * 7 + k * 13) % 10 / 10
  }));
  return { ...area, hue: AREA_HUE[i % AREA_HUE.length], size, tasks, cols, rows };
});
const TASKS = {};
areas.forEach(a => a.tasks.forEach(t => { TASKS[t.task] = t; t.area = a; }));

/* channel endpoints live outside the areas: the outside world of the contour */
const GATES = {
  email:    { gx: WORLD.span / 2, gy: -3.2, label: "почта", glyph: "✉" },
  telegram: { gx: WORLD.span + 3.2, gy: WORLD.span / 2, label: "Telegram", glyph: "◎" },
  git:      { gx: -3.2, gy: WORLD.span / 2, label: "репозиторий", glyph: "⑂" }
};

/* ---------- derived state at the playhead ---------- */
function stateAt(now) {
  const st = { tasks: {}, channels: {}, recent: [], index: 0 };
  for (const t of Object.keys(TASKS)) st.tasks[t] = { stations: {}, station: null, last: null, hits: 0 };
  for (let i = 0; i < REAL.length; i++) {
    const r = REAL[i], at = r._pt;
    if (at > now) break;
    st.index = i + 1;
    st.at = r._t;
    const age = now - at;
    if (age < FLASH) st.recent.push({ r, age });
    const t = r.task && st.tasks[r.task];
    if (t) {
      t.hits++; t.last = r;
      if (r.station) { t.stations[r.station] = at; if (age < FLASH * 4) t.station = r.station; }
      if (age < FLASH) t.flash = 1 - age / FLASH;
      else t.flash = 0;
    }
    if (r.channel) {
      const c = st.channels[r.channel] || (st.channels[r.channel] = { fire: 0, r: null });
      if (age < FLASH) { c.fire = 1 - age / FLASH; c.r = r; c.task = r.task; }
    }
  }
  return st;
}

/* ---------- canvas ---------- */
const cv = document.getElementById("map"), cx = cv.getContext("2d");
let view = { x: 0, y: 0, k: 1 }, dpr = 1, fitted = null;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
  fit();
}
function bounds() {
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  const pts = [];
  for (const a of areas) {
    pts.push([a.ox, a.oy], [a.ox + a.size, a.oy], [a.ox, a.oy + a.size], [a.ox + a.size, a.oy + a.size]);
  }
  for (const g of Object.values(GATES)) pts.push([g.gx, g.gy]);
  for (const [gx, gy] of pts) {
    const p = iso(gx, gy);
    x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x);
    y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y);
  }
  return { x0: x0 - 50, x1: x1 + 50, y0: y0 - 80, y1: y1 + 60 };
}
function fit() {
  const b = bounds(), w = cv.clientWidth, h = cv.clientHeight;
  const narrow = w < 760;
  // The panels float over the map with a blurred backdrop, so the world may run
  // under them: reserving their full width would leave the town in a corner.
  const padTop = narrow ? 96 : 62, padBottom = narrow ? 116 : 92;
  const padLeft = narrow ? 6 : 200, padRight = narrow ? 6 : 240;
  const availW = Math.max(w - padLeft - padRight, 160);
  const availH = Math.max(h - padTop - padBottom, 160);
  // An isometric world is twice as wide as it is tall, so fitting a phone by
  // width leaves a strip of town in a sea of background. On a narrow screen the
  // map opens zoomed in and is dragged, the way a map is; a wide screen shows
  // the whole contour at once, which is the point of a top-down view.
  const k = Math.min(availW / (b.x1 - b.x0), availH / (b.y1 - b.y0)) * (narrow ? 1.9 : 1);
  fitted = {
    k, x: padLeft + availW / 2 - (b.x0 + b.x1) / 2 * k,
    y: padTop + availH / 2 - (b.y0 + b.y1) / 2 * k
  };
  view = { ...fitted };
}
const S = p => ({ x: view.x + p.x * view.k, y: view.y + p.y * view.k });

/* --- drawing primitives --- */
function tile(gx, gy, fill, stroke, inset) {
  const i = inset || 0;
  const p = [[gx + i, gy + i], [gx + 1 - i, gy + i], [gx + 1 - i, gy + 1 - i], [gx + i, gy + 1 - i]]
    .map(([x, y]) => S(iso(x, y)));
  cx.beginPath(); cx.moveTo(p[0].x, p[0].y);
  for (let n = 1; n < 4; n++) cx.lineTo(p[n].x, p[n].y);
  cx.closePath();
  if (fill) { cx.fillStyle = fill; cx.fill(); }
  if (stroke) { cx.strokeStyle = stroke; cx.lineWidth = 1; cx.stroke(); }
}

/* An isometric box: the body of a task object. */
function box(gx, gy, h, top, left, right, w) {
  const s = w === undefined ? 0.74 : w, o = (1 - s) / 2;
  const H = h * view.k;
  const a = S(iso(gx + o, gy + o)), b = S(iso(gx + o + s, gy + o));
  const c = S(iso(gx + o + s, gy + o + s)), d = S(iso(gx + o, gy + o + s));
  cx.fillStyle = left;
  cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(d.x, d.y);
  cx.lineTo(d.x, d.y - H); cx.lineTo(a.x, a.y - H); cx.closePath(); cx.fill();
  cx.fillStyle = right;
  cx.beginPath(); cx.moveTo(d.x, d.y); cx.lineTo(c.x, c.y);
  cx.lineTo(c.x, c.y - H); cx.lineTo(d.x, d.y - H); cx.closePath(); cx.fill();
  cx.fillStyle = top;
  cx.beginPath(); cx.moveTo(a.x, a.y - H); cx.lineTo(b.x, b.y - H);
  cx.lineTo(c.x, c.y - H); cx.lineTo(d.x, d.y - H); cx.closePath(); cx.fill();
  return { top: S(iso(gx + 0.5, gy + 0.5)).y - H, cx: S(iso(gx + 0.5, gy + 0.5)).x };
}

function shade(hue, l, a) { return `hsla(${hue},38%,${l}%,${a === undefined ? 1 : a})`; }

/* A worker figure: a body and a head, small enough to read as a person. */
function figure(px, py, color, walk) {
  const k = view.k, s = 7 * k;
  cx.save();
  cx.translate(px, py);
  cx.fillStyle = "rgba(0,0,0,.32)";
  cx.beginPath(); cx.ellipse(0, 0, s * .8, s * .35, 0, 0, 7); cx.fill();
  const lean = Math.sin(walk * 6.28) * .18;
  cx.fillStyle = color;
  cx.beginPath();
  cx.moveTo(-s * .42, 0); cx.lineTo(s * .42, 0);
  cx.lineTo(s * .3 + lean * s, -s * 1.5); cx.lineTo(-s * .3 + lean * s, -s * 1.5);
  cx.closePath(); cx.fill();
  cx.beginPath(); cx.arc(lean * s, -s * 1.92, s * .42, 0, 7); cx.fill();
  cx.restore();
}

function chains(px, py, w, h) {
  cx.strokeStyle = "rgba(248,113,113,.95)"; cx.lineWidth = 2.4 * view.k;
  cx.beginPath();
  cx.moveTo(px - w, py - h * .35); cx.lineTo(px + w, py - h * .75);
  cx.moveTo(px - w, py - h * .75); cx.lineTo(px + w, py - h * .35);
  cx.stroke();
}

function text(str, px, py, size, color, align) {
  cx.font = `${size * Math.max(view.k, .55)}px "Inter", system-ui, sans-serif`;
  cx.textAlign = align || "center"; cx.textBaseline = "alphabetic";
  cx.fillStyle = color; cx.fillText(str, px, py);
}

const STATION_ORDER = ["analysis", "development", "tests", "review", "commit", "report"];
const STATION_RU = { analysis: "анализ", development: "разработка", tests: "тесты",
                     review: "ревью", commit: "коммит", report: "отчёт" };

function draw(now) {
  const st = stateAt(now);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.clearRect(0, 0, cv.clientWidth, cv.clientHeight);

  /* channel lines first: they run under everything */
  for (const [name, g] of Object.entries(GATES)) {
    const fire = st.channels[name];
    const from = S(iso(g.gx + .5, g.gy + .5));
    const target = fire && fire.task && TASKS[fire.task]
      ? S(iso(TASKS[fire.task].gx + .5, TASKS[fire.task].gy + .5))
      : S(iso(WORLD.span / 2, WORLD.span / 2));
    cx.strokeStyle = fire && fire.fire > 0 ? `rgba(125,211,252,${.25 + fire.fire * .7})` : "rgba(90,110,150,.20)";
    cx.lineWidth = (fire && fire.fire > 0 ? 2.4 : 1) * view.k;
    cx.setLineDash([6 * view.k, 6 * view.k]);
    cx.beginPath(); cx.moveTo(from.x, from.y); cx.lineTo(target.x, target.y); cx.stroke();
    cx.setLineDash([]);
    if (fire && fire.fire > 0) {              /* a message travelling the channel */
      const t = 1 - fire.fire;
      const mx = from.x + (target.x - from.x) * t, my = from.y + (target.y - from.y) * t;
      cx.fillStyle = "#7dd3fc";
      cx.beginPath(); cx.arc(mx, my, 5 * view.k, 0, 7); cx.fill();
    }
    const lit = fire && fire.fire > 0;
    cx.fillStyle = lit ? "#7dd3fc" : "rgba(150,170,200,.75)";
    text(g.glyph, from.x, from.y + 5 * view.k, 22, cx.fillStyle);
    text(g.label, from.x, from.y + 26 * view.k, 12, lit ? "#bae6fd" : "rgba(150,170,200,.7)");
  }

  /* areas: ground of each direction */
  for (const a of areas) {
    for (let x = 0; x < a.size; x++)
      for (let y = 0; y < a.size; y++)
        tile(a.ox + x, a.oy + y, shade(a.hue, 13 + ((x + y) % 2) * 2, .95), shade(a.hue, 20, .6));
    /* open questions: a marker on the ground of the thread that owns them, the
       same fact the «ждёт человека» panel states in words */
    const shown = Math.min(a.questions.length, 5);
    for (let q = 0; q < shown; q++) {
      const c = S(iso(a.ox + a.size - .5, a.oy + .5 + q * .9));
      const blink = (Math.sin(ANIM / 700 + q) + 1) / 2;
      cx.fillStyle = `rgba(251,191,36,${.55 + blink * .45})`;
      text("?", c.x, c.y - 6 * view.k, 20, cx.fillStyle);
    }
    if (a.questions.length > shown) {
      const c = S(iso(a.ox + a.size - .5, a.oy + .5 + shown * .9));
      text("+" + (a.questions.length - shown), c.x, c.y - 6 * view.k, 12, "rgba(251,191,36,.8)");
    }
  }

  /* task objects, painted back to front so nearer boxes overlap farther ones */
  const drawList = [], labels = [];
  for (const a of areas) for (const t of a.tasks) drawList.push(t);
  drawList.sort((p, q) => (p.gx + p.gy) - (q.gx + q.gy));

  for (const t of drawList) {
    const ts = st.tasks[t.task] || { stations: {}, hits: 0 };
    const flags = new Set(t.flags);
    const live = flags.has("live");
    const h = 16 + Math.min(t.gates || 0, 5) * 4 + (flags.has("delivered") ? 6 : 0);
    let hue = a_hue(t, flags);
    const pulse = live ? (Math.sin(ANIM / 260 + t.bob * 6.28) + 1) / 2 : 0;

    if (live) {                                   /* glow under a working object */
      const c = S(iso(t.gx + .5, t.gy + .5));
      const grd = cx.createRadialGradient(c.x, c.y, 0, c.x, c.y, 46 * view.k);
      grd.addColorStop(0, `rgba(74,222,128,${.30 + pulse * .20})`);
      grd.addColorStop(1, "rgba(74,222,128,0)");
      cx.fillStyle = grd; cx.beginPath(); cx.arc(c.x, c.y, 46 * view.k, 0, 7); cx.fill();
    }
    tile(t.gx, t.gy, "rgba(255,255,255,.045)", "rgba(255,255,255,.10)", .04);

    /* stations: pads around the object, lit only where something was observed */
    STATION_ORDER.forEach((s, i) => {
      if (!(s in ts.stations)) return;
      const ang = -Math.PI / 2 + i * Math.PI / 3;
      const c = S(iso(t.gx + .5 + Math.cos(ang) * .42, t.gy + .5 + Math.sin(ang) * .42));
      const on = ts.station === s;
      cx.fillStyle = on ? "#fde68a" : "rgba(253,230,138,.34)";
      cx.beginPath(); cx.arc(c.x, c.y, (on ? 4.6 : 3) * view.k, 0, 7); cx.fill();
    });

    let body;
    if (flags.has("killed")) {                    /* a collapsed object, not a done one */
      body = box(t.gx, t.gy, h * .45, `hsla(${hue},30%,26%,1)`, `hsla(${hue},30%,15%,1)`, `hsla(${hue},30%,20%,1)`, .78);
      const c = S(iso(t.gx + .5, t.gy + .5));
      cx.strokeStyle = COLORS.killed; cx.lineWidth = 2.6 * view.k;
      cx.beginPath();
      cx.moveTo(c.x - 11 * view.k, body.top - 4 * view.k); cx.lineTo(c.x + 11 * view.k, body.top - 18 * view.k);
      cx.moveTo(c.x - 11 * view.k, body.top - 18 * view.k); cx.lineTo(c.x + 11 * view.k, body.top - 4 * view.k);
      cx.stroke();
    } else if (flags.has("delivered")) {          /* a delivered crate with a ribbon */
      body = box(t.gx, t.gy, h, `hsl(${hue},45%,52%)`, `hsl(${hue},45%,28%)`, `hsl(${hue},45%,38%)`, .70);
      cx.strokeStyle = "rgba(255,255,255,.55)"; cx.lineWidth = 1.6 * view.k;
      const c = S(iso(t.gx + .5, t.gy + .5));
      cx.beginPath(); cx.moveTo(c.x - 15 * view.k, body.top + 6 * view.k);
      cx.lineTo(c.x, body.top + 13 * view.k); cx.lineTo(c.x + 15 * view.k, body.top + 6 * view.k); cx.stroke();
    } else {
      const l = flags.has("idle") ? 30 : 44;
      body = box(t.gx, t.gy, h, `hsl(${hue},42%,${l + 10}%)`, `hsl(${hue},42%,${l - 16}%)`, `hsl(${hue},42%,${l - 6}%)`);
    }

    if (flags.has("gap")) {                       /* a notch cut out of the roof */
      const c = S(iso(t.gx + .5, t.gy + .5));
      cx.fillStyle = COLORS.gap;
      cx.beginPath();
      cx.moveTo(c.x - 8 * view.k, body.top + 2 * view.k);
      cx.lineTo(c.x, body.top - 9 * view.k);
      cx.lineTo(c.x + 8 * view.k, body.top + 2 * view.k);
      cx.closePath(); cx.fill();
    }
    if (flags.has("blocked")) {
      const c = S(iso(t.gx + .5, t.gy + .5));
      chains(c.x, c.y, 17 * view.k, h * view.k);
    }
    if (flags.has("stale_label")) {               /* an oversized banner claiming more */
      const c = S(iso(t.gx + .5, t.gy + .5));
      cx.fillStyle = "rgba(251,191,36,.85)";
      cx.beginPath();
      cx.moveTo(c.x, body.top - 6 * view.k);
      cx.lineTo(c.x + 30 * view.k, body.top - 13 * view.k);
      cx.lineTo(c.x + 30 * view.k, body.top + 1 * view.k);
      cx.closePath(); cx.fill();
      cx.strokeStyle = "rgba(251,191,36,.85)"; cx.lineWidth = 1.4 * view.k;
      cx.beginPath(); cx.moveTo(c.x, body.top - 2 * view.k); cx.lineTo(c.x, body.top + 12 * view.k); cx.stroke();
    }
    if (live) {                                   /* the figure at work on the object */
      const c = S(iso(t.gx + .82, t.gy + .5));
      figure(c.x, c.y, "#eafff1", (ANIM / 900 + t.bob) % 1);
    }
    if (ts.flash > 0) {                           /* what just happened, right now */
      const c = S(iso(t.gx + .5, t.gy + .5));
      cx.strokeStyle = `rgba(255,255,255,${ts.flash * .85})`;
      cx.lineWidth = 2 * view.k;
      cx.beginPath(); cx.arc(c.x, c.y, (10 + (1 - ts.flash) * 40) * view.k, 0, 7); cx.stroke();
    }

    /* The real title of the task: the user recognises their own task by it.
       Only what is moving, alive or pointed at gets a caption — labelling every
       object turns the map into a wall of text and hides exactly the movement
       it is meant to show. */
    const busy = live || ts.flash > 0 || (hover && hover.t === t);
    if (view.k > .5 && busy) labels.push({ t, body, live, weight: live ? 2 : (ts.flash > 0 ? 1 : 3) });
    t._screen = S(iso(t.gx + .5, t.gy + .5));
    t._top = body.top;
  }

  /* captions last, and never on top of one another — nor on an area heading */
  const taken = [];
  const headings = areas.map(a => {
    const p = S(iso(a.ox, a.oy));
    cx.font = `${15.5 * Math.max(view.k, .55)}px "Inter", system-ui, sans-serif`;
    const w = Math.max(cx.measureText(a.title).width, cx.measureText(a.note).width) + 16;
    const box = { x: p.x - w / 2, y: p.y - 28 * view.k, w, h: 34 * view.k };
    taken.push(box);
    return { a, p };
  });
  labels.sort((p, q) => q.weight - p.weight);
  for (const item of labels) {
    const c = S(iso(item.t.gx + .5, item.t.gy + .5));
    const label = item.t.title.length > 38 ? item.t.title.slice(0, 37) + "…" : item.t.title;
    cx.font = `${12.5 * Math.max(view.k, .7)}px "Inter", system-ui, sans-serif`;
    const w = cx.measureText(label).width + 12, h = 19 * view.k;
    let x = c.x - w / 2, y = item.body.top - 27 * view.k;
    const hits = r => taken.some(o => !(r.x + r.w < o.x || r.x > o.x + o.w || r.y + r.h < o.y || r.y > o.y + o.h));
    let box = { x, y, w, h }, lift = 0;
    while (hits(box) && lift < 5) { lift++; box = { x, y: y - lift * (h + 3), w, h }; }
    if (hits(box)) continue;                     // no free room: stay silent
    taken.push(box);
    cx.fillStyle = "rgba(6,10,18,.82)";
    cx.beginPath(); cx.roundRect(box.x, box.y, w, h, 6); cx.fill();
    if (item.live) { cx.strokeStyle = "rgba(74,222,128,.55)"; cx.lineWidth = 1; cx.stroke(); }
    text(label, c.x, box.y + 13.5 * view.k, 12.5, item.live ? "#dcfce7" : "#dbe3f3");
  }

  /* area titles above everything: they are the map's headings */
  for (const { a, p } of headings) {
    text(a.title, p.x, p.y - 14 * view.k, 15.5, shade(a.hue, 80));
    text(a.note, p.x, p.y + 1 * view.k, 11.5, shade(a.hue, 58));
  }
  return st;
}
function a_hue(t, flags) {
  if (flags.has("blocked")) return 0;
  if (flags.has("killed")) return 268;
  if (flags.has("stale_label")) return 44;
  if (flags.has("delivered")) return 197;
  if (flags.has("live")) return 142;
  if (flags.has("gap")) return 26;
  return 218;
}

/* ---------- HUD wiring ---------- */
const el = id => document.getElementById(id);
el("subtitle").textContent = WORLD.subtitle;
el("mode").textContent = SNAP.mode === "demo" ? "запись · обезличено" : "запись · как есть";

function fillPanel(id, items, countId) {
  const ul = el(id).querySelector("ul");
  ul.innerHTML = "";
  items.forEach(i => {
    const li = document.createElement("li");
    li.textContent = i.text;
    const src = document.createElement("div");
    src.className = "src"; src.textContent = i.src;
    li.appendChild(src); ul.appendChild(li);
  });
  el(countId).textContent = items.length;
}
fillPanel("waiting", WORLD.waiting, "waitcount");
fillPanel("done", WORLD.done, "donecount");

/* the collapsed panels of the phone layout: one open at a time */
for (const id of ["waiting", "done"]) {
  el(id).querySelector("h2").addEventListener("click", () => {
    const open = el(id).classList.contains("open");
    el("waiting").classList.remove("open"); el("done").classList.remove("open");
    if (!open) el(id).classList.add("open");
  });
}

/* legend: the shapes themselves, drawn the same way the map draws them */
(function legend() {
  const items = [
    ["живой прогон — фигура работает", "live"],
    ["в цепях — блокирует чужая причина", "blocked"],
    ["надзор убил прогон", "killed"],
    ["ярлык врёт: заявлено больше наблюдённого", "stale_label"],
    ["гейт сказал GAP или FAIL", "gap"],
    ["доставлено", "delivered"],
    ["никто не работает", "idle"]
  ];
  const host = el("legenditems");
  for (const [label, flag] of items) {
    const row = document.createElement("div"); row.className = "lg";
    const c = document.createElement("canvas"); c.width = 68; c.height = 52;
    const g = c.getContext("2d"); g.scale(2, 2);
    g.fillStyle = COLORS[flag];
    if (flag === "live") { g.beginPath(); g.moveTo(10, 22); g.lineTo(17, 22); g.lineTo(15, 8); g.lineTo(12, 8); g.closePath(); g.fill();
                           g.beginPath(); g.arc(13.5, 5.5, 3.4, 0, 7); g.fill(); }
    else if (flag === "blocked") { g.fillStyle = "#3b4c6b"; g.fillRect(6, 8, 18, 14);
                                   g.strokeStyle = COLORS.blocked; g.lineWidth = 2;
                                   g.beginPath(); g.moveTo(5, 8); g.lineTo(25, 22); g.moveTo(25, 8); g.lineTo(5, 22); g.stroke(); }
    else if (flag === "killed") { g.fillStyle = "#2c2740"; g.fillRect(7, 15, 16, 7);
                                  g.strokeStyle = COLORS.killed; g.lineWidth = 2;
                                  g.beginPath(); g.moveTo(8, 6); g.lineTo(22, 14); g.moveTo(22, 6); g.lineTo(8, 14); g.stroke(); }
    else if (flag === "stale_label") { g.fillStyle = "#3b4c6b"; g.fillRect(7, 12, 12, 10);
                                       g.fillStyle = COLORS.stale; g.beginPath(); g.moveTo(13, 12); g.lineTo(27, 6); g.lineTo(27, 12); g.closePath(); g.fill(); }
    else if (flag === "gap") { g.fillStyle = "#3b4c6b"; g.fillRect(7, 12, 16, 10);
                               g.fillStyle = COLORS.gap; g.beginPath(); g.moveTo(9, 12); g.lineTo(15, 4); g.lineTo(21, 12); g.closePath(); g.fill(); }
    else if (flag === "delivered") { g.fillStyle = COLORS.done; g.fillRect(7, 10, 17, 12);
                                     g.strokeStyle = "rgba(255,255,255,.8)"; g.lineWidth = 2;
                                     g.beginPath(); g.moveTo(9, 13); g.lineTo(15.5, 17); g.lineTo(22, 13); g.stroke(); }
    else { g.fillStyle = "#39445c"; g.fillRect(8, 12, 15, 10); }
    const span = document.createElement("span"); span.textContent = label;
    row.appendChild(c); row.appendChild(span); host.appendChild(row);
  }
})();

const KIND_RU = {
  task_appeared: "новая задача", task_status: "смена статуса", pipeline_event: "событие пайплайна",
  artifact: "артефакт", activity: "работа идёт", commit: "коммит",
  notification: "уведомление", mail: "письмо"
};

function paintNow(st) {
  const last = st.recent.length ? st.recent[st.recent.length - 1].r
             : (st.index ? RECORDS[st.index - 1] : null);
  if (!last) { el("nowkind").textContent = "—"; el("nowtext").textContent = "запись не начата"; el("nowsrc").textContent = ""; return; }
  el("nowkind").textContent = KIND_RU[last.kind] || last.kind;
  const who = last.task_title ? ` — ${last.task_title}` : "";
  const station = last.station ? ` [${STATION_RU[last.station]}]` : "";
  el("nowtext").textContent = `${last.label}${station}${who}`;
  el("nowsrc").textContent = `наблюдено: ${last.observed_by}`;
}

/* The caption always shows the real observed instant, never the play clock. */
function fmt(realMs) {
  const d = new Date(realMs || T0);
  return d.toISOString().slice(5, 16).replace("T", " ");
}

let hover = null;
function frame(ts) {
  if (!lastFrame) lastFrame = ts;
  const dt = ts - lastFrame; lastFrame = ts;
  if (playing) {
    clock += dt * RATE * speed;
    if (clock >= SPAN) { clock = SPAN; setPlaying(false); }
    el("scrub").value = String(Math.round(clock / SPAN * 1000));
  }
  ANIM = ts;
  const st = draw(clock);
  paintNow(st);
  el("clock").textContent = `${fmt(st.at)} · ${st.index}/${REAL.length}`;
  if (hover) tipFor(hover);
  requestAnimationFrame(frame);
}

function setPlaying(on) {
  playing = on;
  el("play").textContent = on ? "❚❚ Пауза" : "▶ Пуск";
  el("play").classList.toggle("primary", !on);
}
el("play").onclick = () => { if (clock >= SPAN) clock = 0; setPlaying(!playing); };
el("rewind").onclick = () => { clock = 0; el("scrub").value = "0"; };
el("scrub").oninput = e => { clock = SPAN * e.target.value / 1000; };
el("speed").onchange = e => { speed = parseFloat(e.target.value); };
window.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); el("play").click(); }
  if (e.code === "ArrowRight") clock = Math.min(SPAN, clock + SPAN / 40);
  if (e.code === "ArrowLeft") clock = Math.max(0, clock - SPAN / 40);
});

/* pan and zoom */
let drag = null;
cv.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; cv.classList.add("dragging"); });
window.addEventListener("pointerup", () => { drag = null; cv.classList.remove("dragging"); });
window.addEventListener("pointermove", e => {
  if (drag) { view.x = drag.vx + (e.clientX - drag.x); view.y = drag.vy + (e.clientY - drag.y); return; }
  const r = cv.getBoundingClientRect();
  hover = pick(e.clientX - r.left, e.clientY - r.top, e.clientX, e.clientY);
  if (!hover) el("tip").style.display = "none";
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  view.x = mx - (mx - view.x) * f; view.y = my - (my - view.y) * f; view.k *= f;
}, { passive: false });
cv.addEventListener("dblclick", () => fit());

function pick(px, py, cxp, cyp) {
  let best = null, bd = 34 * view.k;
  for (const a of areas) for (const t of a.tasks) {
    if (!t._screen) continue;
    const d = Math.hypot(t._screen.x - px, t._screen.y - py);
    if (d < bd) { bd = d; best = t; }
  }
  return best ? { t: best, cx: cxp, cy: cyp } : null;
}
function tipFor(h) {
  const tip = el("tip"), t = h.t;
  const st = stateAt(clock).tasks[t.task] || { stations: {} };
  const stations = Object.keys(st.stations).map(s => STATION_RU[s]).join(", ") || "наблюдений пока нет";
  tip.innerHTML = "";
  const b = document.createElement("b"); b.textContent = t.title; tip.appendChild(b);
  const s1 = document.createElement("div");
  s1.textContent = `${t.status || "?"} · ${t.flags.join(", ") || "без флагов"}`;
  const s2 = document.createElement("div"); s2.className = "st";
  s2.textContent = `станции: ${stations}`;
  const s3 = document.createElement("div"); s3.className = "st";
  s3.textContent = st.last ? `последнее: ${st.last.label} (${st.last.observed_by})` : "";
  tip.appendChild(s1); tip.appendChild(s2); tip.appendChild(s3);
  tip.style.display = "block";
  tip.style.left = Math.min(h.cx + 14, window.innerWidth - 320) + "px";
  tip.style.top = Math.min(h.cy + 14, window.innerHeight - 120) + "px";
}

/* ---------- the board ----------
   Four direction panels, areas by urgency inside each, one plate per task. The
   first screen answers the three acceptance questions — who is working, where
   the jam is and why, what waits for a person — so nothing here is decorative.
   Every caption comes from a field of the snapshot; where the snapshot says
   nothing, the plate shows a dash rather than a plausible guess. */
const BOARD = DATA.board;

/* One wording for one measurement. The caption was written out twice — once when
   a plate is built and once by the ticker that refreshes it every half minute —
   so changing it in one place left the other saying something else thirty
   seconds later. What it says is deliberately «без изменений»: the number is the
   age of the freshest file the area is built from, which bounds the transition
   without claiming to be it (finding MEDIUM-1 of review 786). */
function ageCaption(age) { return "без изменений " + age; }

/* An age counted from the instant the state was last observed to change, so it
   stays true while the page sits open rather than freezing at collection time. */
function ageOf(p) {
  if (!p.since) return p.age_seconds;
  const t = Date.parse(p.since);
  return isNaN(t) ? p.age_seconds : Math.max(Math.round((Date.now() - t) / 1000), 0);
}

function ago(seconds) {
  if (seconds === null || seconds === undefined) return null;
  const m = Math.floor(seconds / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d >= 1) return d + (d === 1 ? " день" : (d < 5 ? " дня" : " дней"));
  if (h >= 1) return h + (h === 1 ? " час" : (h < 5 ? " часа" : " часов"));
  if (m >= 1) return m + " мин";
  return "только что";
}

const ROLE_RU = { analysis: "анализ", development: "разработка", tests: "тесты",
                  review: "ревью", commit: "коммит", report: "отчёт" };

function tag(text, cls) {
  const s = document.createElement("span");
  s.className = "tag" + (cls ? " " + cls : "");
  s.textContent = text;                      // never innerHTML: the data is real
  return s;
}

function plateNode(p, areaKey) {
  const node = document.createElement("div");
  node.className = "plate p-" + areaKey;
  /* The drill-down the user asked for: the card opens over the board and the
     board stays where it was, so nothing reloads and nothing is navigated to. */
  node.addEventListener("click", () => openCard(p));

  const head = document.createElement("div");
  head.className = "head";
  const num = document.createElement("span");
  num.className = "num"; num.textContent = p.id === null ? "—" : "#" + p.id;
  const name = document.createElement("span");
  name.className = "name"; name.textContent = p.title;
  head.appendChild(num); head.appendChild(name);
  node.appendChild(head);

  const row = document.createElement("div");
  row.className = "row";
  row.appendChild(tag(p.status || "без статуса"));
  /* Who and in what role — only when a file actually said so. An empty cell is
     the honest answer and beats a confident untruth in a caption. */
  const who = p.actor ? tag(p.actor, "who") : tag("исполнитель неизвестен");
  if (p.actor_src) who.title = "наблюдено: " + p.actor_src;
  row.appendChild(who);
  if (p.role) {
    const role = tag(ROLE_RU[p.role] || p.role);
    if (p.role_src) role.title = "наблюдено: " + p.role_src;
    row.appendChild(role);
  }
  /* A live process and a label claiming one are two facts, kept apart on the
     plate: a dead run under a `running` label has to look like the jam it is. */
  if (p.alive) row.appendChild(tag("прогон жив", "alive"));
  if (p.stale_label) row.appendChild(tag("ярлык врёт: процесса нет", "lie"));
  if (p.attempt > 1) row.appendChild(tag("попытка " + p.attempt, "retry"));
  /* «Без изменений», not «в этом состоянии»: what is measured is the mtime of
     the freshest file the area is built from, which is an upper bound on the
     transition and not the transition itself. The tooltip names the file. */
  const age = ago(ageOf(p));
  if (age) {
    const a = tag(ageCaption(age), "age");
    a.dataset.since = p.since || "";
    if (p.since_src) a.title = "наблюдено: " + p.since_src;
    row.appendChild(a);
  }
  node.appendChild(row);

  if (p.happening) {
    const doing = document.createElement("div");
    doing.className = "doing"; doing.textContent = p.happening;
    node.appendChild(doing);
  }
  /* Why it stands here. `happening` comes from a live child's progress line and
     is therefore empty for exactly the tasks that are stuck, which is the one
     case a reader needs it — so the observed reason is its own line, shown
     whenever the disk carries one and absent when it does not. */
  if (p.why) {
    const why = document.createElement("div");
    why.className = "why";
    /* A queue and a jam are two different sentences. «За чем стоит» is what the
       user asked the queue column for by name, and calling it «почему» would
       read as something being wrong when nothing is. */
    why.textContent = (p.blocked_by && p.why === p.blocked_by ? "стоит за: " : "почему: ") + p.why;
    if (p.why_src) why.title = "наблюдено: " + p.why_src;
    node.appendChild(why);
  }
  for (const question of p.questions.slice(0, 2)) {
    const ask = document.createElement("div");
    ask.className = "ask"; ask.textContent = "? " + question;
    node.appendChild(ask);
  }
  if (p.questions.length > 2) {
    const more = document.createElement("div");
    more.className = "more";
    more.textContent = "и ещё вопросов: " + (p.questions.length - 2);
    node.appendChild(more);
  }
  return node;
}

/* ---------- the card ----------
   Everything it shows arrived with the plate. The page cannot reach a disk, so
   a drill-down that fetched its own detail would be a second door past the
   boundary the whole split exists to hold. */

/* Which plate is open, by task directory rather than by object identity: a live
   refresh replaces every plate object, and the card has to survive that with
   the same task in it. */
let openTask = null;

function row(dl, key, value, src) {
  if (value === null || value === undefined || value === "") return;
  const dt = document.createElement("dt"); dt.textContent = key;
  const dd = document.createElement("dd"); dd.textContent = value;
  if (src) dd.title = "наблюдено: " + src;
  dl.appendChild(dt); dl.appendChild(dd);
}

function section(title, build) {
  const s = document.createElement("section");
  const h = document.createElement("h4"); h.textContent = title;
  s.appendChild(h);
  const filled = build(s);
  if (!filled) {
    const none = document.createElement("div");
    none.className = "none"; none.textContent = "нечего показать: на диске об этом ничего нет";
    s.appendChild(none);
  }
  return s;
}

function bytes(n) {
  if (n === null || n === undefined) return "";
  if (n < 1024) return n + " Б";
  if (n < 1024 * 1024) return Math.round(n / 1024) + " КБ";
  return (n / 1048576).toFixed(1) + " МБ";
}

function stamp(iso) {
  if (!iso) return null;
  const t = Date.parse(iso);
  return isNaN(t) ? iso : new Date(t).toLocaleString("ru-RU");
}

function cardBody(p) {
  const d = p.detail || {};
  const body = document.createElement("div");

  body.appendChild(section("Где стоит и почему", s => {
    const dl = document.createElement("dl"); dl.className = "kv";
    row(dl, "Статус", p.status);
    row(dl, "Исполнитель", p.actor, p.actor_src);
    row(dl, "Станция", p.role ? (ROLE_RU[p.role] || p.role) : null, p.role_src);
    row(dl, "Попытка", p.attempt > 1 ? p.attempt : null);
    const age = ago(ageOf(p));
    row(dl, "Без изменений", age, p.since_src);
    row(dl, p.blocked_by && p.why === p.blocked_by ? "Стоит за" : "Почему", p.why, p.why_src);
    s.appendChild(dl);
    return dl.children.length > 0;
  }));

  body.appendChild(section("Прогон", s => {
    const dl = document.createElement("dl"); dl.className = "kv";
    row(dl, "Раннер", d.runner);
    row(dl, "Рабочий процесс", d.workflow);
    row(dl, "Песочница", d.sandbox);
    row(dl, "Репозиторий предмета", d.repo, "поле --repo в .runner/runner.json");
    /* A live process and a label claiming one are two facts and stay two lines:
       the contour has been burned by reading one as the other. */
    row(dl, "Ярлык прогона", d.state);
    row(dl, "Процесс", p.alive ? "жив" : (p.stale_label ? "мёртв, а ярлык говорит running" : "не запущен"),
        p.alive ? "pid и стартовый тик ядра совпали с .runner/runner.json" : null);
    row(dl, "Код возврата", d.exit_code === null || d.exit_code === undefined ? null : String(d.exit_code));
    row(dl, "Остановлен надзором", d.stop_reason, "watcher_stop_reason в .runner/runner.json");
    row(dl, "Шаг", d.current_step);
    if (d.refusal) {
      row(dl, "Отказ в завершении", d.refusal, "completion_refusal в status.json");
      row(dl, "Что именно отказано", d.refusal_summary, "completion_refusal в status.json");
    }
    s.appendChild(dl);
    return dl.children.length > 0;
  }));

  body.appendChild(section("Последняя запись прогресса", s => {
    const pr = d.progress;
    if (!pr) return false;
    const dl = document.createElement("dl"); dl.className = "kv";
    row(dl, "Что делает", pr.activity);
    if (pr.total) row(dl, "Сделано", pr.done + " из " + pr.total);
    /* When it was written is the mtime of the file, never the timestamp the
       child put inside it: children routinely write local time into a UTC field
       and the contour has already paid for believing one. */
    row(dl, "Записано", pr.minutes_ago === null || pr.minutes_ago === undefined
        ? null : pr.minutes_ago + " мин назад", "mtime файла progress.json");
    s.appendChild(dl);
    return dl.children.length > 0;
  }));

  body.appendChild(section("Вердикт ревью", s => {
    const r = d.review;
    if (!r) return false;
    const dl = document.createElement("dl"); dl.className = "kv";
    row(dl, "Вердикт", r.verdict, r.src);
    const by = Object.entries(r.by_severity || {}).map(([k, v]) => k + " " + v).join(", ");
    row(dl, "Находок", r.findings + (by ? " (" + by + ")" : ""), r.src);
    s.appendChild(dl);
    return dl.children.length > 0;
  }));

  body.appendChild(section("Гейты verification.md", s => {
    const gates = d.gates || [];
    if (!gates.length) return false;
    for (const g of gates) {
      const line = document.createElement("div");
      line.className = "gate";
      const r = document.createElement("span");
      r.className = "r " + (g.result === "OK" ? "ok" : "bad");
      r.textContent = g.result;
      const n = document.createElement("span"); n.textContent = g.gate;
      line.appendChild(r); line.appendChild(n);
      s.appendChild(line);
    }
    return true;
  }));

  body.appendChild(section("Доставлено человеку", s => {
    const dl = document.createElement("dl"); dl.className = "kv";
    if (d.delivery) {
      row(dl, "Сообщений", d.delivery.count, d.delivery.src);
      row(dl, "Последнее", stamp(d.delivery.last_at), d.delivery.src);
      row(dl, "По событию", d.delivery.last_kind, d.delivery.src);
    }
    s.appendChild(dl);
    return dl.children.length > 0;
  }));

  body.appendChild(section("Движение артефактов", s => {
    if (!d.moved) return false;
    const dl = document.createElement("dl"); dl.className = "kv";
    row(dl, "Последнее", stamp(d.moved), d.moved_src);
    row(dl, "Что двигалось", (d.moved_src || "").replace(/^[^:]*:\s*/, ""), d.moved_src);
    s.appendChild(dl);
    /* The whole point of the observation: a directory that kept moving after
       its owner refused its closing step is work that may already be finished
       and that nobody has been back to. It is said in words, not in a flag. */
    if ((p.flags || []).includes("work_outside_owner")) {
      const warn = document.createElement("div");
      warn.className = "src warn";
      warn.textContent = "Владелец кончился раньше своего закрывающего шага, а файлы каталога "
        + "двигались после этого: работа могла доработать снаружи — стоит посмотреть артефакты.";
      s.appendChild(warn);
    }
    return true;
  }));

  body.appendChild(section("Вопросы задачи", s => {
    if (!p.questions.length) return false;
    for (const q of p.questions) {
      const line = document.createElement("div");
      line.className = "gate";
      const r = document.createElement("span"); r.className = "r"; r.textContent = "?";
      const n = document.createElement("span"); n.textContent = q;
      line.appendChild(r); line.appendChild(n);
      s.appendChild(line);
    }
    return true;
  }));

  body.appendChild(section("Файлы каталога задачи", s => {
    const files = d.files || [];
    if (!files.length) return false;
    const box = document.createElement("div");
    box.className = "files";
    for (const f of files) {
      const line = document.createElement("div");
      const n = document.createElement("span"); n.className = "n"; n.textContent = f.name;
      const m = document.createElement("span"); m.className = "m";
      m.textContent = [bytes(f.bytes), stamp(f.at)].filter(Boolean).join(" · ");
      line.appendChild(n); line.appendChild(m);
      box.appendChild(line);
    }
    s.appendChild(box);
    const src = document.createElement("div");
    src.className = "src";
    /* Names, sizes and times. Opening any of them would be reading the work
       rather than observing it, and a transcript is never listed at all. */
    src.textContent = "имена, размеры и время изменения: " + d.dir
      + " — содержимое не читается, транскрипты не показываются";
    s.appendChild(src);
    return true;
  }));

  return body;
}

function openCard(p) {
  openTask = p.task;
  el("cardnum").textContent = p.id === null ? "—" : "#" + p.id;
  el("cardname").textContent = p.title;
  const body = el("cardbody");
  body.textContent = "";
  body.appendChild(cardBody(p));
  body.scrollTop = 0;
  el("card").classList.add("open");
}

function closeCard() {
  openTask = null;
  el("card").classList.remove("open");
}

el("cardclose").addEventListener("click", closeCard);
window.addEventListener("keydown", e => { if (e.key === "Escape" && openTask) closeCard(); });
el("card").addEventListener("click", e => { if (e.target === el("card")) closeCard(); });

/* Which areas the viewer folded open survives a live refresh, so an update
   never yanks the screen out from under someone reading it. */
const shutKey = (col, area) => "shut:" + col + ":" + area;
function isShut(col, area, byDefault) {
  const stored = sessionStorage.getItem(shutKey(col, area));
  return stored === null ? byDefault : stored === "1";
}

function areaNode(panel, area) {
  const node = document.createElement("section");
  const shut = isShut(panel.key, area.key, area.collapsed);
  /* An empty area still shows its heading — that heading is the answer «ничего
     не ждёт решения» — but it must not hold vertical space away from the areas
     that have something to show. */
  node.className = "area a-" + area.key + (shut ? " shut" : "") + (area.count ? "" : " void");

  const title = document.createElement("h3");
  title.appendChild(document.createTextNode(area.title + " "));
  const n = document.createElement("span");
  n.className = "n"; n.textContent = area.count;
  title.appendChild(n);
  if (area.hidden) title.appendChild(document.createTextNode(" (показано " +
      area.plates.length + ", скрыто " + area.hidden + ")"));
  const oldest = ago(area.oldest);
  if (oldest && area.count) {
    const old = document.createElement("span");
    old.className = "old"; old.textContent = "старшая: " + oldest;
    title.appendChild(old);
  }
  title.addEventListener("click", () => {
    const now = !node.classList.contains("shut");
    node.classList.toggle("shut", now);
    sessionStorage.setItem(shutKey(panel.key, area.key), now ? "1" : "0");
  });
  node.appendChild(title);

  if (AREA_RULE[area.key]) {
    const rule = document.createElement("div");
    rule.className = "rule"; rule.textContent = AREA_RULE[area.key];
    node.appendChild(rule);
  }

  const plates = document.createElement("div");
  plates.className = "plates";
  if (!area.count) {
    const empty = document.createElement("div");
    empty.className = "empty";
    /* «Ждёт решения человека» is drawn even when empty: an empty area is an
       answer to the question, and a missing one is not. */
    empty.textContent = area.key === "waiting_human" ? "ничего не ждёт решения" : "пусто";
    plates.appendChild(empty);
  }
  for (const p of area.plates) plates.appendChild(plateNode(p, area.key));
  /* The product's own open questions, in the same area and the same count as the
     tasks. They are questions to the same person; splitting them into a second
     place with a second number is how seventeen of them stayed off the board. */
  for (const q of (area.questions || [])) plates.appendChild(questionNode(q));
  for (const q of (area.promises || [])) plates.appendChild(promiseNode(q));
  node.appendChild(plates);
  return node;
}

/* The rule that picked what an area holds, printed with the area. «Надо
   запланировать» is the one area whose entire content is text chosen by a
   narrow test, and the test is narrower than the heading: what is observed is
   that the line names no task, which is not the same claim as «эта работа не
   начата». A reader who can see the rule can judge the list. */
const AREA_RULE = {
  plan: "строки раздела «В работе» продуктов этого направления, в которых не названо ни одной задачи",
  pickup: "живого прогона нет, гейты не отказали, и ничто на диске эту задачу не держит",
  queued: "стоит за названным держателем — он в строке каждой плашки",
};

function questionNode(q) {
  const node = document.createElement("div");
  node.className = "plate p-waiting_human q";
  const head = document.createElement("div");
  head.className = "head";
  const num = document.createElement("span");
  num.className = "num"; num.textContent = "?";
  const name = document.createElement("span");
  name.className = "name"; name.textContent = q.text;
  head.appendChild(num); head.appendChild(name);
  node.appendChild(head);
  const row = document.createElement("div");
  row.className = "row";
  const src = tag("вопрос продукта " + q.product);
  src.title = "наблюдено: раздел «Открытые вопросы» в products/" + q.product + "/product.md";
  row.appendChild(src);
  node.appendChild(row);
  return node;
}

function promiseNode(q) {
  const node = document.createElement("div");
  node.className = "plate p-plan q";
  const head = document.createElement("div");
  head.className = "head";
  const num = document.createElement("span");
  num.className = "num"; num.textContent = "•";
  const name = document.createElement("span");
  name.className = "name"; name.textContent = q.text;
  head.appendChild(num); head.appendChild(name);
  node.appendChild(head);
  const row = document.createElement("div");
  row.className = "row";
  const src = tag("«В работе» продукта " + q.product);
  src.title = "наблюдено: раздел «В работе» в products/" + q.product
    + "/product.md, задача в строке не названа";
  row.appendChild(src);
  node.appendChild(row);
  return node;
}

function channelsNode(panel) {
  const node = document.createElement("div");
  node.className = "chan";
  const names = { telegram: "Telegram", email: "Почта продакта", git: "Git" };
  const out = [];
  for (const c of panel.channels) {
    out.push(names[c.channel] + (c.direction === "in" ? " входящих " : " исходящих ") + c.count);
  }
  if (out.length) {
    const line = document.createElement("div");
    line.textContent = "Связь: " + out.join(" · ");
    node.appendChild(line);
  }
  /* Commits and pushes at the level of the product, not the task: nothing on
     disk ties a commit to a task number, so no such tie is drawn. */
  for (const repo of panel.repos) {
    const line = document.createElement("div");
    const head = document.createElement("b");
    head.textContent = repo.name;
    line.appendChild(head);
    line.appendChild(document.createTextNode(" " + (repo.branch || "?") + " · " +
      (repo.head || "?") + " · " + (repo.head_subject || "")));
    if (repo.tracked_dirty || repo.unpushed) {
      const warn = document.createElement("span");
      warn.className = "warn";
      const bits = [];
      if (repo.tracked_dirty) bits.push("незакоммичено " + repo.tracked_dirty);
      if (repo.unpushed) bits.push("не отправлено " + repo.unpushed);
      warn.textContent = " — " + bits.join(", ");
      line.appendChild(warn);
    }
    node.appendChild(line);
  }
  return node;
}

function stripItem(p, cls) {
  const s = document.createElement("span");
  s.className = "item " + cls;
  const bits = ["#" + p.id, p.title];
  if (p.actor) bits.push("— " + p.actor);
  if (p.role) bits.push("(" + (ROLE_RU[p.role] || p.role) + ")");
  const age = ago(ageOf(p));
  if (age) bits.push("· " + age);
  s.textContent = bits.join(" ");
  /* The jam is named on the first screen, so its reason has to be there too:
     «где затор» without «почему» is two thirds of an acceptance question. The
     text is shown as its own span and in full, so it is read rather than
     hovered over or cut. The observed reason and a live child's activity line
     are two different facts — as they are on the plate — so they keep two
     classes: `.why` carries a paired source and `.doing` does not. */
  const why = p.why || p.happening;
  if (why) {
    const w = document.createElement("span");
    w.className = p.why ? "why" : "doing"; w.textContent = " — " + why;
    if (p.why && p.why_src) w.title = "наблюдено: " + p.why_src;
    s.appendChild(w);
  }
  s.title = p.thread;
  return s;
}

function drawStrip(board) {
  const strip = el("strip");
  strip.textContent = "";
  const groups = [
    ["Кто работает сейчас", board.now, "who", "никто: живых прогонов нет", board.now_hidden],
    ["Где затор", board.jams, "jam", "заторов нет", board.jams_hidden],
    /* The first question of every wake-up, so it stands on the first screen
       beside the other two rather than under a fold. */
    ["Что подхватить", board.pickup, "pick", "нечего: свободных задач нет", board.pickup_hidden],
  ];
  for (const [label, items, cls, empty, hidden] of groups) {
    const grp = document.createElement("div");
    grp.className = "grp";
    const lbl = document.createElement("span");
    lbl.className = "lbl"; lbl.textContent = label;
    grp.appendChild(lbl);
    if (!items.length) {
      const none = document.createElement("span");
      none.className = "none"; none.textContent = empty;
      grp.appendChild(none);
    }
    for (const p of items) grp.appendChild(stripItem(p, cls));
    /* The strip shows as many names as fit with their reason whole, so what it
       did not take has to be counted here: a cap nobody can see reads as
       «показано всё», and the rest stands in the columns below. */
    if (hidden > 0) {
      const more = document.createElement("span");
      more.className = "more";
      more.textContent = "ещё " + hidden + " — в колонках ниже";
      grp.appendChild(more);
    }
    strip.appendChild(grp);
  }
  const grp = document.createElement("div");
  grp.className = "grp";
  const lbl = document.createElement("span");
  lbl.className = "lbl"; lbl.textContent = "Ждёт решения человека";
  const n = document.createElement("span");
  n.className = board.waiting ? "ask" : "none";
  /* The number, and what it is made of. A single figure nobody could take apart
     is what let thirteen wrong entries stand as an answer; split by source, a
     reader can check it against the first area of the columns below. */
  const parts = [];
  if (board.waiting_tasks) parts.push(board.waiting_tasks + " в задачах");
  if (board.waiting_questions) parts.push(board.waiting_questions + " вопросов продуктов");
  n.textContent = board.waiting
    ? board.waiting + " — " + parts.join(" и ") + ", первой областью в колонках ниже"
    : "ничего";
  grp.appendChild(lbl); grp.appendChild(n);
  strip.appendChild(grp);

  /* The second instance of the product owner. Two pairs of duplicate tasks were
     created in one hour — 790/792 and 791/793 — because the owner in the chat
     and the owner woken by the timer each had their own queue and neither could
     see the other's. Knowing another one is awake is what prevents the third
     pair, so it stands on the strip and not in a column. */
  const awake = board.owners_awake || [];
  const mine = document.createElement("div");
  mine.className = "grp";
  const ml = document.createElement("span");
  ml.className = "lbl"; ml.textContent = "Другой я";
  mine.appendChild(ml);
  if (!awake.length) {
    const none = document.createElement("span");
    none.className = "none";
    none.textContent = "никто больше не разбужен";
    mine.appendChild(none);
  }
  for (const owner of awake) {
    const s = document.createElement("span");
    s.className = "item jam";
    const age = ago(ageOf({ since: owner.since, age_seconds: owner.age_seconds }));
    s.textContent = "продакт разбужен на треде «" + (owner.thread || "?") + "»"
      + (age ? " · " + age : "") + " — не заводите задачу, не посмотрев его очередь";
    s.title = "наблюдено: " + owner.src;
    mine.appendChild(s);
  }
  strip.appendChild(mine);
}

function drawBoard(board, snapshot) {
  drawStrip(board);
  const columns = el("columns");
  columns.textContent = "";
  for (const panel of board.panels) {
    const col = document.createElement("div");
    col.className = "col";

    const head = document.createElement("div");
    head.className = "colhead";
    const h2 = document.createElement("h2");
    h2.textContent = panel.title;
    const meta = document.createElement("div");
    meta.className = "meta";
    const running = panel.areas.find(a => a.key === "running").count;
    const waiting = panel.areas.find(a => a.key === "waiting_human").count;
    const stuck = panel.areas.find(a => a.key === "stuck").count;
    meta.textContent = "задач " + panel.task_count + " · в работе " + running +
                       " · ждёт человека " + waiting + " · заторов " + stuck;
    head.appendChild(h2); head.appendChild(meta);
    col.appendChild(head);

    const body = document.createElement("div");
    body.className = "colbody";
    for (const area of panel.areas) body.appendChild(areaNode(panel, area));
    col.appendChild(body);
    col.appendChild(channelsNode(panel));
    columns.appendChild(col);
  }

  const totals = board.panels.reduce((acc, p) => {
    for (const a of p.areas) acc[a.key] = (acc[a.key] || 0) + a.count;
    return acc;
  }, {});
  el("boardsub").textContent = "в работе " + (totals.running || 0) +
    " · ждёт решения человека " + (totals.waiting_human || 0) +
    " · заторов " + (totals.stuck || 0) +
    " · можно подхватить " + (totals.pickup || 0) +
    " · надо запланировать " + (totals.plan || 0) +
    " · собрано " + new Date(DATA.built_at).toLocaleString("ru-RU");
  el("boardmode").textContent = snapshot.mode === "demo" ? "обезличено" : "";
}

/* Redraw in place with a fresher document. Live mode used to call
   `location.reload()`, which is fine for a picture and wrong for a tool: it
   throws away the open card, the scroll position and the selection every ten
   seconds, so a person reading a task would be interrupted mid-sentence by a
   repository going dirty somewhere else. The board is rebuilt from the new
   payload, the folded areas already survive through `sessionStorage`, and the
   open card is reopened on the same task if that task is still there. */
function applyFresh(fresh) {
  DATA.snapshot = fresh.snapshot;
  DATA.board = fresh.board;
  DATA.world = fresh.world;
  DATA.timeline = fresh.timeline;
  DATA.built_at = fresh.built_at;
  DATA.digest = fresh.digest;
  const wanted = openTask;
  const scroll = el("columns").scrollTop;
  drawBoard(DATA.board, DATA.snapshot);
  el("columns").scrollTop = scroll;
  if (wanted) {
    const again = DATA.board.panels
      .flatMap(p => p.areas).flatMap(a => a.plates)
      .find(p => p.task === wanted);
    /* Gone from the board — folded into `Сделано`, or dropped by a cap — is not
       the same as unchanged, so the card closes rather than showing a state
       that is no longer the board's. */
    if (again) openCard(again); else closeCard();
  }
}

/* ---------- two screens ---------- */
const MAP_PARTS = ["stage", "top", "legend", "panels", "bottom"];
function showBoard(on) {
  el("board").style.display = on ? "flex" : "none";
  for (const id of MAP_PARTS) el(id).style.display = on ? "none" : "";
  el("toboard").classList.toggle("on", on);
  el("tomap").classList.toggle("on", !on);
  sessionStorage.setItem("screen", on ? "board" : "map");
  if (!on) { resize(); fit(); }        // the canvas had no size while hidden
}
el("toboard").addEventListener("click", () => showBoard(true));
el("tomap").addEventListener("click", () => showBoard(false));
el("tomapback").addEventListener("click", () => showBoard(true));

drawBoard(BOARD, SNAP);
setInterval(() => {
  for (const node of document.querySelectorAll(".tag.age[data-since]")) {
    const age = ago(ageOf({ since: node.dataset.since }));
    if (age) node.textContent = ageCaption(age);
  }
}, 30000);
window.addEventListener("resize", resize);
resize();
requestAnimationFrame(frame);
/* The board is the default screen. The timeline from the previous version stays
   as a second mode, one button away, and starts playing only when opened. */
showBoard(sessionStorage.getItem("screen") !== "map");
setTimeout(() => { if (sessionStorage.getItem("screen") === "map") setPlaying(true); }, 700);

/* Live mode: the same renderer, served with a fresh snapshot. A recording never
   takes this branch — `file://` cannot fetch, and its data is already inside. */
if (DATA.live_url) {
  el("mode").textContent = "живой режим";
  setInterval(async () => {
    try {
      const fresh = await (await fetch(DATA.live_url, { cache: "no-store" })).json();
      /* The digest covers the whole shown document, not the length of the
         timeline. A status change, a run that died, a repository gone dirty —
         none of them append a record, and all of them have to reach the screen
         (finding MEDIUM-1 of review 780). */
      if (fresh.digest !== DATA.digest) applyFresh(fresh);
    } catch (err) { /* server gone: keep showing what we have */ }
  }, 10000);
}
</script>
