<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Не «процессной работы»: направлений четыре, и процессный контур — одно из них. -->
<title>Доска работ</title>
<style>
  /* ---------- light, and nothing else ----------
     The board is a working screen someone reads in daylight, and the user asked
     for it plainly: «Давай доску сделаем в светлой теме». So light is not a
     theme switch with a default — it is the page. The dark palette that used to
     live here belonged to the isometric map, the second screen this board could
     be switched to; the switch and the screen are both gone (task 1067), and the
     recording they played back stays as the feed of observed changes above the
     columns. */
  :root {
    --ink: #16202e; --dim: #55647a; --edge: #d3dae4;
    --bg0: #f2f5f9; --bg1: #ffffff; --panel: rgba(255,255,255,.94);
    --live: #16794a; --blocked: #b3261e; --killed: #6234c9;
    --stale: #8a5300; --gap: #a2470a; --done: #0a6ba6; --idle: #6b7a8d;
    /* «Можно подхватить» and «надо запланировать» are invitations, not alarms,
       so they get their own two hues instead of borrowing a warning colour. */
    --pick: #0a7285; --plan: #6b31b8;
    /* Our own decisions, and finished work nobody was shown. Neither is the
       user's problem, so neither borrows the colour of a question to them:
       «Решает продакт» is deliberately neutral, «Сделано, но не доставлено» is
       warm because a document lying on a server is a thing to go and fix. */
    --ours: #46556b; --undelivered: #b04a05;
    --plate: #ffffff; --plate-hover: #f6f9fd; --surface: #fbfcfe;
  }
  * { box-sizing: border-box; }
  html { margin: 0; }
  /* The page scrolls. Nothing is squeezed to fit one screen: the user asked for
     exactly this — «не надо стараться всё упихнуть в экран, мне подойдёт, если
     будет скролл. А то так ничего не понятно: микроплашки с микроскроллом». So
     there is one scrollbar on the document and none inside a plate, an area or
     a column, and a long text makes its plate taller instead of hiding its tail. */
  body {
    margin: 0; min-height: 100%;
    background: var(--bg0);
    color: var(--ink); font: 14.5px/1.5 "Inter", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { background: var(--plate); color: var(--ink); border: 1px solid var(--edge);
           border-radius: 9px; padding: 7px 13px; font: inherit; cursor: pointer; }
  button:hover { background: var(--plate-hover); }
  button.primary { background: #e4f3ea; border-color: #9ed3b6; color: var(--live); }
  #boardmode { font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
          border: 1px solid var(--edge); border-radius: 999px; padding: 2px 9px; color: var(--dim); }
  /* Nothing to say means nothing on the screen: the badge used to be a bare
     `span`, and giving it a border made an empty one a small empty pill. */
  #boardmode:empty { display: none; }

  /* ---------- board: the default screen ----------
     In the normal flow of the document, not pinned to the viewport. The board
     used to be `position: fixed; inset: 0` with `overflow: hidden`, and every
     nested scrollbar on the page followed from that one decision: seven areas
     sharing a fixed column height, each crushed to its minimum, each with its
     own scrollbar — «микроплашки с микроскроллом». Now the page is as tall as
     what it has to say. */
  #board, #tasklist { display: flex; flex-direction: column; }
  /* The heading and the strip stay in view while the columns scroll past them:
     «кто работает, где затор, что ждёт человека» are the first-screen answers,
     and keeping them is what the room freed by scrolling is for. */
  #boardhead, #taskhead { position: sticky; top: 0; z-index: 6; background: var(--bg1);
               padding: 12px 18px 8px; display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap;
               border-bottom: 1px solid var(--edge); }
  #boardhead h1, #taskhead h1 { margin: 0; font-size: 17px; font-weight: 650; }
  #boardhead .sub, #taskhead .sub { color: var(--dim); font-size: 12.5px; }
  /* The topmost state line: the instant of the collection, «в работе», and
     «ждёт решения пользователя» when it is not zero. Three things, because the
     board below is the place where a number stands next to what it counts. */
  #boardstate { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap;
                font-size: 12.5px; }
  #boardstate .at { color: var(--dim); font-variant-numeric: tabular-nums; }
  #boardstate .count { font-weight: 600; font-variant-numeric: tabular-nums; }
  #boardstate .count.live { color: var(--live); }
  /* Nothing running is the state to notice, so zero is amber rather than grey:
     «жёлтое при нуле и зелёное при любом ненулевом значении». */
  #boardstate .count.none { color: var(--stale); }
  #boardstate .count.waiting { color: var(--blocked); }
  /* The feed of observed changes, freshest first, straight under the heading.
     What stood here before was the same seven counts the columns already show. */
  #feed { padding: 9px 18px; border-bottom: 1px solid var(--edge);
          background: var(--bg1); font-size: 12.5px; }
  #feed .lbl { color: var(--dim); font-size: 11px; letter-spacing: .07em;
               text-transform: uppercase; display: block; margin-bottom: 4px; }
  #feed .none { color: var(--idle); }
  #feed .row { display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap;
               padding: 2px 0; }
  #feed .when { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
  #feed .kind { color: var(--dim); font-size: 11px; letter-spacing: .05em;
                text-transform: uppercase; border: 1px solid var(--edge);
                border-radius: 5px; padding: 0 6px; flex: none; }
  #feed .what { overflow-wrap: anywhere; }
  #feed .task { color: var(--dim); }
  #feed .srcbtn { margin: 0; padding: 0 4px; }
  #feed .srcbtn .w { display: none; }
  #feed .srcbox { flex: 1 1 100%; }
  /* The strip above the columns: who is working and where the jam is, by name.
     Both answers have to be readable without scrolling anything. */
  #strip { display: flex; gap: 4px 22px; padding: 9px 18px; border-bottom: 1px solid var(--edge);
           background: var(--bg1);
           flex-wrap: wrap; font-size: 13px; align-items: baseline; }
  #strip .grp { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; max-width: 100%; }
  #strip .lbl { color: var(--dim); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; }
  #strip .who { color: var(--live); }
  #strip .jam { color: var(--blocked); }
  #strip .ask { color: var(--stale); }
  #strip .pick { color: var(--pick); }
  #strip .none { color: var(--idle); }
  /* Every item shows its whole text. Cutting the line into an ellipsis was how
     the strip named four jams and let a person read the reason of one (finding
     HIGH-1 of review 789): three reasons ran to `x=2536.9` inside a 1440 window
     and were elided. The strip is kept short by showing fewer jams — the count
     the renderer fits into `STRIP_GROUP_CHARS`, with the rest counted out loud —
     not by hiding the end of a reason it has already promised to answer.
     `overflow-wrap: anywhere` is required, not cosmetic: an observed reason is
     often one unbroken token (`queued_behind_active_worktree_writers_669_689`)
     and would otherwise push the box past the window on a phone. */
  #strip .item { border: 1px solid var(--edge); border-radius: 6px; padding: 2px 8px;
                 max-width: 100%; white-space: normal; overflow-wrap: anywhere;
                 line-height: 1.35; }
  /* The reason, right next to the jam it belongs to. Dimmer than the name so the
     eye reads «what» first and «why» second, but on the same line and never
     hidden behind a hover. */
  #strip .why { color: var(--dim); }
  /* A live child's activity line: the same fact as `.doing` on the plate, and
     not the observed reason of a jam. */
  #strip .doing { color: var(--dim); }
  /* What the strip did not take. A silent cap reads as «показано всё». */
  #strip .more { color: var(--dim); }
  #strip .grp { flex: 1 1 100%; }
  #strip .ours { color: var(--ours); }
  #strip .undelivered { color: var(--undelivered); }
  /* Единственная строка доски, обращённая к человеку. Набиралась тем же серым и
     тем же весом, что и всё остальное. */
  #strip .lbl.you { color: var(--stale); font-weight: 700; }
  #strip .ask.you { color: var(--stale); font-weight: 600; }
  /* The strip has no height cap and no scrollbar of its own any more. What keeps
     it short is the character budget in the renderer, which shows fewer names
     rather than cutting the ones it shows; a cap here would have been a second
     mechanism doing the same job badly — and a scrollbar inside a header is
     exactly the «микроскролл» the user asked to be rid of. */

  /* ---------- аппарат происхождения: один переключатель на всю страницу ----------
     «Источник», «Сверка», «также названы», «наблюдено по mtime», строка хода
     работы, которую ребёнок пишет себе, — доказательство, что картинка не врёт.
     Нужно проверяющему, а не читателю: одна и та же строка сверки стояла на
     экране двадцать три раза подряд. Ничего не удалено — всё включается одной
     кнопкой в шапке. */
  body:not(.prov) .srcbtn,
  body:not(.prov) .srcbox,
  body:not(.prov) .doing,
  /* Полоса задаёт своим группам `display: flex` селектором с идентификатором, и
     он перебивает правило по классу: у выключателя должен быть тот же вес. */
  body:not(.prov) #strip .prov,
  body:not(.prov) .prov { display: none; }
  #tosources.on { background: #e2edf7; border-color: #9dbcd8; color: var(--done); }

  /* Длинный текст: три строки, целиком — кнопкой рядом. Одна механика на все
     длинные блоки страницы; текст не режется, а складывается. */
  .fold { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
          overflow: hidden; }
  .fold.open { display: block; -webkit-line-clamp: none; overflow: visible; }
  /* Слева зазор, потому что в полосе кнопка стоит сразу за текстом строки. */
  .foldbtn { font: inherit; font-size: 11.5px; background: none; border: 0; padding: 1px 0;
             margin: 0 10px 0 6px; color: var(--dim); cursor: pointer; text-align: left;
             text-decoration: underline dotted; }
  .foldbtn:hover { color: var(--ink); background: none; }

  /* ---------- очередь и бэклог, как их установил план ----------
     Порядок работ принадлежит портфельному плану, а не наблюдению, и план один
     на все направления: у него сквозной порядок, а колонки разложены по
     направлениям. Поэтому очередь стоит одним списком над колонками — там же,
     где стоит ответ на «кто работает сейчас», — а в колонках те же задачи стоят
     каждая в своём направлении. Это один и тот же ответ, собранный один раз в
     сборщике и показанный с двух сторон.

     Раскрыт по умолчанию: пользователь пишет письмо именно за этим ответом, и
     ответ под складкой — это ещё одно письмо. */
  #plan { padding: 10px 18px 12px; border-bottom: 1px solid var(--edge);
          background: var(--bg1); font-size: 13px; }
  #plan > .grp { margin-top: 8px; }
  #plan .lbl { color: var(--dim); font-size: 11px; letter-spacing: .07em;
               text-transform: uppercase; display: block; margin-bottom: 5px; }
  #plan .owner { color: var(--dim); font-size: 11.5px; }
  #plan .rows { display: flex; flex-direction: column; gap: 3px; }
  /* Номер места — своей колонкой, а не первым словом строки: строка переносится,
     и без колонки вторая задача той же строки читалась как отдельное место в
     очереди. Порядок — это то, ради чего раздел существует, и он не может
     зависеть от ширины окна. */
  #plan .row { display: flex; gap: 8px; align-items: baseline;
               max-width: 100%; line-height: 1.4; }
  #plan .items { display: flex; flex-direction: column; gap: 2px; min-width: 0;
                 white-space: normal; overflow-wrap: anywhere; }
  #plan .pos { color: var(--dim); font-variant-numeric: tabular-nums; flex: none;
               min-width: 22px; text-align: right; }
  /* Строка плана, каждая задача которой по наблюдению уже закрыта. Она остаётся
     на своём месте — расхождение плана и наблюдения не прячется, — но глаз
     проходит мимо неё к работе, которая ещё стоит. */
  #plan .row.closed .name, #plan .row.closed .free { color: var(--dim); }
  #plan .num { color: var(--dim); font-variant-numeric: tabular-nums; }
  #plan .name { color: var(--ink); }
  /* Что наблюдение видит там, где план назвал порядок. Расхождение — это
     содержание, а не ошибка отрисовки: план ставит задачу третьей, наблюдение
     видит её живой, и обе стороны стоят рядом в одной строке. */
  #plan .seen { color: var(--dim); }
  #plan .seen.live { color: var(--live); }
  #plan .seen.done { color: var(--done); }
  #plan .seen.stuck { color: var(--blocked); }
  /* Строка плана, за которой задачи наблюсти не удалось. Слова те же, что у
     «Надо запланировать»: сверка не сошлась — это не «задачи нет». */
  #plan .free { color: var(--ink); }
  #plan .unlinked { color: var(--plan); }
  #plan .none { color: var(--idle); }
  /* Хвост списка и кнопка, которая его раскрывает. Складка — существующая
     механика областей (`asFolder`, `.shut`, `sessionStorage`), а не своя.
     Выглядит кнопкой, а не сноской: «ещё строк редакции: 19» серым мелким
     шрифтом никто не считал органом управления и не нажимал. */
  #plan .rows.shut { display: none; }
  #plan .more { margin-top: 6px; font-size: 12px; padding: 4px 10px; }
  /* Кнопка источника стоит под строкой, а не растягивается на всю её ширину:
     колонка задач — это столбец, и кнопка в нём иначе занимает целую строку. */
  #plan .srcbtn { align-self: flex-start; }
  /* Метка «связь с задачей не установлена» на телефоне шире окна, а `nowrap`
     достался ей от плашек: там метки короткие. Здесь она переносится — измерено
     на 390, где строка иначе уезжала за правый край на 46 пикселей. */
  #plan .tag { white-space: normal; }

  /* The answer the user opens this page for: one compact row per result named
     in the current plan, joined to the task/lifecycle observations already on
     the page. It is distinct from both the mechanical pickup catalogue and the
     historical activity feed. */
  #dayplan { padding: 10px 18px 12px; border-bottom: 1px solid var(--edge);
             background: var(--bg1); }
  #dayplan .dayhead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap;
                      margin-bottom: 6px; }
  #dayplan .dayhead b { font-size: 14px; }
  #dayplan .dayhead span { color: var(--dim); font-size: 11.5px; }
  #dayrows { display: grid; gap: 5px; }
  .dayrow { display: grid; grid-template-columns: minmax(190px, 1.2fr) 100px 145px minmax(220px, 1fr);
            gap: 8px 12px; padding: 7px 9px; border: 1px solid var(--edge);
            border-radius: 8px; background: var(--surface); align-items: baseline; }
  .dayrow .name { font-weight: 600; overflow-wrap: anywhere; }
  .dayrow .state { font-weight: 650; }
  .dayrow .state.done { color: var(--done); }
  .dayrow .state.running { color: var(--live); }
  .dayrow .state.stuck { color: var(--blocked); }
  .dayrow .state.unknown { color: var(--dim); }
  .dayrow .changed { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .dayrow .why, .dayrow .next { font-size: 12.5px; overflow-wrap: anywhere; }
  .dayrow .why { grid-column: 1 / 4; color: var(--dim); }
  .dayrow .next { grid-column: 4; grid-row: 1 / span 2; }
  .dayrow .next b { font-weight: 600; }
  .dayrow > .srcbtn, .dayrow > .srcbox { grid-column: 1 / -1; }

  #columns { display: grid; grid-template-columns: repeat(4, 1fr);
             gap: 14px; padding: 14px; align-items: start; }
  .col { display: flex; flex-direction: column; min-width: 0;
         border: 1px solid var(--edge); border-radius: 12px; background: var(--surface);
         box-shadow: 0 1px 2px rgba(22,32,46,.05); }
  .colhead { padding: 10px 12px 8px; border-bottom: 1px solid var(--edge); }
  .colhead h2 { margin: 0; font-size: 13.5px; font-weight: 620; }
  .colhead .meta { color: var(--dim); font-size: 11.5px; margin-top: 3px; }
  /* Состояние направления одной строкой — вопрос пользователя дословно: «как
     быстро я могу понять статус по направлениям, глядя на панель». Здесь стояли
     шесть равновесных чисел, из которых большинство нули. */
  .state { margin-top: 4px; font-size: 12.5px; line-height: 1.4; }
  .state .mark { font-weight: 640; }
  .state .mark.live { color: var(--live); }
  .state .mark.stuck { color: var(--blocked); }
  .state .mark.ask { color: var(--stale); }
  .state .mark.hold { color: var(--ours); }
  .state .mark.idle { color: var(--undelivered); }
  .state .mark.free { color: var(--pick); }
  .state .what { color: var(--ink); }
  /* Без `display`: причину складывает `.fold`, и он задаёт свой. */
  .state .why { color: var(--dim); }
  .state .why.alarm { color: var(--undelivered); font-weight: 560; }
  .state .next { color: var(--dim); display: block; margin-top: 2px; }
  .state .next b { color: var(--ink); font-weight: 600; }
  /* Сколько областей колонки пусты — одной строкой вместо тридцати пяти
     заголовков со словом «пусто». */
  .voids { color: var(--idle); font-size: 11.5px; line-height: 1.35; }
  /* «Когда проверит в следующий раз, когда проверял в прошлый и чем то кончилось».
     It sits in the column head rather than in an area because it is a fact about
     the direction's owner and not about any one task, and a person who opens the
     board on a column of zeros reads it before they read the zeros. */
  .check { display: flex; flex-direction: column; gap: 2px;
           margin-top: 5px; font-size: 11.5px; line-height: 1.35; }
  .check .next { color: var(--ink); font-weight: 560; }
  /* Why the next check is unknown, as ordinary readable text. It used to live
     only in a `title` attribute, which a phone or a tablet never shows at all
     (finding MEDIUM-1 of review 900): the line promised an explanation and then
     kept it for pointer users. */
  .check .nextwhy { color: var(--dim); }
  .check .last, .check.none { color: var(--dim); }
  .check .why { color: var(--ours); }
  /* A direction standing still for no observable reason is the user's own
     complaint made visible, so it is not another grey line. */
  .check .why.alarm { color: var(--undelivered); font-weight: 560; }
  /* «Продолжить сейчас» stands under the same check it is about: the line above
     says when the owner looked and what came of it, and this is how to make it
     look again without waiting for the timer. */
  .continue { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap;
              margin-top: 6px; font-size: 11.5px; }
  .continue button { padding: 4px 10px; font-size: 12px; }
  .continue button:disabled { opacity: .55; cursor: default; }
  .continue .said { color: var(--dim); }
  /* What is owed to the user on this direction. It stands in the column head
     beside the check for the same reason the check does: it is a fact about the
     direction rather than about one task, and a person opening the board on
     problematic work wants «что обещано и где это стоит» before the columns.
     A goal under reinforced control is marked, because that mode is exactly the
     thing that must never be silent. */
  .goals { display: flex; flex-direction: column; gap: 6px; margin-top: 7px; }
  .goal { border-left: 2px solid var(--ours); padding-left: 7px;
          font-size: 11.5px; line-height: 1.35; }
  .goal .head { color: var(--ink); font-weight: 600; }
  .goal .head .mode { color: var(--undelivered); font-weight: 620; }
  .goal .line { color: var(--dim); }
  .goal .gap { color: var(--ours); }
  .goal .done { color: var(--dim); }
  /* Обещанное остаётся в шапке колонки, а его разбор складывается: полторы
     тысячи знаков прозы стояли между «что дальше» и самими задачами. */
  .goal .rest.shut { display: none; }
  /* Neither the column nor an area scrolls inside itself any more. The two
     previous versions of this file both tried to divide a fixed window height
     between nine areas — first by letting each area scroll, then by adding a
     scrollbar to the column as a safety valve — and both produced the screen the
     user described: plates too small to read, each with its own tiny scrollbar.
     The room comes from the page instead, so an area is exactly as tall as what
     it holds and nothing inside it is ever out of view. */
  .colbody { display: flex; flex-direction: column;
             gap: 14px; padding: 10px 11px 14px; }

  .area { display: flex; flex-direction: column; }
  .area .plates { display: flex; flex-direction: column; }
  .area > h3 { margin: 0 0 6px; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase;
               color: var(--dim); display: flex; gap: 7px; align-items: baseline;
               flex-wrap: wrap; }
  /* The heading folds the area, so the thing that folds it is a button and says
     whether the area is open. It was an `h3` with a hand cursor: thirty-six of
     them, none reachable by Tab, none telling a screen reader what pressing
     would do. The button keeps the heading's own look — it is still a heading,
     not a widget dropped into one. */
  .area > h3 > .areahead { font: inherit; color: inherit; letter-spacing: inherit;
               text-transform: inherit; background: none; border: 0; padding: 0;
               margin: 0; border-radius: 4px; cursor: pointer; text-align: left; width: 100%;
               display: flex; gap: 7px; align-items: baseline; flex-wrap: wrap; }
  .area > h3 > .areahead:hover { background: none; color: var(--ink); }
  .area > h3 .n { color: var(--ink); font-size: 12.5px; font-weight: 650; }
  .area > h3 .old { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; }
  .area.a-waiting_human > h3 { color: var(--stale); }
  .area.a-running > h3 { color: var(--live); }
  .area.a-stuck > h3 { color: var(--blocked); }
  /* «Можно подхватить» is the first question of a wake-up, so it reads as an
     invitation rather than as another warning. */
  .area.a-pickup > h3 { color: var(--pick); }
  /* Бэклог — не тревога и не приглашение: это то, что стоит по решению или без
     решения, и цвет у него нейтральный, как у «Решает продакт». */
  .area.a-backlog > h3 { color: var(--ours); }
  .area.a-plan > h3 { color: var(--plan); }
  .area.a-product_owner > h3 { color: var(--ours); }
  .area.a-undelivered > h3 { color: var(--undelivered); }
  /* «Готово к запуску» is «можно подхватить» with a condition behind it that
     has since been met, so it reads in the same colour and stands above it. */
  .area.a-ready_to_start > h3 { color: var(--pick); }
  /* A decision taken and not carried out is our own jam, not the work's. */
  .area.a-decision_unmet > h3 { color: var(--undelivered); }
  .area.shut .plates { display: none; }
  /* The rule that selected the contents of an area, printed with the area. It
     matters for «надо запланировать», whose whole content is text picked by a
     narrow test — a reader who cannot see the test would read the heading as a
     verdict about the work rather than as a statement about the line. */
  .area .rule { color: var(--idle); font-size: 11px; line-height: 1.35;
                margin: -2px 0 6px; flex: none; }
  .area.shut .rule { display: none; }

  /* Nothing on a plate is cut, clamped or elided. Every line clamp
     that used to stand in this block existed to protect a fixed screen height
     that no longer exists: a long reason now makes its plate taller and the page
     taller with it, which is what the user asked for in as many words — «плашка
     обязана быть читаемой: текст не режется». `overflow-wrap: anywhere` stays,
     because an observed reason is often one unbroken token
     (`queued_behind_active_worktree_writers_669_689`) that would otherwise push
     the column past the window on a phone. */
  .plate { border: 1px solid var(--edge); border-left: 3px solid var(--idle); border-radius: 9px;
           background: var(--plate); padding: 9px 11px; margin-bottom: 8px;
           overflow-wrap: anywhere; }
  .plate:last-child { margin-bottom: 0; }
  .plate.p-waiting_human { border-left-color: var(--stale); }
  .plate.p-running { border-left-color: var(--live); }
  .plate.p-stuck { border-left-color: var(--blocked); }
  .plate.p-done { border-left-color: var(--done); }
  .plate.p-pickup { border-left-color: var(--pick); }
  .plate.p-plan { border-left-color: var(--plan); }
  .plate.p-product_owner { border-left-color: var(--ours); }
  .plate.p-undelivered { border-left-color: var(--undelivered); }
  .plate.p-ready_to_start { border-left-color: var(--pick); }
  .plate.p-decision_unmet { border-left-color: var(--undelivered); }
  /* A plate opens its card. It is a control, so it says so before it is clicked
     rather than after — a board nobody knows is clickable has no drill-down.
     The cursor is only half of saying so: it was the *whole* signal, so on a
     phone there was none, and forty presses of Tab over the whole board reached
     two buttons and no plate at all. What makes it a control is the role, the
     focus and the name; the cursor stays as the pointing device's share of it. */
  .plate[role="button"] { cursor: pointer; }
  .plate[role="button"]:hover { border-color: #9fb0c6; background: var(--plate-hover); }
  /* A plate that opens nothing looks like nothing. Thirty-three product
     questions and promises carried the hand cursor and the hover of a control
     and did nothing when pressed, which is the board teaching a reader that
     pressing means nothing. */
  .plate.q { cursor: default; }
  :focus-visible { outline: 2px solid #1e6fd9; outline-offset: 2px; }

  /* Where an observation is named, and how it is opened. It used to live in the
     browser's own `title`: 223 elements carried one, 53 of them longer than 80
     characters and the longest 178, and on a phone that channel does not exist
     at all. So the plate carries one real button instead — reachable by mouse,
     by Tab and by touch alike — and it opens a block that shows every source of
     that plate whole, next to the claim it stands behind. */
  .srcbtn { font: inherit; font-size: 11.5px; line-height: 1.3; margin-top: 6px;
            padding: 1px 7px; border: 1px dashed var(--edge); border-radius: 5px;
            background: transparent; color: var(--dim); cursor: pointer; }
  .srcbtn::before { content: "ⓘ "; }
  .srcbtn:hover { border-style: solid; color: var(--ink); }
  .srcbtn[aria-expanded="true"] { border-style: solid; color: var(--ink); }
  .srcbox { display: none; margin-top: 5px; padding: 6px 8px; border-radius: 6px;
            background: var(--surface); border: 1px solid var(--edge);
            font-size: 11.5px; line-height: 1.4; color: var(--dim);
            overflow-wrap: anywhere; }
  .srcbox.open { display: block; }
  .srcbox div { margin-bottom: 3px; }
  .srcbox div:last-child { margin-bottom: 0; }
  .srcbox b { color: var(--ink); font-weight: 600; }
  /* In the strip the marker is the glyph alone, and the source block it opens
     takes the whole width of the item rather than sitting on its line. */
  #strip .srcbtn { margin: 0 0 0 6px; padding: 0 4px; }
  #strip .srcbtn .w { display: none; }
  #strip .srcbox { flex: 1 1 100%; margin-top: 4px; }
  .plate .head { display: flex; gap: 7px; align-items: baseline; flex-wrap: wrap; }
  .plate .num { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12.5px; flex: none; }
  .plate .name { font-size: 13.5px; font-weight: 600; line-height: 1.35; }
  .plate .row { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tag { font-size: 11.5px; border: 1px solid var(--edge); border-radius: 5px; padding: 1px 6px;
         color: var(--dim); white-space: nowrap; background: #fff; }
  .tag.who { color: var(--ink); }
  .tag.alive { color: var(--live); border-color: #9ed3b6; }
  .tag.lie { color: var(--blocked); border-color: #e6a9a4; }
  .tag.age { font-variant-numeric: tabular-nums; }
  .tag.retry { color: var(--killed); border-color: #c2b0ec; }
  .tag.doc { color: var(--undelivered); border-color: #edb894; white-space: normal; }
  /* Что о задаче говорит план: место в очереди, пауза его словом или молчание.
     Своим цветом, потому что это единственная надпись на плашке, у которой
     владелец не наблюдение. */
  .tag.plan { color: var(--plan); border-color: #c2b0ec; white-space: normal; }
  .plate .doing { margin-top: 6px; color: var(--dim); font-size: 12.5px; line-height: 1.4; }
  .plate .ask { margin-top: 6px; color: var(--stale); font-size: 12.5px; line-height: 1.4; }
  /* What observed that the question is the user's, or that it is ours. The area
     may not simply assert whose question it is: the mark that put it in front of
     the person — date, channel, message — is printed under the question itself. */
  .plate .asked { margin-top: 3px; color: var(--dim); font-size: 11.5px; line-height: 1.4; }
  /* The observed reason a task stands where it stands. Answering «почему» is an
     acceptance question, so it is not dimmed away into a footnote. */
  .plate .why { margin-top: 6px; font-size: 12.5px; line-height: 1.4; color: var(--stale); }
  .plate.p-stuck .why { color: var(--blocked); }
  /* A product's open question: the same area, so it reads as one list. */
  .plate.q .name { font-weight: 500; }
  .plate.q .num { color: var(--stale); font-weight: 700; }
  .plate.p-product_owner.q .num { color: var(--ours); }
  .plate.p-plan.q .num { color: var(--plan); }
  .plate .more { margin-top: 4px; color: var(--idle); font-size: 12px; }
  .plate .dash { color: var(--idle); }

  /* Repositories and channels are reference, and reference does not outrank the
     answers above it: a direction owning three repositories was taking 181 of
     900 pixels off the areas. */
  /* Repositories and channels are reference, and reference does not outrank the
     answers above it: one direction owning three repositories took 181 of 900
     pixels off the areas that answer the questions. Folded by default, one line
     that says what is inside, and the warnings — uncommitted, unpushed — stay
     on that line so nothing is hidden by folding it. */
  .chan { border-top: 1px solid var(--edge); padding: 9px 12px 11px; font-size: 12px;
          color: var(--dim); }
  .chan.shut .body { display: none; }
  /* Folds the block, so it is a button and says whether the block is open —
     the same rule as the area headings above it. */
  .chan .sum { cursor: pointer; font: inherit; color: inherit; background: none;
               border: 0; padding: 0; text-align: left; width: 100%; border-radius: 4px; }
  .chan .sum:hover { background: none; color: var(--ink); }
  .chan .sum::before { content: "▸ "; color: var(--idle); }
  .chan:not(.shut) .sum::before { content: "▾ "; }
  .chan div { margin-top: 3px; }
  .chan b { color: var(--ink); font-weight: 600; }
  .chan .warn { color: var(--stale); }

  /* ---------- подвал: на чём это работает ----------
     Ревизия стоит внизу, а не в шапке: это ответ проверяющему, а не один из
     четырёх вопросов первого экрана. Красной она становится ровно тогда, когда
     установленное и закоммиченное разошлись. */
  #foot { padding: 10px 18px 22px; color: var(--dim); font-size: 11.5px; }
  #foot .warn { color: var(--undelivered); }

  #switch, #taskswitch { margin-left: auto; display: flex; gap: 6px; }
  #switch button, #taskswitch button { padding: 5px 11px; font-size: 12.5px; }
  #switch button.on, #taskswitch button.on {
    background: #e2edf7; border-color: #9dbcd8; color: var(--done);
  }

  /* ---------- task index: lookup, not another task store ---------- */
  #tasklist { display: none; min-height: 100vh; }
  #tasktools { padding: 18px; border-bottom: 1px solid var(--edge); background: var(--bg1); }
  #tasksearch { width: min(720px, 100%); box-sizing: border-box; border: 1px solid var(--edge);
                border-radius: 10px; background: var(--surface); color: var(--ink);
                padding: 10px 12px; font: inherit; }
  #tasksearch:focus { outline: 2px solid #9dbcd8; outline-offset: 1px; }
  #taskcount { margin-left: 10px; color: var(--dim); font-size: 12.5px; }
  #taskrows { width: min(1040px, calc(100% - 36px)); margin: 14px auto 28px;
              border: 1px solid var(--edge); border-radius: 12px; overflow: hidden;
              background: var(--surface); }
  #taskfilters { display: inline-flex; gap: 5px; align-items: center; flex-wrap: wrap;
                 margin: 8px 8px 0 0; vertical-align: middle; }
  #taskfilters button { padding: 6px 9px; }
  #taskfilters button.on { background: #e2edf7; border-color: #9dbcd8; color: var(--done); }
  #tasksort { border: 1px solid var(--edge); border-radius: 8px;
              background: var(--surface); color: var(--ink); padding: 7px 9px;
              font: inherit; margin: 8px 8px 0 0; }
  .taskrow { display: grid; grid-template-columns: 76px minmax(0, 1fr) 130px 170px;
             gap: 12px; align-items: baseline; padding: 10px 12px;
             border-bottom: 1px solid var(--edge); cursor: pointer; }
  .taskrow:last-child { border-bottom: 0; }
  .taskrow:hover, .taskrow:focus { background: var(--plate-hover); outline: none; }
  .taskrow:focus-visible { box-shadow: inset 0 0 0 2px #9dbcd8; }
  .taskrow .num { color: var(--dim); font-variant-numeric: tabular-nums; }
  .taskrow .name { overflow-wrap: anywhere; }
  .taskrow .status { color: var(--dim); text-align: right; }
  .taskrow .updated { color: var(--dim); text-align: right; font-size: 12px;
                      font-variant-numeric: tabular-nums; }
  #taskempty { color: var(--dim); text-align: center; padding: 28px 12px; }

  /* Two columns before one: at a tablet width four columns give every plate a
     line of two words, and one column makes the page four times as long as it
     needs to be. */
  @media (max-width: 1180px) { #columns { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 900px) {
    #columns { grid-template-columns: 1fr; padding: 10px; }
    /* A phone gives the header a third of the screen if left alone, and every
       line it takes comes off the answers below it. The strip stops being
       sticky here: on a 390-wide screen it is several lines tall, and pinning it
       would leave the columns a slot instead of a screen. */
    #boardhead, #taskhead { position: static; padding: 8px 12px 6px; }
    #boardhead h1, #taskhead h1 { font-size: 15px; }
    /* One column cannot fit four directions, so on a phone the strip *is* the
       first-screen answer — which means a reason may not be cut here. The item
       wraps and the reason takes as many lines as it needs. */
    #strip { padding: 7px 12px; }
    /* Очередь и бэклог на телефоне читаются тем же списком: строка переносится,
       а не обрезается, и порядок остаётся порядком. */
    #plan { padding: 8px 12px 10px; }
    #dayplan { padding: 8px 12px 10px; }
    .dayrow { grid-template-columns: 1fr auto; gap: 3px 8px; padding: 7px 8px; }
    .dayrow .changed { grid-column: 1; }
    .dayrow .why { grid-column: 1 / 3; }
    .dayrow .next { grid-column: 1 / 3; grid-row: auto; }
    /* The three-line clamp that used to stand here was the phone half of finding
       HIGH-1: reasons #723, #727 and #747 ended in an ellipsis and two of them
       ran past the right edge of a 390 window. What keeps «Ждёт решения
       человека» on the first screen is the character budget in the renderer,
       which shows fewer jams, not a clamp that cuts the ones it shows. */
    #strip .why { color: var(--dim); }
    #tasktools { padding: 12px; }
    #taskcount { display: block; margin: 7px 0 0; }
    #taskrows { width: calc(100% - 24px); margin-top: 12px; }
    .taskrow { grid-template-columns: 62px minmax(0, 1fr); gap: 5px 9px; padding: 10px; }
    .taskrow .status { grid-column: 2; text-align: left; font-size: 12px; }
    .taskrow .updated { grid-column: 2; text-align: left; }
  }

  /* ---------- the card: detail without leaving the page ----------
     The user asked to open a plate and see the review verdict and its findings,
     the gates, the last progress line and when it was written, the live process
     and its age, the repository the run was pointed at, what was delivered and
     the files of the task directory — «не уходя со страницы». So it is a layer
     over the board, the board stays where it was, and closing it puts the eye
     back on the plate it was opened from. Board plates and indexed rows carry
     every field in the one document the renderer receives. */
  /* The card is a page, not a drawer with its own scrollbar. It used to be a
     fixed overlay whose body scrolled inside a 900-tall window, which is the
     same «микроскролл» the board itself had: a card about a task with twenty
     files gave the reader a six-line window onto them. Now the board steps
     aside, the card takes the page, and the page scrolls. Nothing is navigated
     to — closing it puts the eye back where it was, at the same scroll offset. */
  #card { display: none; }
  #card.open { display: block; }
  #cardbox { max-width: 940px; margin: 0 auto; background: var(--bg1);
             border: 1px solid var(--edge); border-radius: 12px; }
  #cardhead { position: sticky; top: 0; z-index: 3; background: var(--bg1);
              padding: 14px 16px 11px; border-bottom: 1px solid var(--edge);
              border-radius: 12px 12px 0 0; }
  #cardhead .head { display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap; }
  #cardhead .num { color: var(--dim); font-variant-numeric: tabular-nums; }
  #cardhead .name { font-size: 16px; font-weight: 620; line-height: 1.35; }
  #cardclose { margin-left: auto; flex: none; }
  #cardbody { padding: 14px 16px 24px; }
  #cardbody section { margin-bottom: 14px; }
  #cardbody h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .07em;
                 text-transform: uppercase; color: var(--dim); font-weight: 600; }
  #cardbody .kv { display: grid; grid-template-columns: minmax(96px, auto) 1fr;
                  gap: 3px 12px; font-size: 12.5px; }
  #cardbody .kv dt { color: var(--dim); }
  #cardbody .kv dd { margin: 0; word-break: break-word; }
  #cardbody .none { color: var(--idle); font-size: 12.5px; }
  #cardbody .gate { display: flex; gap: 8px; font-size: 12.5px; padding: 2px 0; }
  #cardbody .gate .r { flex: none; font-weight: 650; font-variant-numeric: tabular-nums; }
  #cardbody .gate .r.ok { color: var(--live); }
  #cardbody .gate .r.bad { color: var(--blocked); }
  #cardbody .files { font-size: 12px; }
  #cardbody .files div { display: flex; gap: 10px; padding: 1.5px 0; }
  #cardbody .files .n { flex: 1; word-break: break-all; }
  #cardbody .files .m { color: var(--dim); flex: none; font-variant-numeric: tabular-nums; }
  #cardbody .src { color: var(--idle); font-size: 11.5px; margin-top: 4px; }
  /* Карточка живёт по тому же правилу, что и доска: «наблюдено: …» — это
     аппарат происхождения, и он за общим переключателем. Предупреждение
     («документ лежит, а доставки нет») им не является и остаётся всегда. */
  body:not(.prov) #cardbody .src:not(.warn) { display: none; }
  #cardbody .warn { color: var(--stale); }
  /* The user's own words about the task, which the card never showed. It reads
     as prose, not as a field: it is the one thing on the card written by a
     person rather than observed from a file. */
  #cardbody .summary { font-size: 13.5px; line-height: 1.5; white-space: pre-wrap;
                       overflow-wrap: anywhere; }
  #cardbody .tech { margin-top: 18px; border-top: 1px solid var(--edge); padding-top: 10px; }
  #cardbody .tech > summary { cursor: pointer; font-size: 11px; letter-spacing: .07em;
                              text-transform: uppercase; color: var(--dim); font-weight: 600; }
  #cardbody .tech .kv { margin-top: 8px; }
  #cardbody .tech .files { margin-top: 8px; }
  @media (max-width: 760px) { #cardbox { border-left: none; border-right: none; border-radius: 0; } }

  @media (max-width: 760px) {
    button { padding: 6px 9px; font-size: 12.5px; }
    #boardmode { display: none; }
    /* One feed row wraps into three lines on a phone, so the space between them
       is what decides whether the board below the feed is reachable at all. */
    #feed { padding: 7px 12px; }
    #feed .row { gap: 3px 8px; padding: 1px 0; line-height: 1.35; }
    #feed .when { font-size: 11.5px; }
  }
</style>
</head>
<body>
<div id="board">
  <div id="boardhead">
    <h1>Доска работ</h1>
    <span id="boardstate"></span>
    <span id="boardmode"></span>
    <span id="switch">
      <button id="tosources">Показать источники</button>
      <button id="toboard" class="on">Доска</button>
      <button id="totasks">Задачи</button>
    </span>
  </div>
  <!-- Порядок сверху вниз и есть предмет задачи 1163: полоса говорит, что идёт,
       что стоит и что требуется лично от вас, колонки под ней — что с каждым
       направлением и что дальше. Очередь плана и лента наблюдений ниже: это
       подробности и история, а не ответы. Ничего не удалено, переставлено. -->
  <div id="strip"></div>
  <div id="dayplan"><div class="dayhead"><b>Результаты плана дня</b><span id="daymeta"></span></div><div id="dayrows"></div></div>
  <div id="columns"></div>
  <div id="plan"></div>
  <div id="feed"></div>
  <div id="foot"></div>
</div>

<div id="tasklist">
  <div id="taskhead">
    <h1>Все задачи</h1>
    <span class="sub">индекс для поиска; подробности читаются из каталога задачи</span>
    <span id="taskswitch">
      <button id="toboard2">Доска</button>
      <button id="totasks2" class="on">Задачи</button>
    </span>
  </div>
  <div id="tasktools">
    <label for="tasksearch">Поиск по номеру или названию</label><br>
    <input id="tasksearch" type="search" inputmode="search"
           placeholder="Например, 1054 или списка задач" autocomplete="off">
    <span id="taskcount"></span>
    <div>
      <span id="taskfilterlabel">Статусы</span>
      <span id="taskfilters" role="group" aria-labelledby="taskfilterlabel">
        <button id="taskfilterready" type="button">Можно брать или в работе</button>
        <button id="taskfilterall" type="button">Все статусы</button>
        <span id="taskfilter"></span>
      </span>
      <label for="tasksort">Сортировка</label>
      <select id="tasksort">
        <option value="updated_desc">Сначала изменённые недавно</option>
        <option value="updated_asc">Сначала изменённые давно</option>
        <option value="id_desc">По номеру: новые сначала</option>
        <option value="id_asc">По номеру: старые сначала</option>
      </select>
    </div>
  </div>
  <div id="taskrows"></div>
</div>

<div id="card">
  <div id="cardbox">
    <div id="cardhead">
      <div class="head">
        <span class="num" id="cardnum"></span>
        <span class="name" id="cardname"></span>
        <button id="cardclose">Закрыть</button>
      </div>
    </div>
    <div id="cardbody"></div>
  </div>
</div>

<script id="payload" type="application/json">__DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("payload").textContent);
const SNAP = DATA.snapshot;
/* Saving a live page keeps its `/data.json` payload field, but file:// cannot
   reach that relative route. At runtime it is a recording, not a broken live
   board. */
const LIVE = Boolean(DATA.live_url) && window.location.protocol !== "file:";

const el = id => document.getElementById(id);

/* ---------- the board ----------
   Four direction panels, areas by urgency inside each, one plate per task. The
   first screen answers the three acceptance questions — who is working, where
   the jam is and why, what waits for a person — so nothing here is decorative.
   Every caption comes from a field of the snapshot; where the snapshot says
   nothing, the plate shows a dash rather than a plausible guess. */
const BOARD = DATA.board;

/* One wording for one measurement. The caption was written out twice — once when
   a plate is built and once by the ticker that refreshes it every half minute —
   so changing it in one place left the other saying something else thirty
   seconds later. What it says is deliberately «без изменений»: the number is the
   age of the freshest file the area is built from, which bounds the transition
   without claiming to be it (finding MEDIUM-1 of review 786). */
function ageCaption(age) { return "без изменений " + age; }

/* An age counted from the instant the state was last observed to change, so it
   stays true while the page sits open rather than freezing at collection time. */
function ageOf(p) {
  if (!p.since) return p.age_seconds;
  const t = Date.parse(p.since);
  return isNaN(t) ? p.age_seconds : Math.max(Math.round((Date.now() - t) / 1000), 0);
}

function ago(seconds) {
  if (seconds === null || seconds === undefined) return null;
  const m = Math.floor(seconds / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d >= 1) return d + (d === 1 ? " день" : (d < 5 ? " дня" : " дней"));
  if (h >= 1) return h + (h === 1 ? " час" : (h < 5 ? " часа" : " часов"));
  if (m >= 1) return m + " мин";
  return "только что";
}

const ROLE_RU = { analysis: "анализ", development: "разработка", tests: "тесты",
                  review: "ревью", commit: "коммит", report: "отчёт" };

/* ---------- Russian for what a person actually reads ----------
   The board is read by one person, in Russian, and it was showing them
   `in_progress`, `danger-full-access`, `decision=deliver` and whole English
   sentences written by a runner. Those are field values of our own contour, so
   they are translated where they are shown rather than left for the reader to
   decode.

   Two kinds, kept apart on purpose. An enumeration has a closed set of values
   and every one of them is named here. Free text does not: a child writes its
   own progress line, and translating it by guesswork would be inventing a fact.
   So free text is passed through a table of the machine tokens and the fixed
   runner phrases this contour writes itself, and anything else reaches the
   screen as it was written — which is honest, and points at the writer of the
   line rather than hiding it. */
const STATUS_RU = { planned: "запланирована", in_progress: "в работе",
                    blocked: "заблокирована", completed: "завершена",
                    cancelled: "отменена", done: "завершена" };
/* Статусы, которые говорят «работа кончилась». Живой прогон их перевешивает —
   сборщик решает это сам, — а плашка называет расхождение вслух. */
const TERMINAL_RU = { completed: true, cancelled: true, superseded: true };
const RUN_STATE_RU = { running: "идёт", completed: "завершён", blocked: "остановлен на блокировке",
                       failed: "провалился", stopped: "остановлен", killed: "убит надзором" };
const WORKFLOW_RU = { standard: "обычный прогон одним ребёнком",
                      "dev-pipeline": "конвейер разработки с ревью" };
const SANDBOX_RU = { "danger-full-access": "полный доступ к диску",
                     "workspace-write": "запись в рабочем каталоге",
                     "read-only": "только чтение" };
const VERDICT_RU = { approved: "принято", rework: "на доработку", changes: "нужны правки" };
const REFUSAL_RU = { premature_completion: "преждевременное завершение" };

/* Fixed phrases this contour writes into `current_step`, longest first so a
   prefix never eats a longer match. */
const PHRASE_RU = [
  ["Standard child completed and durable gates passed",
   "обычный ребёнок завершился, долговечные гейты пройдены"],
  ["Dev-pipeline owner attempt completed", "попытка владельца конвейера завершена"],
  ["Rejected premature completion:", "отказано в преждевременном завершении:"],
  ["Starting child agent via", "запускается ребёнок через"],
  ["Review complete with rework", "ревью закончено с вердиктом «на доработку»"],
  ["Cross-review complete", "кросс-ревью закончено"],
  ["Review complete", "ревью закончено"],
];

/* Machine tokens the contour writes into otherwise human text. */
const TOKEN_RU = [
  [/\bdecision=deliver\b/g, "решение продакта: доставить"],
  [/\bdecision=([a-z_]+)/g, "решение продакта: $1"],
  [/\bstarts_after=(\d+)/g, "начинать после задачи $1"],
  [/\bworktree=(\S+)/g, "занимает рабочее дерево $1"],
  /* The review protocol writes exactly one line, `Verdict: approved|rework`, and
     children quote it inside otherwise free prose. It is a keyword of ours, not
     someone's wording, so it is translated wherever it stands. */
  [/\bVerdict:?\s*rework\b/gi, "вердикт: на доработку"],
  [/\bVerdict:?\s*approved\b/gi, "вердикт: принято"],
  /* Вердикты, которые проверяющие пишут капслоком внутри русской фразы нашего же
     контура: ключевые слова протокола, а не чьи-то слова. */
  [/\bCHANGES REQUESTED\b/g, "«нужны правки»"],
  [/\bREWORK\b/g, "«на доработку»"],
  [/\bAPPROVED\b/g, "«принято»"],
  [/\bpremature_completion\b/g, "преждевременное завершение"],
  [/\bin_progress\b/g, "в работе"],
];

/* One value of a closed set, in Russian; the raw value when the set has grown
   and nobody taught this table about it — a name we do not know is still a name,
   and hiding it would be worse than showing it in English. */
function ru(table, value) {
  if (value === null || value === undefined || value === "") return value;
  return table[value] || String(value);
}

/* Free text on its way to a person. Markdown markers go here too: the board
   prints text nodes, never HTML, so `**жирный**`, `~~зачёркнутый~~` and
   backticks reached the screen as the characters they are. */
function human(text) {
  if (!text) return text;
  let out = String(text);
  for (const [from, to] of PHRASE_RU) out = out.split(from).join(to);
  for (const [pattern, to] of TOKEN_RU) out = out.replace(pattern, to);
  return out.replace(/\*\*|~~|`/g, "").replace(/(^|\n)#{1,6}\s+/g, "$1");
}

/* ---------- английская строка, написанная не для читателя ----------
   Часть текста на доске пишут не для этого экрана: строку хода работы — ребёнок
   -исполнитель, находку — проверяющий, и обе бывают целиком английскими
   («six-row reproduction gate accepts arbitrary non-empty divergence»). Перевести
   их доска не может — это было бы выдумыванием факта, — но и ставить их ответом
   на вопрос «что происходит» нельзя.

   Поэтому такая строка заменяется одной русской фразой, а сама уезжает за общий
   переключатель источников: ничего не потеряно, и видно, кто её написал. Порог —
   три латинских слова подряд длиной от трёх букв: `journalctl`,
   `progress.json`, `task-agent` и `#1163` остаются на месте, потому что это
   имена, а не английская проза.

   Перевеса латиницы над кириллицей порог больше не спрашивает, и это ровно то,
   чего не хватало на первом экране (приёмка продакта 2026-08-14, замечание 2):
   «Какая точная версия сейчас deployed в закрытом рабочем сервисе? … получить
   из офисного контура commit engine, commit API, собранный image и один живой
   trace» — русская вводная с чужой английской прозой внутри, и подсчёт букв
   решал в пользу русского начала. Цена названа целиком в отчёте: удержанных
   строк 75 → 87 на состоянии дня, и решение принимает постановщик. */
const ENGLISH = /[A-Za-z]{3,}[^\wА-Яа-яЁё]+[A-Za-z]{3,}[^\wА-Яа-яЁё]+[A-Za-z]{3,}/;

/* Второй вид того же: имя, написанное машине, — два куска латиницы через
   подчёркивание. Так пишут гейты, поля и файлы контура (`f_003_closure_records`,
   `probe_model_provenance`, `pass36_repaired_git_systemd_and_claude_review_pending`),
   и человеку так не пишут никогда: подчёркивание для порога выше — буква,
   поэтому список гейтов он считает одним словом и не видит в нём английского
   (ревью круга 3, HIGH-1).

   Своё доска до этого порога не доводит: собранную ею причину «не пройдено
   гейтов: 3» имена не глотают — они стоят в её источнике, у `jam_reason`. Порог
   остаётся для чужого: `status_detail` задачи, вердикта проверяющего, подписи
   записи в ленте. */
const MACHINE = /[A-Za-z0-9]+_[A-Za-z0-9_]*[A-Za-z]/;

/* Единица решения — предложение, а не строка целиком, и это здесь главное
   (приёмка продакта 2026-08-14, круг 5). Круг 4 спрашивал перевес латиницы по
   всей строке, и русская вводная прятала английскую прозу в её хвосте; круг 5
   перевес убрал — и тогда одно машинное имя в середине уносило за источник
   целый читаемый русский абзац, а на экране вместо ответа стояло «написано не
   для этого экрана». Обе беды — от единицы: вводная не может голосовать за
   чужое предложение, а чужое предложение не уносит с собой русские.

   Предложение написано читателю, если в нём есть кириллица и нет английской
   прозы, а имя для машины в нём — если фраза вокруг имени всё-таки русская.
   Это уточняет правило круга 4, а не отменяет его: имя не становится читаемым
   от русского начала, но «Нужно ли закрыть verification_gap задачи 495?» — это
   вопрос о предмете, а «Кандидат: pass36_repaired_git_systemd_and_claude_...» —
   имя с русской наклейкой, и перевес латиницы отличает одно от другого внутри
   одного предложения, где спрятать в хвосте уже нечего. */
function toReader(one) {
  if (!/[А-Яа-яЁё]/.test(one) || ENGLISH.test(one)) return false;
  if (!MACHINE.test(one)) return true;
  return (one.match(/[А-Яа-яЁё]/g) || []).length >= (one.match(/[A-Za-z]/g) || []).length;
}

/* Ведущие предложения, написанные читателю, — на экран; всё, начиная с первого
   чужого, — за общий переключатель источников, и о том, что там есть ещё,
   говорит многоточие. Обрыв на первом чужом, а не выборка читаемых по всему
   тексту: показать второе предложение вместо первого значило бы переставить
   чужие слова местами. */
function said(text, instead) {
  const out = human(text);
  if (!out) return { shown: out, full: null };
  const kept = [];
  let whole = true;
  for (const piece of String(out).split(/(?<=[.!?…])\s+|\n+/)) {
    const one = piece.trim();
    if (!one) continue;
    if (!toReader(one)) { whole = false; break; }
    kept.push(one);
  }
  if (whole) return { shown: out, full: null };
  return { shown: kept.length ? kept.join(" ") + " …" : instead, full: out };
}

/* Чем доска отвечает, когда записанного объяснения показать нельзя. Заглушка
   «причина написана не для этого экрана» — это то же «пусто», только вежливое:
   пользователь спрашивает «где затор и почему», а получает сообщение о том, что
   ответ есть где-то ещё (приёмка продакта 2026-08-14, круг 5).

   Поэтому вместо неё стоит то, что уже наблюдено и уже написано по-русски, и
   ничего для этого не собирается заново: вердикт проверяющего и гейты приезжают
   на той же плашке, а словами их называет тот же `VERDICT_RU`, что и карточка.
   Возраста и автора здесь нет намеренно — они стоят на той же строке своими
   надписями, и повторить их значило бы вернуть замечание 3 круга 4. Порядок
   ветвей — от частного к общему, как у `jam_reason` в сборщике, и «не пройдено
   гейтов» называется той же фразой и по тому же счёту: одно наблюдение не
   должно называться на доске двумя способами. Отсылка к словам автора остаётся,
   но только хвостом после настоящей фразы. */
function insteadOfWords(p, where) {
  const detail = p.detail || {};
  const review = detail.review || {};
  const failed = (detail.gates || []).filter(g => g.result !== "OK").length;
  let what = "";
  if (review.verdict && review.verdict !== "approved") {
    what = "вердикт проверяющего: " + ru(VERDICT_RU, review.verdict)
      + (review.findings ? ", находок " + review.findings : "");
  } else if (failed) what = "не пройдено гейтов: " + failed;
  else if (p.stale_label) what = "ярлык говорит «в работе», а процесса нет";
  else if (p.status) what = "записанное состояние: " + ru(STATUS_RU, p.status);
  return (what ? what + "; " : "") + "как записано — " + where;
}

/* Три строки без действия пользователя, целиком — кнопкой рядом. Одна механика
   на все длинные блоки: текст ставится как записан и складывается, а не режется
   многоточием. Кнопка остаётся только там, где текст не уместился, и это видно
   лишь после отрисовки — «три строки» зависят от ширины колонки. */
let folded = [];

function foldable(parent, cls, text, tag) {
  const node = document.createElement(tag || "div");
  node.className = cls + " fold";
  node.textContent = text;
  const more = document.createElement("button");
  more.className = "foldbtn";
  more.textContent = "показать целиком";
  /* Плашка вокруг — тоже орган управления, и нажатие не должно до неё дойти. */
  more.addEventListener("click", event => event.stopPropagation());
  more.addEventListener("keydown", event => event.stopPropagation());
  asFolder(more, true, () => {
    const open = node.classList.toggle("open");
    more.textContent = open ? "свернуть" : "показать целиком";
    return !open;
  });
  parent.appendChild(node); parent.appendChild(more);
  folded.push([node, more]);
  return node;
}

/* Скрытый блок высоты не имеет: складка у него остаётся, раскроют вместе с ней. */
function settleFolds() {
  for (const [node, more] of folded) {
    if (node.clientHeight && node.scrollHeight - node.clientHeight < 2) {
      node.classList.remove("fold");
      more.remove();
    }
  }
  folded = [];
}

function tag(text, cls) {
  const s = document.createElement("span");
  s.className = "tag" + (cls ? " " + cls : "");
  s.textContent = text;                      // never innerHTML: the data is real
  return s;
}

/* ---------- where a claim came from ----------
   Every «наблюдено: …» on the board used to be a browser `title`, and a `title`
   is three different things depending on the device: a tooltip after a pause on
   a desktop, nothing at all on a phone, and nothing at all for a keyboard. 223
   of them were on the live board, 53 longer than 80 characters.

   One button per plate, not one per label: a plate has four or five sources and
   five buttons in a row would be five tab stops saying the same word. The button
   opens a block that names each claim next to the observation behind it, in
   full — it is the same text, shown rather than hovered. */
let srcSeq = 0;

function sourceNote(node, pairs) {
  const items = pairs.filter(pair => pair[1]);
  if (!items.length) return;
  const id = "src" + (++srcSeq);
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "srcbtn";
  /* The word is what makes the marker readable, and the strip is the one place
     that cannot afford it: the same button with its word took the strip from
     315 px to 419 px of a 900-tall window — measured — and the strip's whole
     budget exists to leave the columns on the first screen. So the word is
     hidden there by CSS and the button keeps its name for anything that is not
     looking at the pixels. */
  const word = document.createElement("span");
  word.className = "w";
  word.textContent = "источник";
  btn.appendChild(word);
  btn.setAttribute("aria-label", "Показать, чем это наблюдено");
  btn.setAttribute("aria-expanded", "false");
  btn.setAttribute("aria-controls", id);
  const box = document.createElement("div");
  box.className = "srcbox";
  box.id = id;
  for (const [label, text] of items) {
    const line = document.createElement("div");
    const key = document.createElement("b");
    key.textContent = label + ": ";
    line.appendChild(key);
    line.appendChild(document.createTextNode(text));
    box.appendChild(line);
  }
  /* The plate around it is a control too, so the press must not reach it: the
     source of a task and the details of a task are two different answers. */
  const stop = event => event.stopPropagation();
  btn.addEventListener("click", event => {
    stop(event);
    const open = box.classList.toggle("open");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  btn.addEventListener("keydown", stop);
  node.appendChild(btn);
  node.appendChild(box);
}

/* A plate that opens its card, said in the three ways a control is said: what it
   is, that it can be reached, and what pressing it will do. */
function asButton(node, label, act) {
  node.setAttribute("role", "button");
  node.tabIndex = 0;
  node.setAttribute("aria-label", label);
  node.addEventListener("click", act);
  node.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " " || event.key === "Spacebar") {
      event.preventDefault();
      act();
    }
  });
}

/* A folding heading: a real button that says whether what it folds is open. */
function asFolder(btn, shut, act) {
  btn.type = "button";
  btn.setAttribute("aria-expanded", shut ? "false" : "true");
  btn.addEventListener("click", () => {
    const nowShut = act();
    btn.setAttribute("aria-expanded", nowShut ? "false" : "true");
  });
}

function plateNode(p, areaKey) {
  const node = document.createElement("div");
  node.className = "plate p-" + areaKey;
  /* The drill-down the user asked for: the card opens over the board and the
     board stays where it was, so nothing reloads and nothing is navigated to.
     It is announced as what it is — a control with a name — because the hand
     cursor that used to be the whole announcement says nothing to a phone and
     nothing to a keyboard. */
  asButton(node, "Открыть детали задачи " + (p.id === null ? "" : "#" + p.id + ": ") + p.title,
           () => openCard(p));
  /* Every «наблюдено» of this plate, gathered as it is built and shown by one
     button at the bottom instead of by five invisible tooltips. */
  const sources = [];

  const head = document.createElement("div");
  head.className = "head";
  const num = document.createElement("span");
  num.className = "num"; num.textContent = p.id === null ? "—" : "#" + p.id;
  const name = document.createElement("span");
  /* Название длиннее трёх строк в узкой колонке — тот же блок текста, что и
     любой другой: складывается тем же `.fold`, а целиком открывается карточкой,
     которую эта плашка и открывает. */
  name.className = "name fold"; name.textContent = human(p.title);
  head.appendChild(num); head.appendChild(name);
  node.appendChild(head);

  const row = document.createElement("div");
  row.className = "row";
  row.appendChild(tag(ru(STATUS_RU, p.status) || "без статуса"));
  /* Who and in what role — only when a file actually said so. An empty cell is
     the honest answer and beats a confident untruth in a caption. */
  const who = p.actor ? tag(p.actor, "who") : tag("исполнитель неизвестен");
  if (p.actor_src) sources.push(["Исполнитель", p.actor_src]);
  row.appendChild(who);
  if (p.role) {
    const role = tag(ROLE_RU[p.role] || p.role);
    if (p.role_src) sources.push(["Станция", p.role_src]);
    row.appendChild(role);
  }
  /* A live process and a label claiming one are two facts, kept apart on the
     plate: a dead run under a `running` label has to look like the jam it is. */
  /* Что о задаче говорит план. Владелец очереди — он, и плашка называет его
     прямо: порядок на доске нельзя принять за вывод наблюдения, а расхождение
     («план ставит третьей», а рядом «прогон жив») читается как расхождение. */
  const place = p.plan_place;
  if (place) {
    const said = place.role === "queue" ? place.position + "-я в очереди плана"
      : place.role === "paused" ? "план держит её своим словом"
      : place.role === "named" ? "план называет её, но в очередь не ставит"
      : place.role === "mentioned" ? "план называет её в строке, но не её предметом"
      : "план о ней не говорит";
    row.appendChild(tag(said, "plan"));
    sources.push(["Место в плане", place.src]);
    if (place.line) sources.push(["Строка плана", place.line]);
    /* План, сказавший об одной работе двояко, показывает обе строки. Место
       выбрано более конкретным утверждением — очередью, — а не тем, что доска
       молча предпочла: молчаливый выбор однажды показал 1054 и 1067 как бэклог
       через сутки после того, как пользователь снял их с полки. */
    const twice = place.conflict || [];
    if (twice.length) {
      row.appendChild(tag("план и ставит её в очередь, и держит её другой своей "
                          + "строкой; место оставлено за очередью", "plan"));
      twice.forEach((other, index) => sources.push(
        ["Вторая строка плана" + (twice.length > 1 ? " " + (index + 1) : ""), other.line]));
    }
  }
  if (p.alive) row.appendChild(tag("прогон жив", "alive"));
  /* Расхождение статуса и наблюдения — своей надписью, а не двумя фактами
     рядом, из которых вывод складывает читатель. */
  if (p.alive && TERMINAL_RU[p.status]) {
    row.appendChild(tag("статус говорит «" + ru(STATUS_RU, p.status)
                        + "», а прогон идёт: запись устарела", "lie"));
  }
  if (p.stale_label) row.appendChild(tag("ярлык врёт: процесса нет", "lie"));
  if (p.attempt > 1) row.appendChild(tag("попытка " + p.attempt, "retry"));
  /* «Без изменений», not «в этом состоянии»: what is measured is the mtime of
     the freshest file the area is built from, which is an upper bound on the
     transition and not the transition itself. The tooltip names the file. */
  const age = ago(ageOf(p));
  if (age) {
    const a = tag(ageCaption(age), "age");
    a.dataset.since = p.since || "";
    if (p.since_src) sources.push(["Без изменений", p.since_src]);
    row.appendChild(a);
  }
  node.appendChild(row);

  /* Строку хода работы ребёнок-исполнитель пишет себе, и пишет как придётся —
     «Adjudicated all 33 machine-flagged cases…». На вопрос «что происходит» она
     не отвечает, поэтому стоит вместе с остальным аппаратом за переключателем
     источников (`.doing`), а не вместо ответа. */
  if (p.happening) foldable(node, "doing", human(p.happening));
  /* Why it stands here. `happening` comes from a live child's progress line and
     is therefore empty for exactly the tasks that are stuck, which is the one
     case a reader needs it — so the observed reason is its own line, shown
     whenever the disk carries one and absent when it does not. */
  if (p.why) {
    /* A queue and a jam are two different sentences. «За чем стоит» is what the
       user asked the queue column for by name, and calling it «почему» would
       read as something being wrong when nothing is. */
    const holds = p.blocked_by && p.why === p.blocked_by;
    /* Причина часто цитирует вердикт проверяющего целиком или перечисляет
       непройденные гейты по именам: русская фраза на экране, написанное не
       читателю — за источником. Там, где показать нельзя ничего из записанного,
       на месте причины стоит наблюдённое, а не сообщение о том, что причина
       где-то есть. */
    const reason = said(p.why, insteadOfWords(p, "в источнике"));
    foldable(node, "why", (holds ? "стоит за: " : "почему: ") + reason.shown);
    if (p.why_src) sources.push([holds ? "Стоит за" : "Почему", p.why_src]);
    if (reason.full) sources.push([holds ? "Стоит за, как записано"
                                         : "Почему, как записано", reason.full]);
  }
  /* Что о задаче сказал план, целиком и своей строкой — рядом с наблюдаемым «за
     чем стоит», а не вместо него. Место в очереди — это решение владельца
     порядка, а держатель — наблюдение, и складывать их в одну надпись значило бы
     назвать держателем работу другого направления, которую тот же план разрешил
     вести параллельно.

     У паузы строка плана показывается целиком: пользователь просил у бэклога
     именно это — «чьим словом оно стоит и когда сказано», — и ответ написан в
     ней самой («по слову пользователя 2026-08-13»). Прятать её за кнопку
     источника значило бы обещать ответ и оставить его для тех, кто нажмёт. */
  if (place && (place.role === "queue" || place.role === "paused")) {
    foldable(node, "why", place.role === "paused"
      ? "план держит: " + human(place.line)
      : "план ставит её " + place.position + "-й в очереди" + (place.ahead.length
          ? "; выше в очереди: " + place.ahead.join(", ")
          : "; выше незакрытых задач нет"));
  }
  /* Every open question of the task, whole, and each one saying whose it is and
     what said so. Two used to be shown and the rest counted, and the count was
     the least of it: all of them stood under «ждёт решения человека» whoever
     they belonged to. A question of ours now says it is ours, and a question of
     the user's carries the date, the channel and the message it went out with —
     which is what makes the area checkable instead of believable. */
  for (const question of p.questions) node.appendChild(askedNode(question));

  /* A finished task whose document nobody was shown. The line names the file and
     what was read to decide it, because «не доставлено» is a claim about the
     world and the board may not make one silently. */
  const hand = (p.detail || {}).handoff;
  if (hand && !hand.delivered) {
    const row2 = document.createElement("div");
    row2.className = "row";
    const doc = tag("документ человеку: " + hand.name +
      (hand.bytes ? " · " + bytes(hand.bytes) : "") +
      (hand.count > 1 ? " (и ещё " + (hand.count - 1) + ")" : ""), "doc");
    sources.push(["Документ человеку", hand.src + "; " + hand.delivered_src]);
    row2.appendChild(doc);
    node.appendChild(row2);
  }
  sourceNote(node, sources);
  return node;
}

/* One open question as it stands on a plate: the question, then the observation
   that decided whose it is. Shared by the task plates and by the plates a
   product's own question makes, so «чей это вопрос» reads the same in both. */
function askedNode(q) {
  const box = document.createElement("div");
  foldable(box, "ask", (q.owner === "user" ? "? " : "· ") + human(q.text));
  const bits = [];
  if (q.asked_src) bits.push(q.asked_src);
  if (q.answer_src) bits.push("ответ: " + q.answer_src);
  if (q.note) bits.push(q.note);
  if (bits.length) {
    /* Чем наблюдено, что вопрос задан и не отвечен, — аппарат проверяющего: за
       общим переключателем источников вместе со всем остальным. */
    const src = document.createElement("div");
    src.className = "asked prov"; src.textContent = bits.join(" · ");
    box.appendChild(src);
  }
  return box;
}

/* ---------- the card ----------
   Everything it shows arrived with the plate. The page cannot reach a disk, so
   a drill-down that fetched its own detail would be a second door past the
   boundary the whole split exists to hold. */

/* Which plate is open, by task directory rather than by object identity: a live
   refresh replaces every plate object, and the card has to survive that with
   the same task in it. */
let openTask = null;

function row(dl, key, value, src) {
  if (value === null || value === undefined || value === "") return;
  const dt = document.createElement("dt"); dt.textContent = key;
  const dd = document.createElement("dd");
  dd.appendChild(document.createTextNode(value));
  /* The card has room, so the observation is printed under the value instead of
     being hidden in a `title` nobody on a phone can open. */
  if (src) {
    const note = document.createElement("div");
    note.className = "src"; note.textContent = "наблюдено: " + src;
    dd.appendChild(note);
  }
  dl.appendChild(dt); dl.appendChild(dd);
}

/* A section that has nothing to say is not drawn. It used to print «нечего
   показать: на диске об этом ничего нет», and on the live board four of the
   nine sections said exactly that — with the first of them standing fourth,
   above everything a reader had opened the card for. */
function section(title, build) {
  const s = document.createElement("section");
  const h = document.createElement("h4"); h.textContent = title;
  s.appendChild(h);
  return build(s) ? s : null;
}

function add(body, node) { if (node) body.appendChild(node); }

function bytes(n) {
  if (n === null || n === undefined) return "";
  if (n < 1024) return n + " Б";
  if (n < 1024 * 1024) return Math.round(n / 1024) + " КБ";
  return (n / 1048576).toFixed(1) + " МБ";
}

function stamp(iso) {
  if (!iso) return null;
  const t = Date.parse(iso);
  return isNaN(t) ? iso : new Date(t).toLocaleString("ru-RU");
}

/* ---------- the order a person reads a card in ----------
   Top to bottom: what the task is in the user's own words, what is happening,
   why it stands where it stands, what happens next, what came out of it — and
   the machinery of the run last, folded. The previous order was the order the
   fields were collected in: «Прогон» — the runner, the workflow and the sandbox —
   stood second, above the review, the gates and the delivery, and the user's own
   description of the task was not on the card at all. */
function cardBody(p) {
  const d = p.detail || {};
  const body = document.createElement("div");

  /* What the person asked for, in their words. It comes from `## Summary` of
     `task.md` — the one place on disk that says what the task is about rather
     than what state it is in. */
  add(body, section("Своими словами", s => {
    if (!d.summary) return false;
    const text = document.createElement("div");
    text.className = "summary"; text.textContent = d.summary;
    s.appendChild(text);
    const src = document.createElement("div");
    src.className = "src"; src.textContent = "наблюдено: раздел «Summary» в task.md";
    s.appendChild(src);
    return true;
  }));

  add(body, section("Что происходит", s => {
    const dl = document.createElement("dl"); dl.className = "kv";
    row(dl, "Статус", ru(STATUS_RU, p.status));
    row(dl, "Исполнитель", p.actor, p.actor_src);
    row(dl, "Станция", p.role ? (ROLE_RU[p.role] || p.role) : null, p.role_src);
    /* The child's own line about what it is doing, and when it wrote it. The
       time is the mtime of the file, never the timestamp the child put inside
       it: children routinely write local time into a UTC field and the contour
       has already paid for believing one. */
    const pr = d.progress || {};
    row(dl, "Сейчас делает", human(pr.activity || p.happening),
        pr.activity ? "строка activity в progress.json" : null);
    if (pr.total) row(dl, "Сделано", pr.done + " из " + pr.total, "progress.json");
    row(dl, "Записано", pr.minutes_ago === null || pr.minutes_ago === undefined
        ? null : pr.minutes_ago + " мин назад", "mtime файла progress.json");
    row(dl, "Шаг", human(d.current_step), "поле current_step в status.json");
    /* A live process and a label claiming one are two facts and stay two lines:
       the contour has been burned by reading one as the other. */
    row(dl, "Процесс", p.alive ? "жив"
        : (p.stale_label ? "мёртв, хотя ярлык говорит «идёт»" : "не запущен"),
        p.alive ? "pid и стартовый тик ядра совпали с .runner/runner.json" : null);
    row(dl, "Попытка", p.attempt > 1 ? p.attempt : null);
    const age = ago(ageOf(p));
    row(dl, "Без изменений", age, p.since_src);
    s.appendChild(dl);
    return dl.children.length > 0;
  }));

  add(body, section("Почему так", s => {
    const dl = document.createElement("dl"); dl.className = "kv";
    row(dl, p.blocked_by && p.why === p.blocked_by ? "Стоит за" : "Почему",
        human(p.why), p.why_src);
    if (d.refusal) {
      row(dl, "Отказ в завершении", ru(REFUSAL_RU, d.refusal), "completion_refusal в status.json");
      row(dl, "Что именно отказано", human(d.refusal_summary), "completion_refusal в status.json");
    }
    row(dl, "Остановлен надзором", human(d.stop_reason), "watcher_stop_reason в .runner/runner.json");
    s.appendChild(dl);
    /* The whole point of the observation: a directory that kept moving after
       its owner refused its closing step is work that may already be finished
       and that nobody has been back to. It is said in words, not in a flag. */
    if ((p.flags || []).includes("work_outside_owner")) {
      const warn = document.createElement("div");
      warn.className = "src warn";
      warn.textContent = "Владелец кончился раньше своего закрывающего шага, а файлы каталога "
        + "двигались после этого: работа могла доработать снаружи — стоит посмотреть артефакты.";
      s.appendChild(warn);
      return true;
    }
    return dl.children.length > 0;
  }));

  add(body, section("Что дальше", s => {
    let filled = false;
    const r = d.review;
    /* A verdict that asks for more work is «что дальше»; a verdict that accepted
       the work is «результат», and it stands in the next section. */
    if (r && r.verdict && r.verdict !== "approved") {
      const dl = document.createElement("dl"); dl.className = "kv";
      row(dl, "Ревью", ru(VERDICT_RU, r.verdict), r.src);
      const by = Object.entries(r.by_severity || {}).map(([k, v]) => k + " " + v).join(", ");
      row(dl, "Находок", r.findings + (by ? " (" + by + ")" : ""), r.src);
      s.appendChild(dl);
      filled = true;
    }
    for (const q of p.questions) {
      const line = document.createElement("div");
      line.className = "gate";
      const mark = document.createElement("span"); mark.className = "r";
      mark.textContent = q.owner === "user" ? "?" : "·";
      const n = document.createElement("span");
      n.textContent = q.text + (q.owner === "user" ? " — ждёт пользователя" : " — наш вопрос");
      line.appendChild(mark); line.appendChild(n);
      s.appendChild(line);
      const bits = [];
      if (q.asked_src) bits.push(q.asked_src);
      if (q.answer_src) bits.push("ответ: " + q.answer_src);
      if (q.note) bits.push(q.note);
      if (bits.length) {
        const src = document.createElement("div");
        src.className = "src"; src.textContent = "наблюдено: " + bits.join(" · ");
        s.appendChild(src);
      }
      filled = true;
    }
    return filled;
  }));

  add(body, section("Результат и доставка", s => {
    let filled = false;
    const dl = document.createElement("dl"); dl.className = "kv";
    const r = d.review;
    if (r && r.verdict === "approved") {
      row(dl, "Ревью", ru(VERDICT_RU, r.verdict), r.src);
      const by = Object.entries(r.by_severity || {}).map(([k, v]) => k + " " + v).join(", ");
      row(dl, "Находок", r.findings + (by ? " (" + by + ")" : ""), r.src);
    }
    /* The document first, the receipts after it. The receipts were all anyone
       looked at, and they answer a different question: 783 had two of them and
       its report had still not left the server. */
    const hand = d.handoff;
    if (hand) {
      row(dl, "Документ", hand.name + (hand.bytes ? " · " + bytes(hand.bytes) : ""), hand.src);
      if (hand.count > 1) row(dl, "Всего документов", hand.count, hand.src);
      row(dl, "Доставлено", hand.delivered ? "да" : "нет", hand.delivered_src);
    }
    if (d.delivery) {
      /* Сообщения и отказы — два разных числа, и стоят они рядом: пока «Сообщений»
         считалось по всем квитанциям, отказ прибавлялся к отправленному, и
         карточка этой самой задачи показывала шесть сообщений при пяти ушедших. */
      row(dl, "Сообщений", d.delivery.sent, d.delivery.src);
      row(dl, "Отказов", d.delivery.refused, d.delivery.src);
      row(dl, "Последнее", stamp(d.delivery.last_at), d.delivery.src);
      row(dl, "По событию", d.delivery.last_kind, d.delivery.src);
      // Что прогон пытался сказать человеку и не смог, и почему. Стоит рядом со
      // счётчиком отправленного, потому что без этой строки счётчик читается
      // как «сообщения идут»: девять суток отказов прошли именно так.
      const silent = d.delivery.unresolved;
      if (silent) {
        row(dl, "Не доставлено",
            (silent.notification || "уведомление") + " · " + stamp(silent.at)
              + (silent.current ? "" : " · давнее"),
            silent.src);
