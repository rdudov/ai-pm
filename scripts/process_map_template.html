}

/* ---------- the board ----------
   Four direction panels, areas by urgency inside each, one plate per task. The
   first screen answers the three acceptance questions — who is working, where
   the jam is and why, what waits for a person — so nothing here is decorative.
   Every caption comes from a field of the snapshot; where the snapshot says
   nothing, the plate shows a dash rather than a plausible guess. */
const BOARD = DATA.board;

/* One wording for one measurement. The caption was written out twice — once when
   a plate is built and once by the ticker that refreshes it every half minute —
   so changing it in one place left the other saying something else thirty
   seconds later. What it says is deliberately «без изменений»: the number is the
   age of the freshest file the area is built from, which bounds the transition
   without claiming to be it (finding MEDIUM-1 of review 786). */
function ageCaption(age) { return "без изменений " + age; }

/* An age counted from the instant the state was last observed to change, so it
   stays true while the page sits open rather than freezing at collection time. */
function ageOf(p) {
  if (!p.since) return p.age_seconds;
  const t = Date.parse(p.since);
  return isNaN(t) ? p.age_seconds : Math.max(Math.round((Date.now() - t) / 1000), 0);
}

function ago(seconds) {
  if (seconds === null || seconds === undefined) return null;
  const m = Math.floor(seconds / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d >= 1) return d + (d === 1 ? " день" : (d < 5 ? " дня" : " дней"));
  if (h >= 1) return h + (h === 1 ? " час" : (h < 5 ? " часа" : " часов"));
  if (m >= 1) return m + " мин";
  return "только что";
}

const ROLE_RU = { analysis: "анализ", development: "разработка", tests: "тесты",
                  review: "ревью", commit: "коммит", report: "отчёт" };

/* ---------- Russian for what a person actually reads ----------
   The board is read by one person, in Russian, and it was showing them
   `in_progress`, `danger-full-access`, `decision=deliver` and whole English
   sentences written by a runner. Those are field values of our own contour, so
   they are translated where they are shown rather than left for the reader to
   decode.

   Two kinds, kept apart on purpose. An enumeration has a closed set of values
   and every one of them is named here. Free text does not: a child writes its
   own progress line, and translating it by guesswork would be inventing a fact.
   So free text is passed through a table of the machine tokens and the fixed
   runner phrases this contour writes itself, and anything else reaches the
   screen as it was written — which is honest, and points at the writer of the
   line rather than hiding it. */
const STATUS_RU = { planned: "запланирована", in_progress: "в работе",
                    blocked: "заблокирована", completed: "завершена",
                    cancelled: "отменена", done: "завершена" };
const RUN_STATE_RU = { running: "идёт", completed: "завершён", blocked: "остановлен на блокировке",
                       failed: "провалился", stopped: "остановлен", killed: "убит надзором" };
const WORKFLOW_RU = { standard: "обычный прогон одним ребёнком",
                      "dev-pipeline": "конвейер разработки с ревью" };
const SANDBOX_RU = { "danger-full-access": "полный доступ к диску",
                     "workspace-write": "запись в рабочем каталоге",
                     "read-only": "только чтение" };
const VERDICT_RU = { approved: "принято", rework: "на доработку", changes: "нужны правки" };
const REFUSAL_RU = { premature_completion: "преждевременное завершение" };

/* Fixed phrases this contour writes into `current_step`, longest first so a
   prefix never eats a longer match. */
const PHRASE_RU = [
  ["Standard child completed and durable gates passed",
   "обычный ребёнок завершился, долговечные гейты пройдены"],
  ["Dev-pipeline owner attempt completed", "попытка владельца конвейера завершена"],
  ["Rejected premature completion:", "отказано в преждевременном завершении:"],
  ["Starting child agent via", "запускается ребёнок через"],
  ["Review complete with rework", "ревью закончено с вердиктом «на доработку»"],
  ["Cross-review complete", "кросс-ревью закончено"],
  ["Review complete", "ревью закончено"],
];

/* Machine tokens the contour writes into otherwise human text. */
const TOKEN_RU = [
  [/\bdecision=deliver\b/g, "решение продакта: доставить"],
  [/\bdecision=([a-z_]+)/g, "решение продакта: $1"],
  [/\bstarts_after=(\d+)/g, "начинать после задачи $1"],
  [/\bworktree=(\S+)/g, "занимает рабочее дерево $1"],
  /* The review protocol writes exactly one line, `Verdict: approved|rework`, and
     children quote it inside otherwise free prose. It is a keyword of ours, not
     someone's wording, so it is translated wherever it stands. */
  [/\bVerdict:?\s*rework\b/gi, "вердикт: на доработку"],
  [/\bVerdict:?\s*approved\b/gi, "вердикт: принято"],
  [/\bpremature_completion\b/g, "преждевременное завершение"],
  [/\bin_progress\b/g, "в работе"],
];

/* One value of a closed set, in Russian; the raw value when the set has grown
   and nobody taught this table about it — a name we do not know is still a name,
   and hiding it would be worse than showing it in English. */
function ru(table, value) {
  if (value === null || value === undefined || value === "") return value;
  return table[value] || String(value);
}

/* Free text on its way to a person. */
function human(text) {
  if (!text) return text;
  let out = String(text);
  for (const [from, to] of PHRASE_RU) out = out.split(from).join(to);
  for (const [pattern, to] of TOKEN_RU) out = out.replace(pattern, to);
  return out;
}

function tag(text, cls) {
  const s = document.createElement("span");
  s.className = "tag" + (cls ? " " + cls : "");
  s.textContent = text;                      // never innerHTML: the data is real
  return s;
}

/* ---------- where a claim came from ----------
   Every «наблюдено: …» on the board used to be a browser `title`, and a `title`
   is three different things depending on the device: a tooltip after a pause on
   a desktop, nothing at all on a phone, and nothing at all for a keyboard. 223
   of them were on the live board, 53 longer than 80 characters.

   One button per plate, not one per label: a plate has four or five sources and
   five buttons in a row would be five tab stops saying the same word. The button
   opens a block that names each claim next to the observation behind it, in
   full — it is the same text, shown rather than hovered. */
let srcSeq = 0;

function sourceNote(node, pairs) {
  const items = pairs.filter(pair => pair[1]);
  if (!items.length) return;
  const id = "src" + (++srcSeq);
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "srcbtn";
  /* The word is what makes the marker readable, and the strip is the one place
     that cannot afford it: the same button with its word took the strip from
     315 px to 419 px of a 900-tall window — measured — and the strip's whole
     budget exists to leave the columns on the first screen. So the word is
     hidden there by CSS and the button keeps its name for anything that is not
     looking at the pixels. */
  const word = document.createElement("span");
  word.className = "w";
  word.textContent = "источник";
  btn.appendChild(word);
  btn.setAttribute("aria-label", "Показать, чем это наблюдено");
  btn.setAttribute("aria-expanded", "false");
  btn.setAttribute("aria-controls", id);
  const box = document.createElement("div");
  box.className = "srcbox";
  box.id = id;
  for (const [label, text] of items) {
    const line = document.createElement("div");
    const key = document.createElement("b");
    key.textContent = label + ": ";
    line.appendChild(key);
    line.appendChild(document.createTextNode(text));
    box.appendChild(line);
  }
  /* The plate around it is a control too, so the press must not reach it: the
     source of a task and the details of a task are two different answers. */
  const stop = event => event.stopPropagation();
  btn.addEventListener("click", event => {
    stop(event);
    const open = box.classList.toggle("open");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  btn.addEventListener("keydown", stop);
  node.appendChild(btn);
  node.appendChild(box);
}

/* A plate that opens its card, said in the three ways a control is said: what it
   is, that it can be reached, and what pressing it will do. */
function asButton(node, label, act) {
  node.setAttribute("role", "button");
  node.tabIndex = 0;
  node.setAttribute("aria-label", label);
  node.addEventListener("click", act);
  node.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " " || event.key === "Spacebar") {
      event.preventDefault();
      act();
    }
  });
}

/* A folding heading: a real button that says whether what it folds is open. */
function asFolder(btn, shut, act) {
  btn.type = "button";
  btn.setAttribute("aria-expanded", shut ? "false" : "true");
  btn.addEventListener("click", () => {
    const nowShut = act();
    btn.setAttribute("aria-expanded", nowShut ? "false" : "true");
  });
}

function plateNode(p, areaKey) {
  const node = document.createElement("div");
  node.className = "plate p-" + areaKey;
  /* The drill-down the user asked for: the card opens over the board and the
     board stays where it was, so nothing reloads and nothing is navigated to.
     It is announced as what it is — a control with a name — because the hand
     cursor that used to be the whole announcement says nothing to a phone and
     nothing to a keyboard. */
  asButton(node, "Открыть детали задачи " + (p.id === null ? "" : "#" + p.id + ": ") + p.title,
           () => openCard(p));
  /* Every «наблюдено» of this plate, gathered as it is built and shown by one
     button at the bottom instead of by five invisible tooltips. */
  const sources = [];

  const head = document.createElement("div");
  head.className = "head";
  const num = document.createElement("span");
  num.className = "num"; num.textContent = p.id === null ? "—" : "#" + p.id;
  const name = document.createElement("span");
  name.className = "name"; name.textContent = p.title;
  head.appendChild(num); head.appendChild(name);
  node.appendChild(head);

  const row = document.createElement("div");
  row.className = "row";
  row.appendChild(tag(ru(STATUS_RU, p.status) || "без статуса"));
  /* Who and in what role — only when a file actually said so. An empty cell is
     the honest answer and beats a confident untruth in a caption. */
  const who = p.actor ? tag(p.actor, "who") : tag("исполнитель неизвестен");
  if (p.actor_src) sources.push(["Исполнитель", p.actor_src]);
  row.appendChild(who);
  if (p.role) {
    const role = tag(ROLE_RU[p.role] || p.role);
    if (p.role_src) sources.push(["Станция", p.role_src]);
    row.appendChild(role);
  }
  /* A live process and a label claiming one are two facts, kept apart on the
     plate: a dead run under a `running` label has to look like the jam it is. */
  if (p.alive) row.appendChild(tag("прогон жив", "alive"));
  if (p.stale_label) row.appendChild(tag("ярлык врёт: процесса нет", "lie"));
  if (p.attempt > 1) row.appendChild(tag("попытка " + p.attempt, "retry"));
  /* «Без изменений», not «в этом состоянии»: what is measured is the mtime of
     the freshest file the area is built from, which is an upper bound on the
     transition and not the transition itself. The tooltip names the file. */
  const age = ago(ageOf(p));
  if (age) {
    const a = tag(ageCaption(age), "age");
    a.dataset.since = p.since || "";
    if (p.since_src) sources.push(["Без изменений", p.since_src]);
    row.appendChild(a);
  }
  node.appendChild(row);

  if (p.happening) {
    const doing = document.createElement("div");
    doing.className = "doing"; doing.textContent = human(p.happening);
    node.appendChild(doing);
  }
  /* Why it stands here. `happening` comes from a live child's progress line and
     is therefore empty for exactly the tasks that are stuck, which is the one
     case a reader needs it — so the observed reason is its own line, shown
     whenever the disk carries one and absent when it does not. */
  if (p.why) {
    const why = document.createElement("div");
    why.className = "why";
    /* A queue and a jam are two different sentences. «За чем стоит» is what the
       user asked the queue column for by name, and calling it «почему» would
       read as something being wrong when nothing is. */
    why.textContent = (p.blocked_by && p.why === p.blocked_by ? "стоит за: " : "почему: ")
      + human(p.why);
    if (p.why_src) sources.push([p.blocked_by && p.why === p.blocked_by ? "Стоит за" : "Почему",
                                 p.why_src]);
    node.appendChild(why);
  }
  /* Every open question of the task, whole, and each one saying whose it is and
     what said so. Two used to be shown and the rest counted, and the count was
     the least of it: all of them stood under «ждёт решения человека» whoever
     they belonged to. A question of ours now says it is ours, and a question of
     the user's carries the date, the channel and the message it went out with —
     which is what makes the area checkable instead of believable. */
  for (const question of p.questions) node.appendChild(askedNode(question));

  /* A finished task whose document nobody was shown. The line names the file and
     what was read to decide it, because «не доставлено» is a claim about the
     world and the board may not make one silently. */
  const hand = (p.detail || {}).handoff;
  if (hand && !hand.delivered) {
    const row2 = document.createElement("div");
    row2.className = "row";
    const doc = tag("документ человеку: " + hand.name +
      (hand.bytes ? " · " + bytes(hand.bytes) : "") +
      (hand.count > 1 ? " (и ещё " + (hand.count - 1) + ")" : ""), "doc");
    sources.push(["Документ человеку", hand.src + "; " + hand.delivered_src]);
    row2.appendChild(doc);
    node.appendChild(row2);
  }
  sourceNote(node, sources);
  return node;
}

/* One open question as it stands on a plate: the question, then the observation
   that decided whose it is. Shared by the task plates and by the plates a
   product's own question makes, so «чей это вопрос» reads the same in both. */
function askedNode(q) {
  const ask = document.createElement("div");
  ask.className = "ask";
  ask.textContent = (q.owner === "user" ? "? " : "· ") + q.text;
  const wrap = document.createDocumentFragment();
  wrap.appendChild(ask);
  const bits = [];
  if (q.asked_src) bits.push(q.asked_src);
  if (q.answer_src) bits.push("ответ: " + q.answer_src);
  if (q.note) bits.push(q.note);
  if (bits.length) {
    const src = document.createElement("div");
    src.className = "asked"; src.textContent = bits.join(" · ");
    wrap.appendChild(src);
  }
  const box = document.createElement("div");
  box.appendChild(wrap);
  return box;
}

/* ---------- the card ----------
   Everything it shows arrived with the plate. The page cannot reach a disk, so
   a drill-down that fetched its own detail would be a second door past the
   boundary the whole split exists to hold. */

/* Which plate is open, by task directory rather than by object identity: a live
   refresh replaces every plate object, and the card has to survive that with
   the same task in it. */
let openTask = null;

function row(dl, key, value, src) {
  if (value === null || value === undefined || value === "") return;
  const dt = document.createElement("dt"); dt.textContent = key;
  const dd = document.createElement("dd");
  dd.appendChild(document.createTextNode(value));
  /* The card has room, so the observation is printed under the value instead of
     being hidden in a `title` nobody on a phone can open. */
  if (src) {
    const note = document.createElement("div");
    note.className = "src"; note.textContent = "наблюдено: " + src;
    dd.appendChild(note);
  }
  dl.appendChild(dt); dl.appendChild(dd);
}

/* A section that has nothing to say is not drawn. It used to print «нечего
   показать: на диске об этом ничего нет», and on the live board four of the
   nine sections said exactly that — with the first of them standing fourth,
   above everything a reader had opened the card for. */
function section(title, build) {
  const s = document.createElement("section");
  const h = document.createElement("h4"); h.textContent = title;
  s.appendChild(h);
  return build(s) ? s : null;
}

function add(body, node) { if (node) body.appendChild(node); }

function bytes(n) {
  if (n === null || n === undefined) return "";
  if (n < 1024) return n + " Б";
  if (n < 1024 * 1024) return Math.round(n / 1024) + " КБ";
  return (n / 1048576).toFixed(1) + " МБ";
}

function stamp(iso) {
  if (!iso) return null;
  const t = Date.parse(iso);
  return isNaN(t) ? iso : new Date(t).toLocaleString("ru-RU");
}

/* ---------- the order a person reads a card in ----------
   Top to bottom: what the task is in the user's own words, what is happening,
   why it stands where it stands, what happens next, what came out of it — and
   the machinery of the run last, folded. The previous order was the order the
   fields were collected in: «Прогон» — the runner, the workflow and the sandbox —
   stood second, above the review, the gates and the delivery, and the user's own
   description of the task was not on the card at all. */
function cardBody(p) {
  const d = p.detail || {};
  const body = document.createElement("div");

  /* What the person asked for, in their words. It comes from `## Summary` of
     `task.md` — the one place on disk that says what the task is about rather
     than what state it is in. */
  add(body, section("Своими словами", s => {
    if (!d.summary) return false;
    const text = document.createElement("div");
    text.className = "summary"; text.textContent = d.summary;
    s.appendChild(text);
    const src = document.createElement("div");
    src.className = "src"; src.textContent = "наблюдено: раздел «Summary» в task.md";
    s.appendChild(src);
    return true;
  }));

  add(body, section("Что происходит", s => {
    const dl = document.createElement("dl"); dl.className = "kv";
    row(dl, "Статус", ru(STATUS_RU, p.status));
    row(dl, "Исполнитель", p.actor, p.actor_src);
    row(dl, "Станция", p.role ? (ROLE_RU[p.role] || p.role) : null, p.role_src);
    /* The child's own line about what it is doing, and when it wrote it. The
       time is the mtime of the file, never the timestamp the child put inside
       it: children routinely write local time into a UTC field and the contour
       has already paid for believing one. */
    const pr = d.progress || {};
    row(dl, "Сейчас делает", human(pr.activity || p.happening),
        pr.activity ? "строка activity в progress.json" : null);
    if (pr.total) row(dl, "Сделано", pr.done + " из " + pr.total, "progress.json");
    row(dl, "Записано", pr.minutes_ago === null || pr.minutes_ago === undefined
        ? null : pr.minutes_ago + " мин назад", "mtime файла progress.json");
    row(dl, "Шаг", human(d.current_step), "поле current_step в status.json");
    /* A live process and a label claiming one are two facts and stay two lines:
       the contour has been burned by reading one as the other. */
    row(dl, "Процесс", p.alive ? "жив"
        : (p.stale_label ? "мёртв, хотя ярлык говорит «идёт»" : "не запущен"),
        p.alive ? "pid и стартовый тик ядра совпали с .runner/runner.json" : null);
    row(dl, "Попытка", p.attempt > 1 ? p.attempt : null);
    const age = ago(ageOf(p));
    row(dl, "Без изменений", age, p.since_src);
    s.appendChild(dl);
    return dl.children.length > 0;
  }));

  add(body, section("Почему так", s => {
    const dl = document.createElement("dl"); dl.className = "kv";
    row(dl, p.blocked_by && p.why === p.blocked_by ? "Стоит за" : "Почему",
        human(p.why), p.why_src);
    if (d.refusal) {
      row(dl, "Отказ в завершении", ru(REFUSAL_RU, d.refusal), "completion_refusal в status.json");
      row(dl, "Что именно отказано", human(d.refusal_summary), "completion_refusal в status.json");
    }
    row(dl, "Остановлен надзором", human(d.stop_reason), "watcher_stop_reason в .runner/runner.json");
    s.appendChild(dl);
    /* The whole point of the observation: a directory that kept moving after
       its owner refused its closing step is work that may already be finished
       and that nobody has been back to. It is said in words, not in a flag. */
    if ((p.flags || []).includes("work_outside_owner")) {
      const warn = document.createElement("div");
      warn.className = "src warn";
      warn.textContent = "Владелец кончился раньше своего закрывающего шага, а файлы каталога "
        + "двигались после этого: работа могла доработать снаружи — стоит посмотреть артефакты.";
      s.appendChild(warn);
      return true;
    }
    return dl.children.length > 0;
  }));

  add(body, section("Что дальше", s => {
    let filled = false;
    const r = d.review;
    /* A verdict that asks for more work is «что дальше»; a verdict that accepted
       the work is «результат», and it stands in the next section. */
    if (r && r.verdict && r.verdict !== "approved") {
      const dl = document.createElement("dl"); dl.className = "kv";
      row(dl, "Ревью", ru(VERDICT_RU, r.verdict), r.src);
      const by = Object.entries(r.by_severity || {}).map(([k, v]) => k + " " + v).join(", ");
      row(dl, "Находок", r.findings + (by ? " (" + by + ")" : ""), r.src);
      s.appendChild(dl);
      filled = true;
    }
    for (const q of p.questions) {
      const line = document.createElement("div");
      line.className = "gate";
      const mark = document.createElement("span"); mark.className = "r";
      mark.textContent = q.owner === "user" ? "?" : "·";
      const n = document.createElement("span");
      n.textContent = q.text + (q.owner === "user" ? " — ждёт пользователя" : " — наш вопрос");
      line.appendChild(mark); line.appendChild(n);
      s.appendChild(line);
      const bits = [];
      if (q.asked_src) bits.push(q.asked_src);
      if (q.answer_src) bits.push("ответ: " + q.answer_src);
      if (q.note) bits.push(q.note);
      if (bits.length) {
        const src = document.createElement("div");
        src.className = "src"; src.textContent = "наблюдено: " + bits.join(" · ");
        s.appendChild(src);
      }
      filled = true;
    }
    return filled;
  }));

  add(body, section("Результат и доставка", s => {
    let filled = false;
    const dl = document.createElement("dl"); dl.className = "kv";
    const r = d.review;
    if (r && r.verdict === "approved") {
      row(dl, "Ревью", ru(VERDICT_RU, r.verdict), r.src);
      const by = Object.entries(r.by_severity || {}).map(([k, v]) => k + " " + v).join(", ");
      row(dl, "Находок", r.findings + (by ? " (" + by + ")" : ""), r.src);
    }
    /* The document first, the receipts after it. The receipts were all anyone
       looked at, and they answer a different question: 783 had two of them and
       its report had still not left the server. */
    const hand = d.handoff;
    if (hand) {
      row(dl, "Документ", hand.name + (hand.bytes ? " · " + bytes(hand.bytes) : ""), hand.src);
      if (hand.count > 1) row(dl, "Всего документов", hand.count, hand.src);
      row(dl, "Доставлено", hand.delivered ? "да" : "нет", hand.delivered_src);
    }
    if (d.delivery) {
      row(dl, "Сообщений", d.delivery.count, d.delivery.src);
      row(dl, "Последнее", stamp(d.delivery.last_at), d.delivery.src);
      row(dl, "По событию", d.delivery.last_kind, d.delivery.src);
    }
    if (dl.children.length) { s.appendChild(dl); filled = true; }
    if (hand && !hand.delivered) {
      const warn = document.createElement("div");
      warn.className = "src warn";
      warn.textContent = "Работа закончена, документ лежит в каталоге задачи, а того, "
        + "что его кто-то получил, на диске нет. Так пролежал час отчёт задачи 783.";
      s.appendChild(warn);
      filled = true;
    }
    const gates = d.gates || [];
    if (gates.length) {
      const head = document.createElement("div");
      head.className = "src"; head.textContent = "наблюдено: гейты verification.md";
      for (const g of gates) {
        const line = document.createElement("div");
        line.className = "gate";
        const mark = document.createElement("span");
        mark.className = "r " + (g.result === "OK" ? "ok" : "bad");
        mark.textContent = g.result;
        const n = document.createElement("span"); n.textContent = g.gate;
        line.appendChild(mark); line.appendChild(n);
        s.appendChild(line);
      }
      s.appendChild(head);
      filled = true;
    }
    return filled;
  }));

  /* The machinery of the run. It is reference — which runner, which sandbox,
     which files moved — so it is last and folded, and `<details>` is used
     because the browser already gives it a focus, a name and a state. */
  const tech = document.createElement("details");
  tech.className = "tech";
  const sum = document.createElement("summary");
  sum.textContent = "Технические детали прогона";
  tech.appendChild(sum);
  const dl = document.createElement("dl"); dl.className = "kv";
  row(dl, "Раннер", d.runner, "поле runner в .runner/runner.json");
  row(dl, "Рабочий процесс", ru(WORKFLOW_RU, d.workflow), "поле workflow в .runner/runner.json");
  row(dl, "Песочница", ru(SANDBOX_RU, d.sandbox), "поле sandbox в .runner/runner.json");
  row(dl, "Репозиторий предмета", d.repo, "поле --repo в .runner/runner.json");
  row(dl, "Ярлык прогона", ru(RUN_STATE_RU, d.state), "поле state в status.json");
  row(dl, "Код возврата", d.exit_code === null || d.exit_code === undefined
      ? null : String(d.exit_code), ".runner/runner.json");
  if (d.moved) {
    row(dl, "Последнее движение артефактов", stamp(d.moved), d.moved_src);
  }
  if (dl.children.length) tech.appendChild(dl);
  const files = d.files || [];
  if (files.length) {
    const box = document.createElement("div");
    box.className = "files";
    for (const f of files) {
      const line = document.createElement("div");
      const n = document.createElement("span"); n.className = "n"; n.textContent = f.name;
      const m = document.createElement("span"); m.className = "m";
      m.textContent = [bytes(f.bytes), stamp(f.at)].filter(Boolean).join(" · ");
      line.appendChild(n); line.appendChild(m);
      box.appendChild(line);
    }
    tech.appendChild(box);
    const src = document.createElement("div");
    src.className = "src";
    /* Names, sizes and times. Opening any of them would be reading the work
       rather than observing it, and a transcript is never listed at all. */
    src.textContent = "имена, размеры и время изменения: " + d.dir
      + " — содержимое не читается, транскрипты не показываются";
    tech.appendChild(src);
  }
  if (dl.children.length || files.length) body.appendChild(tech);

  return body;
}

/* Where the board was when the card was opened, so closing puts the eye back on
   the plate it came from. The card takes the page rather than floating over it —
   that is what removed the last scrollbar inside a box — so the offset has to be
   remembered here instead of being kept by a layer that never moved. */
let boardScroll = 0;

/* `keepScroll` is for a live refresh redrawing the card that is already open on
   the same task. Opening a card is a navigation and starts at its top; a
   ten-second poll is not, and sending the reader back to the top of a card they
   were halfway down is the same interruption `location.reload()` used to be. */
function openCard(p, keepScroll) {
  if (!openTask) boardScroll = window.scrollY;
  const wasAt = window.scrollY;
  openTask = p.task;
  el("cardnum").textContent = p.id === null ? "—" : "#" + p.id;
  el("cardname").textContent = p.title;
  const body = el("cardbody");
  body.textContent = "";
  body.appendChild(cardBody(p));
  el("card").classList.add("open");
  el("board").style.display = "none";
  window.scrollTo(0, keepScroll ? wasAt : 0);
}

function closeCard() {
  openTask = null;
  el("card").classList.remove("open");
  el("board").style.display = "flex";
  window.scrollTo(0, boardScroll);
}

el("cardclose").addEventListener("click", closeCard);
window.addEventListener("keydown", e => { if (e.key === "Escape" && openTask) closeCard(); });
el("card").addEventListener("click", e => { if (e.target === el("card")) closeCard(); });

/* Which areas the viewer folded open survives a live refresh, so an update
   never yanks the screen out from under someone reading it. */
const shutKey = (col, area) => "shut:" + col + ":" + area;
function isShut(col, area, byDefault) {
  const stored = sessionStorage.getItem(shutKey(col, area));
  return stored === null ? byDefault : stored === "1";
}

function areaNode(panel, area) {
  const node = document.createElement("section");
  const shut = isShut(panel.key, area.key, area.collapsed);
  /* An empty area still shows its heading — that heading is the answer «ничего
     не ждёт решения» — but it must not hold vertical space away from the areas
     that have something to show. */
  node.className = "area a-" + area.key + (shut ? " shut" : "") + (area.count ? "" : " void");

  const title = document.createElement("h3");
  /* The heading is still a heading; what folds it is a button inside it, so the
     fold has a focus, a name and a stated state. */
  const head = document.createElement("button");
  head.className = "areahead";
  head.appendChild(document.createTextNode(area.title + " "));
  const n = document.createElement("span");
  n.className = "n"; n.textContent = area.count;
  head.appendChild(n);
  if (area.hidden) head.appendChild(document.createTextNode(" (показано " +
      area.plates.length + ", скрыто " + area.hidden + ")"));
  /* «Старшая» is a comparison, and one plate has nothing to be older than. The
     user said so directly: «Если в группе одна задача, слово „старшая“ не
     показывать». Its age is on the plate itself either way. */
  const oldest = ago(area.oldest);
  if (oldest && area.count > 1) {
    const old = document.createElement("span");
    old.className = "old"; old.textContent = "старшая: " + oldest;
    head.appendChild(old);
  }
  asFolder(head, shut, () => {
    const now = !node.classList.contains("shut");
    node.classList.toggle("shut", now);
    sessionStorage.setItem(shutKey(panel.key, area.key), now ? "1" : "0");
    return now;
  });
  title.appendChild(head);
  node.appendChild(title);

  if (AREA_RULE[area.key]) {
    const rule = document.createElement("div");
    rule.className = "rule"; rule.textContent = AREA_RULE[area.key];
    node.appendChild(rule);
  }

  const plates = document.createElement("div");
  plates.className = "plates";
  if (!area.count) {
    const empty = document.createElement("div");
    empty.className = "empty";
    /* «Ждёт решения человека» is drawn even when empty: an empty area is an
       answer to the question, and a missing one is not. */
    empty.textContent = area.key === "waiting_human"
      ? "ничего: всё, что спрашивали у пользователя, отвечено" : "пусто";
    plates.appendChild(empty);
  }
  for (const p of area.plates) plates.appendChild(plateNode(p, area.key));
  /* The product's own open questions, in the same area and the same count as the
     tasks. They are questions to the same person; splitting them into a second
     place with a second number is how seventeen of them stayed off the board. */
  for (const q of (area.questions || [])) plates.appendChild(questionNode(q, area.key));
  for (const q of (area.promises || [])) plates.appendChild(promiseNode(q));
  node.appendChild(plates);
  return node;
}

/* The rule that picked what an area holds, printed with the area. «Надо
   запланировать» is the one area whose entire content is text chosen by a test,
   and the test says less than the heading: what is observed is that no task
   could be linked to the line, which is not the same claim as «эта работа не
   начата». The rule used to be «в строке нет номера задачи», and under it three
   of the four shown lines already had tasks (finding HIGH-1 of review 814). A
   reader who can see the rule can judge the list. */
const AREA_RULE = {
  plan: "строки раздела «В работе», для которых не удалось наблюсти задачу: сверка идёт по номеру-ссылке, по названию задачи в строке и по слагу — под каждой строкой написано, с чем её сверили",
  pickup: "живого прогона нет, гейты не отказали, и ничто на диске эту задачу не держит",
  queued: "стоит за названным держателем — он в строке каждой плашки",
  /* The rule of the area whose contents the user counted by hand and found
     thirteen of sixteen wrong. Printing it is what lets the next reader do the
     same check in a minute instead of an evening. */
  waiting_human: "только то, что спрошено у пользователя письмом или сообщением — с датой и идентификатором — и на что ответа не наблюдалось: ни письма от него в том же треде, ни решения, записанного в строке",
  product_owner: "наши собственные вопросы: открытые, но пользователю их не задавали, либо он ответил, а решение осталось незаписанным. Решает продакт, а не человек",
  ready_to_start: "у задачи записано машиночитаемое условие запуска — после каких задач и какое рабочее дерево она занимает, — и по наблюдению ничто из названного её больше не держит",
  decision_unmet: "на задаче записано решение продакта, а наблюдения, что оно исполнено, нет: для доставки таким наблюдением служит delivery.md или квитанция с идентификатором сообщения",
  undelivered: "задача завершена, документ для человека лежит в каталоге задачи, а свидетельства доставки нет: ни delivery.md, ни квитанции о документе — только события жизненного цикла прогона",
};

function questionNode(q, areaKey) {
  const node = document.createElement("div");
  node.className = "plate p-" + areaKey + " q";
  const head = document.createElement("div");
  head.className = "head";
  const num = document.createElement("span");
  num.className = "num"; num.textContent = q.owner === "user" ? "?" : "·";
  const name = document.createElement("span");
  name.className = "name"; name.textContent = q.text;
  head.appendChild(num); head.appendChild(name);
  node.appendChild(head);
  const row = document.createElement("div");
  row.className = "row";
  const sources = [["Вопрос", "раздел «Открытые вопросы» в products/" + q.product + "/product.md"]];
  row.appendChild(tag("вопрос продукта " + q.product));
  /* When it went out, through what, and with which message. This is the whole
     of the rule: an area that tells a person they are blocking work has to show
     what put the question in front of them, and the date and the message are
     what a reader checks it by. */
  if (q.asked_at) {
    const when = tag("спрошено " + q.asked_at + " · " +
      (q.channel === "email" ? "письмо " : "Telegram ") + q.ref);
    if (q.asked_src) sources.push(["Спрошено", q.asked_src]);
    row.appendChild(when);
  }
  node.appendChild(row);
  const bits = [];
  if (q.answer_src) bits.push("ответ: " + q.answer_src);
  if (q.note) bits.push(q.note);
  if (bits.length) {
    const note = document.createElement("div");
    note.className = "asked"; note.textContent = bits.join(" · ");
    node.appendChild(note);
  }
  sourceNote(node, sources);
  return node;
}

function promiseNode(q) {
  const node = document.createElement("div");
  node.className = "plate p-plan q";
  const head = document.createElement("div");
  head.className = "head";
  const num = document.createElement("span");
  num.className = "num"; num.textContent = "•";
  const name = document.createElement("span");
  name.className = "name"; name.textContent = q.text;
  head.appendChild(num); head.appendChild(name);
  node.appendChild(head);
  const row = document.createElement("div");
  row.className = "row";
  row.appendChild(tag("«В работе» продукта " + q.product));
  /* What the line is claimed to be, in the words the observation supports. «Связь
     с задачей не установлена» is a statement about a comparison that failed;
     «задачи нет» would be a statement about the world, and the previous version
     made it on evidence that could not carry it. The comparison itself hangs on
     the same line, so the reader can check the verdict instead of trusting it. */
  row.appendChild(tag("связь с задачей не установлена"));
  node.appendChild(row);
  sourceNote(node, [["Строка", "раздел «В работе» в products/" + q.product + "/product.md"],
                    ["Сверка", q.checked]]);
  return node;
}

function channelsNode(panel) {
  const node = document.createElement("div");
  const shut = isShut(panel.key, "chan", true);
  node.className = "chan" + (shut ? " shut" : "");

  /* The summary carries what a folded block must not hide: a repository with
     uncommitted or unpushed work is work that exists and is invisible in prose,
     which is one of the things the board is for. */
  const dirty = panel.repos.filter(r => r.tracked_dirty || r.unpushed);
  const sum = document.createElement("button");
  sum.className = "sum";
  sum.textContent = "Репозитории и связь: " + panel.repos.length;
  if (dirty.length) {
    const warn = document.createElement("span");
    warn.className = "warn";
    warn.textContent = " — не опубликовано в " + dirty.length +
      (dirty.length === 1 ? " репозитории" : " репозиториях");
    sum.appendChild(warn);
  }
  asFolder(sum, shut, () => {
    const now = !node.classList.contains("shut");
    node.classList.toggle("shut", now);
    sessionStorage.setItem(shutKey(panel.key, "chan"), now ? "1" : "0");
    return now;
  });
  node.appendChild(sum);

  const body = document.createElement("div");
  body.className = "body";
  const names = { telegram: "Telegram", email: "Почта продакта", git: "Git" };
  const out = [];
  for (const c of panel.channels) {
    out.push(names[c.channel] + (c.direction === "in" ? " входящих " : " исходящих ") + c.count);
  }
  if (out.length) {
    const line = document.createElement("div");
    line.textContent = "Связь: " + out.join(" · ");
    body.appendChild(line);
  }
  /* Commits and pushes at the level of the product, not the task: nothing on
     disk ties a commit to a task number, so no such tie is drawn. */
  for (const repo of panel.repos) {
    const line = document.createElement("div");
    const head = document.createElement("b");
    head.textContent = repo.name;
    line.appendChild(head);
    line.appendChild(document.createTextNode(" " + (repo.branch || "?") + " · " +
      (repo.head || "?") + " · " + (repo.head_subject || "")));
    if (repo.tracked_dirty || repo.unpushed) {
      const warn = document.createElement("span");
      warn.className = "warn";
      const bits = [];
      if (repo.tracked_dirty) bits.push("незакоммичено " + repo.tracked_dirty);
      if (repo.unpushed) bits.push("не отправлено " + repo.unpushed);
      warn.textContent = " — " + bits.join(", ");
      line.appendChild(warn);
    }
    body.appendChild(line);
  }
  node.appendChild(body);
  return node;
}

function stripItem(p, cls) {
  const s = document.createElement("span");
  s.className = "item " + cls;
  const bits = ["#" + p.id, p.title];
  if (p.actor) bits.push("— " + p.actor);
  if (p.role) bits.push("(" + (ROLE_RU[p.role] || p.role) + ")");
  const age = ago(ageOf(p));
  if (age) bits.push("· " + age);
  s.textContent = bits.join(" ");
  /* The jam is named on the first screen, so its reason has to be there too:
     «где затор» without «почему» is two thirds of an acceptance question. The
     text is shown as its own span and in full, so it is read rather than
     hovered over or cut. The observed reason and a live child's activity line
     are two different facts — as they are on the plate — so they keep two
     classes: `.why` carries a paired source and `.doing` does not. */
  const why = p.why || p.happening;
  if (why) {
    const w = document.createElement("span");
    w.className = p.why ? "why" : "doing"; w.textContent = " — " + human(why);
    s.appendChild(w);
  }
  /* The direction this item belongs to and what observed its reason. Both used
     to be `title`, which is to say neither existed on a phone. */
  sourceNote(s, [["Направление", p.thread],
                 [p.why ? "Почему" : "Что делает", p.why ? p.why_src : "строка progress.json ребёнка"]]);
  return s;
}

/* The headline of the whole board: what the user still owes, what it is made of,
   and what we owe ourselves. The two numbers stand together because the split
   between them is the point — a number that merely got smaller would read as
   questions having been thrown away. */
function waitingGroup(board) {
  const grp = document.createElement("div");
  grp.className = "grp";
  const lbl = document.createElement("span");
  lbl.className = "lbl"; lbl.textContent = "Ждёт решения пользователя";
  const n = document.createElement("span");
  n.className = board.waiting ? "ask" : "none";
  /* The number, and what it is made of. A single figure nobody could take apart
     is what let thirteen wrong entries stand as an answer; split by source, a
     reader can check it against the first area of the columns below. */
  const parts = [];
  if (board.waiting_tasks) parts.push(board.waiting_tasks + " в задачах");
  if (board.waiting_questions) parts.push(board.waiting_questions + " вопросов продуктов");
  n.textContent = board.waiting
    ? board.waiting + " — " + parts.join(" и ") + ", первой областью в колонках ниже"
    : "ничего: всё, что спрашивали у него, отвечено";
  grp.appendChild(lbl); grp.appendChild(n);
  const ours = document.createElement("span");
  ours.className = board.ours ? "ours" : "none";
  ours.textContent = board.ours
    ? "· решает продакт: " + board.ours + ", своей областью в колонках"
    : "· у продакта нерешённого нет";
  grp.appendChild(ours);
  return grp;
}

function drawStrip(board) {
  const strip = el("strip");
  strip.textContent = "";
  const groups = [
    ["Кто работает сейчас", board.now, "who", "никто: живых прогонов нет", board.now_hidden],
    ["Где затор", board.jams, "jam", "заторов нет", board.jams_hidden],
    /* The first question of every wake-up, so it stands on the first screen
       beside the other two rather than under a fold. */
    ["Что подхватить", board.pickup, "pick", "нечего: свободных задач нет", board.pickup_hidden],
    /* Finished work whose result nobody was shown. It is on the strip because
       that is the only place it would have been noticed: 783 finished at 16:14
       and its 441 KB report lay on the server for an hour, behind two receipts
       that both spoke about the life of the run. */
    ["Сделано, но не доставлено", board.undelivered, "undelivered",
     "нет: у всего завершённого есть свидетельство доставки", board.undelivered_hidden],
  ];
  /* The headline stands first, before the names. It is the question that made
     this board wrong — sixteen entries of which the user owned three — so it is
     the one line that must be читаемо without scrolling anything, including on a
     390-wide screen where the strip is several lines tall. */
  strip.appendChild(waitingGroup(board));
  for (const [label, items, cls, empty, hidden] of groups) {
    const grp = document.createElement("div");
    grp.className = "grp";
    const lbl = document.createElement("span");
    lbl.className = "lbl"; lbl.textContent = label;
    grp.appendChild(lbl);
    if (!items.length) {
      const none = document.createElement("span");
      none.className = "none"; none.textContent = empty;
      grp.appendChild(none);
    }
    for (const p of items) grp.appendChild(stripItem(p, cls));
    /* The strip shows as many names as fit with their reason whole, so what it
       did not take has to be counted here: a cap nobody can see reads as
       «показано всё», and the rest stands in the columns below. */
    if (hidden > 0) {
      const more = document.createElement("span");
      more.className = "more";
      more.textContent = "ещё " + hidden + " — в колонках ниже";
      grp.appendChild(more);
    }
    strip.appendChild(grp);
  }
  /* The second instance of the product owner. Two pairs of duplicate tasks were
     created in one hour — 790/792 and 791/793 — because the owner in the chat
     and the owner woken by the timer each had their own queue and neither could
     see the other's. Knowing another one is awake is what prevents the third
     pair, so it stands on the strip and not in a column.

     The field stood empty on every board the user ever opened, and the reason
     was not that nobody was awake. Only a running `thread_tick.py` was ever
     matched, and a tick that finds nothing lives about a second per twenty
     minutes — while the *other* half of the pair that created 790/792 and
     791/793, the console owner, ran for hours and matched nothing at all. Both
     are observed now, and each says which working trees it could occupy,
     because that is the only thing a collision is actually about. */
  const awake = board.owners_awake || [];
  const mine = document.createElement("div");
  mine.className = "grp";
  const ml = document.createElement("span");
  ml.className = "lbl"; ml.textContent = "Другой я";
  mine.appendChild(ml);
  if (!awake.length) {
    const none = document.createElement("span");
    none.className = "none";
    none.textContent = "никто больше не разбужен";
    mine.appendChild(none);
  }
  for (const owner of awake) {
    const s = document.createElement("span");
    s.className = "item jam";
    const age = ago(ageOf({ since: owner.since, age_seconds: owner.age_seconds }));
    const who = owner.kind === "tick"
      ? "фоновое пробуждение треда «" + (owner.thread || "?") + "»"
      : owner.kind === "woken" ? "продакт, разбуженный тиком" : "продакт в консоли";
    const trees = (owner.worktrees || []).map(path => path.split("/").pop()).join(", ");
    s.textContent = who + (age ? " · " + age : "")
      + (trees ? " · может занять " + trees : " · рабочее дерево не названо")
      + " — сверьтесь с его очередью, прежде чем заводить задачу";
    s.title = "наблюдено: " + owner.src;
    mine.appendChild(s);
  }
  strip.appendChild(mine);
}

/* When the owner of this direction looks next, when it looked last and what came
   of that look. The user's question in their own words: «панель показывает, что
   в работе ничего нет… тогда почему ничего не делаешь?» — a board that shows a
   column of zeros and never says when anybody last checked leaves that question
   with nowhere to go.

   Every value about the last check is what the tick wrote into
   `state/threads/<тред>.json` at the moment of that check; the next check is
   what systemd reported while this document was being collected. Nothing here
   is the prose of a woken agent, and nothing is recomputed by the page: the
   outcome is the difference between the live runs the tick saw before waking
   the owner and the ones it saw after. */
function checkNode(check, nextCheck) {
  const node = document.createElement("div");
  node.className = "check";

  /* The next check is drawn even when no tick has ever run for this direction:
     the two answers come from two different observations, and «проверок ещё не
     было» says nothing about when the timer fires. */
  if (nextCheck) {
    const next = document.createElement("span");
    next.className = "next";
    next.textContent = nextCheck.at
      ? "следующая проверка " + stamp(nextCheck.at)
      : "когда следующая проверка — неизвестно";
    next.title = "наблюдено: " + nextCheck.src;
    node.appendChild(next);
    /* With no time, the observation that came instead of one is the whole
       answer, so it is printed as text rather than hidden in the tooltip
       above — on a touch screen that tooltip does not exist. */
    if (!nextCheck.at) {
      const why = document.createElement("span");
      why.className = "nextwhy";
      why.textContent = "наблюдено: " + nextCheck.src;
      node.appendChild(why);
    }
  }

  if (!check) {
    const none = document.createElement("span");
    none.className = "last";
    none.textContent = "проверок этого направления ещё не было";
    node.appendChild(none);
    if (!nextCheck) node.classList.add("none");
    return node;
  }

  const last = document.createElement("span");
  last.className = "last";
  last.textContent = "прошлая " + stamp(check.at) + " — " + check.outcome;
  last.title = "наблюдено: " + check.outcome_src + "; " + check.src;
  node.appendChild(last);

  /* The reasons are shown only when the check finished and started nothing. A
     direction that put three tasks in motion does not owe an excuse, and a
     check still in progress (`started === null`) has not decided anything yet —
     printing «запустил 3 — задачи 823, 872, 873» and «причина простоя не
     наблюдается» in one column is how the first cut of this line read. What the
     reasons do answer is the user's own complaint: «везде нули» with nothing
     said about why. */
  const idle = !check.queue.live && (check.queue.pickup + check.queue.ready + check.queue.decided);
  if (idle && Array.isArray(check.started) && !check.started.length) {
    for (const reason of check.reasons) {
      const why = document.createElement("span");
      why.className = "why" + (reason.code === "none_observed" ? " alarm" : "");
      why.textContent = reason.text;
      why.title = "наблюдено: " + reason.src;
      node.appendChild(why);
    }
  }
  return node;
}

function drawBoard(board, snapshot) {
  drawStrip(board);
  const columns = el("columns");
  columns.textContent = "";
  for (const panel of board.panels) {
    const col = document.createElement("div");
    col.className = "col";

    const head = document.createElement("div");
    head.className = "colhead";
    const h2 = document.createElement("h2");
    h2.textContent = panel.title;
    const meta = document.createElement("div");
    meta.className = "meta";
    const running = panel.areas.find(a => a.key === "running").count;
    const waiting = panel.areas.find(a => a.key === "waiting_human").count;
    const stuck = panel.areas.find(a => a.key === "stuck").count;
    const ours = panel.areas.find(a => a.key === "product_owner").count;
    const undelivered = panel.areas.find(a => a.key === "undelivered").count;
    meta.textContent = "задач " + panel.task_count + " · в работе " + running +
                       " · ждёт пользователя " + waiting + " · решает продакт " + ours +
                       " · заторов " + stuck + " · не доставлено " + undelivered;
    head.appendChild(h2); head.appendChild(meta);
    head.appendChild(checkNode(panel.check, panel.next_check));
    col.appendChild(head);

    const body = document.createElement("div");
    body.className = "colbody";
    for (const area of panel.areas) body.appendChild(areaNode(panel, area));
    col.appendChild(body);
    col.appendChild(channelsNode(panel));
    columns.appendChild(col);
  }

  const totals = board.panels.reduce((acc, p) => {
    for (const a of p.areas) acc[a.key] = (acc[a.key] || 0) + a.count;
    return acc;
  }, {});
  el("boardsub").textContent = "в работе " + (totals.running || 0) +
    " · ждёт решения пользователя " + (totals.waiting_human || 0) +
    " · решает продакт " + (totals.product_owner || 0) +
    " · заторов " + (totals.stuck || 0) +
    " · сделано, но не доставлено " + (totals.undelivered || 0) +
    " · можно подхватить " + (totals.pickup || 0) +
    " · надо запланировать " + (totals.plan || 0) +
    " · собрано " + new Date(DATA.built_at).toLocaleString("ru-RU");
  el("boardmode").textContent = snapshot.mode === "demo" ? "обезличено" : "";
}

/* Redraw in place with a fresher document. Live mode used to call
   `location.reload()`, which is fine for a picture and wrong for a tool: it
   throws away the open card, the scroll position and the selection every ten
   seconds, so a person reading a task would be interrupted mid-sentence by a
   repository going dirty somewhere else. The board is rebuilt from the new
   payload, the folded areas already survive through `sessionStorage`, and the
   open card is reopened on the same task if that task is still there. */
function applyFresh(fresh) {
  DATA.snapshot = fresh.snapshot;
  DATA.board = fresh.board;
  DATA.world = fresh.world;
  DATA.timeline = fresh.timeline;
  DATA.built_at = fresh.built_at;
  DATA.digest = fresh.digest;
  const wanted = openTask;
  /* The page is what scrolls now, so the place to keep is the page offset. It
     used to be `#columns.scrollTop`, which is zero on a board that no longer
     has a scrollbar of its own — a live refresh would have quietly sent every
     reader back to the top. */
  const scroll = wanted ? boardScroll : window.scrollY;
  drawBoard(DATA.board, DATA.snapshot);
  boardScroll = scroll;
  if (!wanted) window.scrollTo(0, scroll);
  if (wanted) {
    const again = DATA.board.panels
      .flatMap(p => p.areas).flatMap(a => a.plates)
      .find(p => p.task === wanted);
    /* Gone from the board — folded into `Сделано`, or dropped by a cap — is not
       the same as unchanged, so the card closes rather than showing a state
       that is no longer the board's. The card that stays keeps the place the
       reader was at: redrawing it from the top every ten seconds is what the
       user meant by «при перезагрузке данных на открытой задаче не терять
       позицию прокрутки». */
    if (again) openCard(again, true); else closeCard();
  }
}

/* ---------- two screens ---------- */
const MAP_PARTS = ["stage", "top", "legend", "panels", "bottom"];
function showBoard(on) {
  if (on && openTask) closeCard();     // the card belongs to the board screen
  /* The tooltip belongs to the map, so it leaves with it. Both facts are put
     away together — the pointer's last pick and the box on screen — because a
     stale `hover` with a hidden box comes back the moment a frame is drawn. */
  mapOpen = !on;
  if (on) hideTip();
  el("board").style.display = on ? "flex" : "none";
  el("card").style.display = on ? "" : "none";
  for (const id of MAP_PARTS) el(id).style.display = on ? "none" : "";
  el("toboard").classList.toggle("on", on);
  el("tomap").classList.toggle("on", !on);
  /* The one place the dark palette is turned on, and it is bound to the screen
     that needs it: the map is a dark canvas, so its chrome has to be readable
     over it. The board is light and does not scroll under a drag. */
  document.body.classList.toggle("mapmode", !on);
  sessionStorage.setItem("screen", on ? "board" : "map");
  if (!on) { resize(); fit(); }        // the canvas had no size while hidden
}
el("toboard").addEventListener("click", () => showBoard(true));
el("tomap").addEventListener("click", () => showBoard(false));
el("tomapback").addEventListener("click", () => showBoard(true));

drawBoard(BOARD, SNAP);
setInterval(() => {
  for (const node of document.querySelectorAll(".tag.age[data-since]")) {
    const age = ago(ageOf({ since: node.dataset.since }));
    if (age) node.textContent = ageCaption(age);
  }
}, 30000);
window.addEventListener("resize", resize);
resize();
requestAnimationFrame(frame);
/* The board is the default screen. The timeline from the previous version stays
   as a second mode, one button away, and starts playing only when opened. */
showBoard(sessionStorage.getItem("screen") !== "map");
setTimeout(() => { if (sessionStorage.getItem("screen") === "map") setPlaying(true); }, 700);

/* Live mode: the same renderer, served with a fresh snapshot. A recording never
   takes this branch — `file://` cannot fetch, and its data is already inside. */
if (DATA.live_url) {
  el("mode").textContent = "живой режим";
  setInterval(async () => {
    try {
      const fresh = await (await fetch(DATA.live_url, { cache: "no-store" })).json();
      /* The digest covers the whole shown document, not the length of the
         timeline. A status change, a run that died, a repository gone dirty —
         none of them append a record, and all of them have to reach the screen
         (finding MEDIUM-1 of review 780). */
      if (fresh.digest !== DATA.digest) applyFresh(fresh);
    } catch (err) { /* server gone: keep showing what we have */ }
  }, 10000);
}
</script>
