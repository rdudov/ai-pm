# Своё время пробуждения для направления «deep-research».
#
# Четыре таймера заведены из одного шаблона с OnUnitActiveSec=20min и
# AccuracySec=1min, поэтому просыпались в одну и ту же секунду: 2026-08-07
# 16:06:56 и 16:47:00 стартовали все четыре сразу. Дальше yielded() уступал
# дорогу любому другому бодрствующему тику, и на каждом синхронном пробуждении
# действовать мог только один тред — всегда «process», просто потому что он
# поднимался последним и уступать ему было некому.
#
# Разнесение по времени убирает столкновение целиком, а не смягчает его: у
# каждого направления своя минута внутри двадцатиминутного шага. OnCalendar,
# а не OnUnitActiveSec, ещё и потому, что момент следующего пробуждения обязан
# быть известен заранее — панель показывает его пользователю, а монотонный
# таймер знает его только после того, как прогон закончился.
[Timer]
OnBootSec=
OnUnitActiveSec=
OnCalendar=*:15/20
AccuracySec=1s
RandomizedDelaySec=0
