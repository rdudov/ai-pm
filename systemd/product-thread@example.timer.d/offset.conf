# Своё время пробуждения для направления «example».
#
# Пример, который стоит повторить для каждого направления. Таймеры, заведённые
# из одного шаблона с OnUnitActiveSec, просыпаются в одну и ту же секунду; на
# синхронном пробуждении действовать может только одно направление, потому что
# остальные уступают дорогу бодрствующему продакту. Разнесение по времени
# убирает столкновение целиком, а не смягчает его: у каждого направления своя
# минута внутри двадцатиминутного шага.
#
# OnCalendar, а не OnUnitActiveSec, ещё и потому, что момент следующего
# пробуждения обязан быть известен заранее — панель показывает его
# пользователю, а монотонный таймер знает его только после того, как прогон
# закончился.
#
# Кладётся в /etc/systemd/system/product-thread@example.timer.d/offset.conf.
[Timer]
OnBootSec=
OnUnitActiveSec=
OnCalendar=*:00/20
AccuracySec=1s
RandomizedDelaySec=0
